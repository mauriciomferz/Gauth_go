apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentauth-green
  namespace: agentauth-staging
  labels:
    app: agentauth
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentauth
      version: green
  template:
    metadata:
      labels:
        app: agentauth
        version: green
    spec:
      containers:
      - name: agentauth
        image: ghcr.io/mauriciomferz/agentauth:green
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AGENTAUTH_WEB_PORT
          value: "8080"
        - name: AGENTAUTH_ENV
          value: "staging"
        - name: AGENTAUTH_LOG_LEVEL
          value: "info"
        - name: VERSION
          value: "green"
        - name: VERSION
          value: "green"
        - name: AGENTAUTH_REVOCATION_ENABLED
          value: "1"
        - name: AGENTAUTH_JWT_SIGNING_KEY
          value: "staging-secret-key-change-in-prod"
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
