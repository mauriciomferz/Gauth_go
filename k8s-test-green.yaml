apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauth-green
  namespace: gauth-staging
  labels:
    app: gauth
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gauth
      version: green
  template:
    metadata:
      labels:
        app: gauth
        version: green
    spec:
      containers:
      - name: gauth
        image: gauth-mock:green
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VERSION
          value: green
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
          limits:
            memory: 128Mi
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
