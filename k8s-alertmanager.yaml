---
# AlertManager ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: agentauth-staging
  labels:
    app: alertmanager
    component: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # Slack configuration (replace with your webhook URL)
      slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    
    # Route tree for alert routing
    route:
      # Default receiver
      receiver: 'default'
      # Group alerts by these labels
      group_by: ['alertname', 'cluster', 'service']
      # Wait before sending first notification
      group_wait: 10s
      # Wait before sending notifications for new alerts in group
      group_interval: 10s
      # Wait before re-sending notification
      repeat_interval: 12h
      
      # Child routes with specific matching
      routes:
        # Critical alerts - immediate notification
        - match:
            severity: critical
          receiver: 'critical-alerts'
          group_wait: 5s
          repeat_interval: 1h
          continue: true
        
        # Warning alerts - standard notification
        - match:
            severity: warning
          receiver: 'warning-alerts'
          group_wait: 30s
          repeat_interval: 4h
        
        # Database alerts
        - match:
            category: database
          receiver: 'database-alerts'
          group_wait: 10s
          repeat_interval: 2h
        
        # Redis alerts
        - match:
            category: redis
          receiver: 'redis-alerts'
          group_wait: 10s
          repeat_interval: 2h
    
    # Inhibition rules - suppress alerts when other alerts are firing
    inhibit_rules:
      # Inhibit warning if critical is firing for same alert
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'cluster', 'service']
      
      # Inhibit service alerts if pod is down
      - source_match:
          alertname: 'PodCrashLooping'
        target_match:
          alertname: 'HighErrorRate'
        equal: ['namespace', 'pod']
    
    # Receivers - notification endpoints
    receivers:
      # Default receiver (no notifications, just log)
      - name: 'default'
      
      # Critical alerts - Slack + email + PagerDuty
      - name: 'critical-alerts'
        slack_configs:
          - channel: '#agentauth-critical-alerts'
            title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
            text: >-
              *Summary:* {{ .CommonAnnotations.summary }}
              
              *Description:* {{ .CommonAnnotations.description }}
              
              *Severity:* {{ .CommonLabels.severity }}
              
              *Cluster:* {{ .CommonLabels.cluster }}
              
              *Namespace:* {{ .CommonLabels.namespace }}
              
              *Runbook:* {{ .CommonAnnotations.runbook_url }}
            send_resolved: true
        # Email configuration (uncomment and configure)
        # email_configs:
        #   - to: 'oncall@example.com'
        #     from: 'alertmanager@example.com'
        #     smarthost: 'smtp.gmail.com:587'
        #     auth_username: 'alertmanager@example.com'
        #     auth_password: 'your-password'
      
      # Warning alerts - Slack only
      - name: 'warning-alerts'
        slack_configs:
          - channel: '#agentauth-alerts'
            title: '⚠️  WARNING: {{ .GroupLabels.alertname }}'
            text: >-
              *Summary:* {{ .CommonAnnotations.summary }}
              
              *Description:* {{ .CommonAnnotations.description }}
              
              *Severity:* {{ .CommonLabels.severity }}
              
              *Runbook:* {{ .CommonAnnotations.runbook_url }}
            send_resolved: true
      
      # Database alerts
      - name: 'database-alerts'
        slack_configs:
          - channel: '#agentauth-database-alerts'
            title: '🗄️  Database Alert: {{ .GroupLabels.alertname }}'
            text: >-
              *Summary:* {{ .CommonAnnotations.summary }}
              
              *Description:* {{ .CommonAnnotations.description }}
              
              *Database:* {{ .CommonLabels.database }}
              
              *Runbook:* {{ .CommonAnnotations.runbook_url }}
            send_resolved: true
      
      # Redis alerts
      - name: 'redis-alerts'
        slack_configs:
          - channel: '#agentauth-redis-alerts'
            title: '📦 Redis Alert: {{ .GroupLabels.alertname }}'
            text: >-
              *Summary:* {{ .CommonAnnotations.summary }}
              
              *Description:* {{ .CommonAnnotations.description }}
              
              *Instance:* {{ .CommonLabels.instance }}
              
              *Runbook:* {{ .CommonAnnotations.runbook_url }}
            send_resolved: true

---
# AlertManager Service
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: agentauth-staging
  labels:
    app: alertmanager
    component: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9093
      targetPort: 9093
      protocol: TCP
  selector:
    app: alertmanager

---
# AlertManager StatefulSet (HA with 3 replicas)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: agentauth-staging
  labels:
    app: alertmanager
    component: monitoring
spec:
  serviceName: alertmanager
  replicas: 3
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      
      # Anti-affinity to spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - alertmanager
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
            - '--cluster.listen-address=0.0.0.0:9094'
            - '--cluster.advertise-address=$(POD_IP):9094'
            - '--cluster.peer=alertmanager-0.alertmanager.agentauth-staging.svc.cluster.local:9094'
            - '--cluster.peer=alertmanager-1.alertmanager.agentauth-staging.svc.cluster.local:9094'
            - '--cluster.peer=alertmanager-2.alertmanager.agentauth-staging.svc.cluster.local:9094'
            - '--web.listen-address=:9093'
            - '--log.level=info'
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: web
              containerPort: 9093
              protocol: TCP
            - name: cluster
              containerPort: 9094
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
  
  # Persistent volume for alert state
  volumeClaimTemplates:
    - metadata:
        name: storage
        labels:
          app: alertmanager
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi

---
# AlertManager Headless Service (for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-headless
  namespace: agentauth-staging
  labels:
    app: alertmanager
    component: monitoring
spec:
  clusterIP: None
  ports:
    - name: web
      port: 9093
      targetPort: 9093
    - name: cluster
      port: 9094
      targetPort: 9094
  selector:
    app: alertmanager
