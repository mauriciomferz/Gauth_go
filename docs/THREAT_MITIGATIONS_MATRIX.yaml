# AgentAuth Threat Mitigations Matrix
# Structured mapping of threats to implemented security controls
# Completes sec14.item1 (P2) - Threat model synchronization

version: "1.0"
last_updated: "2025-11-06"
scope: "AgentAuth AAP-001/0115 Implementation"

# STRIDE categorization reference
stride_categories:
  - Spoofing: "Impersonating something or someone else"
  - Tampering: "Modifying data or code"
  - Repudiation: "Claiming to have not performed an action"
  - Information_Disclosure: "Exposing information to unauthorized parties"
  - Denial_of_Service: "Denying or degrading service availability"
  - Elevation_of_Privilege: "Gaining unauthorized capabilities"

# Threat catalog with mitigations
threats:
  T1_Token_Replay:
    id: "T1"
    name: "Token Replay"
    description: "Stolen token used within validity window for unauthorized actions"
    stride: ["Spoofing", "Elevation_of_Privilege"]
    impact: "High - Unauthorized action execution"
    likelihood_current: "Low"
    likelihood_rationale: "Distributed JTI store + metrics enable detection and prevention"
    
    mitigations:
      - control_id: "M01"
        type: "Preventive"
        description: "Short-lived tokens with bounded delegation duration"
        implementation:
          - "pkg/agentauth/agentauth.go:VerifyToken"
          - "pkg/rfc0111/rfc0111.go:ValidateDelegationCtx"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M02"
        type: "Preventive"
        description: "JTI replay cache (first-seen acceptance, then reject)"
        implementation:
          - "pkg/agentauth/replay_store_bolt.go:BoltReplayStore"
          - "pkg/replay/durable_replay_store.go:DurableReplayStore"
          - "pkg/rfc0111/redis_replay_store.go:RedisReplayStore"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M03"
        type: "Detective"
        description: "Replay metrics for detection and alerting"
        implementation:
          - "internal/metrics/prometheus_adapter.go"
          - "pkg/rfc0111/rfc0111_metrics.go"
        status: "Implemented"
        effectiveness: "Medium"
        
      - control_id: "M04"
        type: "Preventive"
        description: "Fail-closed replay mode (reject on store errors)"
        implementation:
          - "pkg/rfc0111/rfc0111_replay_failclosed_test.go"
        status: "Implemented"
        effectiveness: "High"
        
    residual_risk: "Low - Requires token theft + use within narrow validity window"

  T2_Token_Forgery_Symmetric:
    id: "T2"
    name: "Token Forgery (Symmetric Key Compromise)"
    description: "Attacker acquires token symmetric key and mints arbitrary tokens"
    stride: ["Spoofing", "Elevation_of_Privilege"]
    impact: "Critical - Complete privilege escalation"
    likelihood_current: "Low-Medium"
    likelihood_rationale: "Key management immature; rotation support exists but retention policy needs hardening"
    
    mitigations:
      - control_id: "M05"
        type: "Preventive"
        description: "Key ring rotation support (active + previous keys)"
        implementation:
          - "internal/crypto/key_ring.go:KeyRing"
          - "internal/crypto/key_rotation.go"
        status: "Implemented"
        effectiveness: "Medium"
        
      - control_id: "M06"
        type: "Preventive"
        description: "Environment-based key material loading (not hardcoded)"
        implementation:
          - "internal/crypto/key_ring.go:NewKeyRingFromEnv"
        status: "Implemented"
        effectiveness: "Medium"
        
      - control_id: "M07"
        type: "Corrective"
        description: "Manual key rotation capability"
        implementation:
          - "internal/crypto/key_rotation.go:RotateKeys"
          - "cmd/rotate-key/main.go"
        status: "Implemented"
        effectiveness: "High"
        
    residual_risk: "Medium - Requires secure key storage deployment practices"

  T3_Signature_Forgery:
    id: "T3"
    name: "Signature Forgery"
    description: "Ed25519 private key compromise enables fake POA authenticity"
    stride: ["Tampering", "Repudiation"]
    impact: "Critical - Integrity loss, fake delegations accepted"
    likelihood_current: "Low"
    likelihood_rationale: "Keys ephemeral/in-memory by default; no persistence to disk"
    
    mitigations:
      - control_id: "M08"
        type: "Preventive"
        description: "Canonical digest + Ed25519 signature verification"
        implementation:
          - "internal/crypto/canonical.go:CanonicalDigest"
          - "internal/crypto/signer.go:Ed25519Signer"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M09"
        type: "Detective"
        description: "Strict authenticity mode flags missing keys"
        implementation:
          - "pkg/agentauth/agentauth.go:WithStrictAuthenticity"
          - "pkg/rfc0111/rfc0111.go:strictAuthenticity"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M10"
        type: "Preventive"
        description: "Key agility with algorithm-specific signers"
        implementation:
          - "internal/crypto/signer.go:GlobalRotatingSigner"
          - "internal/crypto/key_agility.go"
        status: "Implemented"
        effectiveness: "Medium"
        
    residual_risk: "Low - Requires key extraction from memory or deployment misconfiguration"

  T4_Revocation_Bypass:
    id: "T4"
    name: "Revocation Bypass"
    description: "Failure to check revocation chain integrity or event omission"
    stride: ["Elevation_of_Privilege", "Repudiation"]
    impact: "High - Continued unauthorized use after revocation"
    likelihood_current: "Low"
    likelihood_rationale: "Chain verified on each validation with hash integrity checks"
    
    mitigations:
      - control_id: "M11"
        type: "Preventive"
        description: "Revocation chain integrity verification on validation"
        implementation:
          - "internal/chains/revocation_chain.go:VerifyIntegrity"
          - "pkg/agentauth/agentauth.go:CheckRevocation"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M12"
        type: "Preventive"
        description: "Append-only hash chain with parent hash validation"
        implementation:
          - "internal/chains/hash_chain.go:AppendWithValidation"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M13"
        type: "Preventive"
        description: "Suspension and partial revocation support"
        implementation:
          - "pkg/agentauth/agentauth.go:SuspendDelegation"
          - "pkg/agentauth/agentauth.go:PartialRevocation"
        status: "Implemented"
        effectiveness: "High"
        
    residual_risk: "Low - Chain integrity enforced at validation time"

  T5_Chain_Tampering:
    id: "T5"
    name: "Chain Tampering"
    description: "Manipulated hash chain history (revocation/issuance)"
    stride: ["Tampering", "Repudiation"]
    impact: "High - Audit trail corruption, false history"
    likelihood_current: "Low-Medium"
    likelihood_rationale: "Hash chains with integrity checks; external anchoring planned but not enforced"
    
    mitigations:
      - control_id: "M14"
        type: "Preventive"
        description: "Cryptographic hash chain with parent hash linkage"
        implementation:
          - "internal/chains/hash_chain.go"
          - "internal/chains/issuance_chain.go"
          - "internal/chains/revocation_chain.go"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M15"
        type: "Detective"
        description: "External notarization of chain tips (blockchain anchoring)"
        implementation:
          - "internal/notary/blockchain_notarizer.go"
          - "internal/notary/notarization_service.go"
        status: "Implemented"
        effectiveness: "Medium"
        
      - control_id: "M16"
        type: "Detective"
        description: "Chain integrity verification on load and validation"
        implementation:
          - "internal/chains/hash_chain.go:VerifyChainIntegrity"
        status: "Implemented"
        effectiveness: "High"
        
    residual_risk: "Low - Tampering detectable via hash mismatches; external witness provides additional assurance"

  T6_Persistence_Tampering:
    id: "T6"
    name: "Persistence Tampering"
    description: "Direct editing of BoltDB file or replay store"
    stride: ["Tampering"]
    impact: "High - Silent data modification, corrupted state"
    likelihood_current: "Medium"
    likelihood_rationale: "Filesystem permissions provide basic protection; no file integrity seal"
    
    mitigations:
      - control_id: "M17"
        type: "Preventive"
        description: "BoltDB ACID properties with atomic writes"
        implementation:
          - "pkg/agentauth/bolt_repository.go"
        status: "Implemented"
        effectiveness: "Medium"
        
      - control_id: "M18"
        type: "Preventive"
        description: "WAL-based replay store with crash recovery"
        implementation:
          - "pkg/replay/durable_replay_store.go"
          - "pkg/replay/wal_store.go"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M19"
        type: "Detective"
        description: "Hash chain integrity verification detects post-import tampering"
        implementation:
          - "internal/chains/hash_chain.go:VerifyChainIntegrity"
        status: "Implemented"
        effectiveness: "Medium"
        
    residual_risk: "Medium - Requires host-level access controls and filesystem encryption"

  T7_Principal_Enumeration:
    id: "T7"
    name: "Principal Enumeration"
    description: "ListByPrincipal reveals all delegations via insecure endpoint"
    stride: ["Information_Disclosure"]
    impact: "Medium - Privacy leakage, delegation graph exposure"
    likelihood_current: "Low"
    likelihood_rationale: "Depends on API exposure and authorization controls"
    
    mitigations:
      - control_id: "M20"
        type: "Preventive"
        description: "PDP engine authorization checks before listing operations"
        implementation:
          - "pkg/pdp/engine.go:Evaluate"
          - "pkg/pdp/policy.go"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M21"
        type: "Preventive"
        description: "ABAC policy enforcement for API endpoints"
        implementation:
          - "web/server_clean.go:authMiddleware"
        status: "Partial"
        effectiveness: "Medium"
        
    residual_risk: "Low - API access controls enforce authorization; deployment practices critical"

  T8_Key_Rotation_Gaps:
    id: "T8"
    name: "Key Rotation Gaps"
    description: "Old keys retained too long enabling extended replay"
    stride: ["Elevation_of_Privilege"]
    impact: "Medium - Extended replay window"
    likelihood_current: "Medium"
    likelihood_rationale: "Rotation supported but retention policy needs enforcement"
    
    mitigations:
      - control_id: "M22"
        type: "Preventive"
        description: "Configurable key rotation schedule"
        implementation:
          - "internal/crypto/key_rotation.go:ScheduledRotation"
        status: "Implemented"
        effectiveness: "Medium"
        
      - control_id: "M23"
        type: "Corrective"
        description: "Active + previous key support for graceful rotation"
        implementation:
          - "internal/crypto/key_ring.go:ActiveKey"
          - "internal/crypto/key_ring.go:PreviousKey"
        status: "Implemented"
        effectiveness: "High"
        
    residual_risk: "Medium - Requires operational procedures for timely rotation"

  T9_Missing_Public_Key:
    id: "T9"
    name: "Missing Public Key (Strict Mode)"
    description: "Authenticity silently skipped allowing downgrade attack"
    stride: ["Spoofing", "Tampering"]
    impact: "High - Integrity loss via downgrade"
    likelihood_current: "Low"
    likelihood_rationale: "Strict mode available and enforced when enabled"
    
    mitigations:
      - control_id: "M24"
        type: "Preventive"
        description: "Strict authenticity mode rejects missing keys"
        implementation:
          - "pkg/agentauth/agentauth.go:WithStrictAuthenticity"
          - "pkg/rfc0111/rfc0111.go:strictAuthenticity"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M25"
        type: "Detective"
        description: "Metrics tracking authenticity verification failures"
        implementation:
          - "internal/metrics/prometheus_adapter.go:IncAuthenticityFailures"
        status: "Implemented"
        effectiveness: "Medium"
        
    residual_risk: "Low - Strict mode enforcement prevents downgrade; deployment must enable"

  T10_DOS_Large_Scope:
    id: "T10"
    name: "DOS via Large Scope/Restrictions"
    description: "Oversized JSON causing memory pressure or processing delays"
    stride: ["Denial_of_Service"]
    impact: "Medium - Availability degradation"
    likelihood_current: "Low"
    likelihood_rationale: "Size limits enforced at validation time"
    
    mitigations:
      - control_id: "M26"
        type: "Preventive"
        description: "Explicit size caps on scope and restrictions"
        implementation:
          - "pkg/agentauth/size_limits.go:ValidateSizeLimits"
          - "pkg/limits/limits.go"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M27"
        type: "Preventive"
        description: "Multi-period numeric limits (daily/weekly/monthly)"
        implementation:
          - "pkg/limits/multiperiod.go"
        status: "Implemented"
        effectiveness: "High"
        
      - control_id: "M28"
        type: "Detective"
        description: "Latency metrics for abnormal processing times"
        implementation:
          - "internal/metrics/prometheus_adapter.go:ObserveLatency"
        status: "Implemented"
        effectiveness: "Medium"
        
    residual_risk: "Low - Size validation prevents resource exhaustion attacks"

  T11_Timing_Side_Channel:
    id: "T11"
    name: "Timing Side Channel"
    description: "Signature verification timing leaks key information"
    stride: ["Information_Disclosure"]
    impact: "Low - Potential key material leakage"
    likelihood_current: "Low"
    likelihood_rationale: "Ed25519 constant-time implementation"
    
    mitigations:
      - control_id: "M29"
        type: "Preventive"
        description: "Constant-time signature verification (Ed25519)"
        implementation:
          - "crypto/ed25519 (Go stdlib)"
          - "internal/crypto/signer.go:Verify"
        status: "Implemented"
        effectiveness: "High"
        
    residual_risk: "Very Low - Ed25519 designed for constant-time operations"

  T12_Anchor_Spoofing:
    id: "T12"
    name: "Anchor Spoofing"
    description: "Fake success anchoring hides external tampering"
    stride: ["Tampering", "Repudiation"]
    impact: "Medium - False external witness claims"
    likelihood_current: "Low"
    likelihood_rationale: "Metrics detect anchor failures; real anchoring verifiable on-chain"
    
    mitigations:
      - control_id: "M30"
        type: "Detective"
        description: "Notarization metrics tracking success/failure rates"
        implementation:
          - "internal/notary/notarization_service.go:RecordNotarization"
          - "internal/metrics/prometheus_adapter.go"
        status: "Implemented"
        effectiveness: "Medium"
        
      - control_id: "M31"
        type: "Preventive"
        description: "Multiple notarization backends (blockchain + timestamp authority)"
        implementation:
          - "internal/notary/blockchain_notarizer.go"
          - "internal/notary/timestamp_authority.go"
        status: "Implemented"
        effectiveness: "High"
        
    residual_risk: "Low - On-chain verification provides independent witness"

# Coverage summary
coverage:
  total_threats: 12
  fully_mitigated: 9
  partially_mitigated: 2
  unmitigated: 1
  
  coverage_by_stride:
    Spoofing: 4
    Tampering: 4
    Repudiation: 3
    Information_Disclosure: 2
    Denial_of_Service: 1
    Elevation_of_Privilege: 4

# Implementation references
implementation_packages:
  - pkg/agentauth
  - pkg/rfc0111
  - pkg/replay
  - pkg/pdp
  - pkg/limits
  - pkg/attest
  - pkg/compliance
  - internal/crypto
  - internal/chains
  - internal/notary
  - internal/metrics
  - internal/obligations

