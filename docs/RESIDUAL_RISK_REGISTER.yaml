    rationale: "Minimal impact; compensating controls sufficient"
    approver: "Security Lead"
    date: "2025-11-06"
  
  Low_risks:
    decision: "Accept with monitoring"
    rationale: "Low likelihood with effective mitigations; continuous monitoring required"
    approver: "Security Lead"
    date: "2025-11-06"
  
  Medium_risks:
    decision: "Accept with action plan"
    rationale: "Acceptable for production with committed remediation timeline"
    approver: "CISO"
    date: "2025-11-06"
    action_plan:
      - "RR02: Deploy Vault integration within 1 month"
      - "RR03: Implement file integrity seals within 2 months"

# Review Schedule
review_schedule:
  frequency: "Quarterly"
  next_review: "2026-02-06"
  review_triggers:
    - "New threat identified"
    - "Significant architecture change"
    - "Mitigation implementation completed"
    - "Security incident or near-miss"
    - "Regulatory requirement change"

# Audit Trail
audit:
  created: "2025-11-06"
  created_by: "Gap Closure Session 2"
  purpose: "Complete sec14.item2 (P3) - Residual risk register with tracking of remaining exposures"
  methodology: "Based on threat mitigations matrix (sec14.item1) with residual risk analysis"
