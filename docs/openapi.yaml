                        created_at: "2025-10-21T12:00:00Z"
                        expires_at: "2025-10-21T13:00:00Z"
                        threshold: 3
                        collected_count: 2
                      - poa_id: poa_multisig_456
                        status: pending
                        created_at: "2025-10-21T11:30:00Z"
                        expires_at: "2025-10-21T12:30:00Z"
                        threshold: 5
