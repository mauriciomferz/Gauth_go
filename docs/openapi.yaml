  /api/v1/delegation/create:
    post:
      summary: Create a new delegation
      operationId: createDelegation
      tags: [delegation]
      description: |
        Create a new delegation granting authority from one principal to another.
        Subject receives delegated permissions to perform actions on resources.
        Requires capability enforcement when GAUTH_CAPABILITY_ENFORCE=1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreateRequest' }
            examples:
              financial_delegation:
                value:
                  subject: bob@example.com
                  resource: account:12345
                  action: transfer
                  scope: ["amount_limit:1000"]
                  delegation:
                    delegated_by: alice@example.com
                    delegated_to: bob@example.com
      responses:
        '200':
          description: Delegation created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationCreateResponse' }
              examples:
                success:
                  value:
                    success: true
                    poa:
                      id: poa_abc123def456
                      subject: bob@example.com
                      resource: account:12345
                      action: transfer
                      created_at: "2025-10-21T12:00:00Z"
                      expires_at: "2025-10-21T13:00:00Z"
        '400':
          description: Invalid delegation request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                missing_subject:
                  value:
                    error: invalid_request
                    message: subject field required
                    code: validation_error
        '403':
          description: Capability enforcement denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                capability_denied:
                  value:
                    error: forbidden
                    message: capability enforcement denied delegation creation
                    code: capability_enforcement_denied
  /api/v1/delegation/revoke:
