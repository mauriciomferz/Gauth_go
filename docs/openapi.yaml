openapi: 3.1.0
info:
  title: AgentAuth Learning Lab API
  version: 0.4.0-beta
  description: >-
    RFC-0150 compliant authorization framework API for learning, experimentation, and compliance validation.
    This comprehensive implementation provides endpoints for evaluation and demonstration of AgentAuth concepts,
    authorization pattern testing, and RFC-0150 compliance verification.
    
    **Learning Features:**
    - Interactive authorization pattern evaluation
    - RFC-0150 compliance testing and validation
    - Educational sandbox environments for experimentation
    - Comprehensive audit trails and transparency logs
    
    **Implementation Status:**
    - Core Authorization: ✅ Complete
    - Delegation & PoA: ✅ Complete  
    - Revocation & Lifecycle: ✅ Complete
    - Audit & Transparency: ✅ Complete
    - Cryptographic Standards: ✅ Complete
    - API & Integration: ✅ Complete
externalDocs:
  description: AgentAuth Learning Lab Documentation & RFC-0150 Compliance Guide
  url: https://github.com/AgentAuth-Foundation/AAP-RFC-0150-Go-Implementation-of-AgentAuth-1.0/tree/main/docs
tags:
  - name: learning
    description: Educational and learning path management
  - name: compliance
    description: RFC-0150 compliance testing and validation
  - name: patterns
    description: Authorization pattern library and experimentation
  - name: playground
    description: Safe sandbox for testing authorization scenarios  
  - name: validation
    description: Comprehensive validation suite and testing tools
  - name: discovery
    description: Capability & algorithm discovery
  - name: crypto
    description: Cryptographic aggregation & proof-of-possession
  - name: rotation
    description: Key rotation & multi-signature artifacts
  - name: revocation
    description: Token revocation transparency proofs
  - name: capability
    description: Capability registry anchoring
  - name: attestation
    description: Model limits attestation & verification
  - name: policy
    description: Policy manifest retrieval
  - name: authorization
    description: Composite human→human→AI delegation & authority artifacts
  - name: poa
    description: Power of Attorney (PoA) lifecycle, multi-signature preparation/finalization, extended token issuance
  - name: audit
    description: Tamper-evident hash-chain audit ledger (append-only) listing, export & integrity verification
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/v1/learning/progress:
    get:
      summary: Get learning progress for current session
      tags: [learning]
      operationId: getLearningProgress
      description: |
        Returns the user's progress through the AgentAuth learning modules including completed concepts,
        patterns explored, experiments conducted, and validations passed.
      responses:
        '200':
          description: Learning progress data
          content:
            application/json:
              schema:
                type: object
                properties:
                  concepts_completed: { type: integer }
                  patterns_explored: { type: integer }
                  experiments_conducted: { type: integer }
                  validations_passed: { type: integer }
                  total_progress_percent: { type: integer }
                  recommended_next_steps: { type: array, items: { type: string } }
    
  /api/v1/compliance/rfc0150/validate:
    post:
      summary: Run RFC-0150 compliance validation
      tags: [compliance]
      operationId: validateRFC0150Compliance
      description: |
        Executes comprehensive RFC-0150 compliance testing including core authorization model,
        delegation protocols, revocation mechanisms, audit requirements, and API completeness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_categories: 
                  type: array
                  items: 
                    type: string
                    enum: [core_authorization, delegation_poa, revocation_lifecycle, audit_transparency, crypto_standards, api_integration]
                include_performance_tests: { type: boolean }
                generate_report: { type: boolean }
      responses:
        '200':
          description: Compliance validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  overall_score: { type: integer }
                  compliance_status: { type: string }
                  tests_passed: { type: integer }
                  tests_failed: { type: integer }
                  warnings: { type: integer }
                  total_tests: { type: integer }
                  category_results: { type: object }
                  recommendations: { type: array, items: { type: string } }
    
  /api/v1/patterns/library:
    get:
      summary: Get available authorization patterns
      tags: [patterns]
      operationId: getAuthorizationPatterns
      description: |
        Returns the library of available authorization patterns for learning and experimentation,
        categorized by complexity and use case.
      responses:
        '200':
          description: Authorization patterns library
          content:
            application/json:
              schema:
                type: object
                properties:
                  simple_delegation: { type: array, items: { type: object } }
                  hierarchical: { type: array, items: { type: object } }
                  revocation: { type: array, items: { type: object } }
                  multi_signature: { type: array, items: { type: object } }
                  total_patterns: { type: integer }
  
  /api/v1/patterns/execute:
    post:
      summary: Execute authorization pattern in sandbox
      tags: [patterns]
      operationId: executeAuthorizationPattern
      description: |
        Executes a selected authorization pattern in a safe sandbox environment,
        allowing users to observe the delegation flow and authorization decisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern_id: { type: string }
                participants: { type: array, items: { type: string } }
                scenario_parameters: { type: object }
                trace_execution: { type: boolean }
      responses:
        '200':
          description: Pattern execution results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  execution_trace: { type: array, items: { type: object } }
                  authorization_decisions: { type: array, items: { type: object } }
                  audit_entries: { type: array, items: { type: object } }
                  learning_insights: { type: array, items: { type: string } }
  
  /api/v1/playground/scenarios:
    post:
      summary: Create and run custom authorization scenario
      tags: [playground]
      operationId: runPlaygroundScenario
      description: |
        Allows users to create custom authorization scenarios for testing and learning,
        providing a safe sandbox environment for experimentation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario_type: { type: string, enum: [simple_auth, delegation_chain, multi_sig, revocation_cascade] }
                participants: { type: array, items: { type: object } }
                actions_resources: { type: object }
                test_cases: { type: array, items: { type: object } }
      responses:
        '200':
          description: Scenario execution results
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario_id: { type: string }
                  execution_results: { type: array, items: { type: object } }
                  authorization_flow: { type: object }
                  compliance_analysis: { type: object }
                  educational_notes: { type: array, items: { type: string } }
                  
  /api/v1/validation/comprehensive:
    post:
      summary: Run comprehensive validation suite
      tags: [validation]
      operationId: runComprehensiveValidation
      description: |
        Executes the full validation suite including functional, security, and performance tests
        to ensure complete RFC-0150 compliance and implementation correctness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_suites: 
                  type: array
                  items:
                    type: string
                    enum: [functional, security, performance, integration]
                generate_certificate: { type: boolean }
                detailed_reporting: { type: boolean }
      responses:
        '200':
          description: Comprehensive validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  validation_id: { type: string }
                  overall_status: { type: string }
                  test_results: { type: object }
                  compliance_certificate: { type: string }
                  detailed_report_url: { type: string }
                  recommendations: { type: array, items: { type: string } }
                  
  /api/v1/crypto/bls/aggregate:
    post:
      summary: Aggregate BLS signatures
      tags: [crypto]
      operationId: postBLSAggregate
      description: |
        Aggregates multiple BLS12-381 signatures over identical message bytes (domain-separated internally).
        Optional require_pop flag enforces proof-of-possession (PoP) issuance for each participant prior to aggregation.
      parameters:
        - in: query
          name: require_pop
          schema: { type: boolean }
          description: When true, server returns PoP challenges instead of final aggregate; client must POST to /api/v1/crypto/bls/pop/verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BLSAggregateRequest'
      responses:
        '200': { $ref: '#/components/responses/BLSAggregateOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/crypto/bls/pop/verify:
    post:
      summary: Verify BLS proof-of-possession and finalize aggregate
      tags: [crypto]
      operationId: postBLSPoPVerify
      description: |
        Verifies submitted PoP signatures for each participant and returns the finalized aggregate signature when all proofs validate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BLSPoPVerifyRequest' }
      responses:
        '200': { $ref: '#/components/responses/BLSPoPVerifyOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/crypto/algorithms:
    get:
      summary: List supported cryptographic algorithms
      tags: [crypto]
      operationId: getCryptoAlgorithms
      description: |
        Returns a list of all supported cryptographic signature algorithms, including their names and whether they support aggregation.
      responses:
        '200':
          description: List of supported algorithms
          content:
            application/json:
              schema:
                type: object
                required: [success, algorithms]
                properties:
                  success:
                    type: boolean
                    example: true
                  algorithms:
                    type: array
                    items:
                      type: object
                      required: [name, aggregated_supported]
                      properties:
                        name:
                          type: string
                          example: "bls12-381"
                        aggregated_supported:
                          type: boolean
                          example: true
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/anchor/chain:
    get:
      summary: Retrieve combined anchor chain
      tags: [anchor]
      operationId: getAnchorChain
      description: |
        Returns the complete chain of combined anchor tokens, including capability registry and rotation hashes.
      responses:
        '200':
          description: Combined anchor chain
          content:
            application/json:
              schema:
                type: object
                required: [success, chain]
                properties:
                  success:
                    type: boolean
                    example: true
                  chain:
                    type: array
                    items:
                      type: object
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/anchor/emitCombined:
    post:
      summary: Emit combined anchor token
      tags: [anchor]
      operationId: postAnchorEmitCombined
      description: |
        Creates a combined anchor token that includes both capability registry hash and rotation head hash.
      responses:
        '200':
          description: Combined anchor emitted successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, digest]
                properties:
                  success:
                    type: boolean
                    example: true
                  digest:
                    type: string
                    example: "deadbeefcafecafe"
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/anchor/verifyChain:
    get:
      summary: Verify combined anchor chain integrity
      tags: [anchor]
      operationId: getAnchorVerifyChain
      description: |
        Verifies the integrity of the combined anchor chain by checking hash continuity.
      responses:
        '200':
          description: Chain verification result
          content:
            application/json:
              schema:
                type: object
                required: [success, status]
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: "ok"
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/anchor/revocation/emit:
    post:
      summary: Emit external revocation anchor receipt
      tags: [revocation]
      operationId: postRevocationAnchorEmit
      description: |
        Anchors the current revocation Merkle root (chain head) to an external timestamp / transparency service.
        Idempotent within identical head hash; returns existing receipt when already anchored.
      responses:
        '200': { $ref: '#/components/responses/RevocationAnchorEmitOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/model/limits/attestation/verify:
    post:
      summary: Verify model limits attestation (domain-separated signature)
      tags: [attestation]
      operationId: postModelLimitsAttestationVerify
      description: |
        Reconstructs unsigned attestation JSON, prepends domain separation prefix `GAUTH_MODEL_LIMIT_ATTEST:` and verifies Ed25519 signature.
        Returns validity and combined hash linking snapshot, audit, and anchor chain heads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelLimitsAttestationVerifyRequest' }
      responses:
        '200': { $ref: '#/components/responses/ModelLimitsAttestationVerifyOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/beta/capabilities/anchor/metrics/prometheus:
    get:
      summary: Capability anchor custom Prometheus exposition
      tags: [capability]
      operationId: getCapabilityAnchorMetricsPrometheus
      description: |
        Emits capability anchor counters, age/stale gauges, emission interval HELP/TYPE lines, jitter gauge, and (when enabled) notarization latency identifiers.
        Use when scraping full /metrics registry is impractical; bucket lines for histograms appear only in /metrics.
      responses:
        '200':
          description: Text exposition
          content:
            text/plain:
              schema: { type: string }
  /api/v1/beta/capabilities/anchor/external/verify:
    get:
      summary: Verify latest external capability anchor receipt
      tags: [capability]
      operationId: getExternalCapabilityAnchorVerify
      description: |
        Performs provider-specific verification on latest external capability anchor receipt. Returns verified=true if successful or empty=true if no receipt present.
      responses:
        '200': { $ref: '#/components/responses/ExternalCapabilityAnchorVerifyOk' }
  /api/v1/beta/capabilities/anchor/external/receipts/verify:
    get:
      summary: Verify external capability anchor receipt chain integrity
      tags: [capability]
      operationId: getExternalCapabilityAnchorReceiptsVerify
      description: |
        Recomputes hash-chain (prev_hash + canonical receipt) linkage for persisted external receipts. Reports status ok|mismatch|empty and mismatch index diagnostics.
      responses:
        '200': { $ref: '#/components/responses/ExternalCapabilityAnchorReceiptsVerifyOk' }
  /api/v1/beta/discovery:
    get:
      summary: Discovery metadata
      tags: [discovery]
      operationId: getDiscovery
      description: |
        Returns server capability discovery including supported algorithms and delegation limits.
        Use this prior to constructing artifacts that depend on algorithm suites or maximum delegation depth.
      responses:
        '200':
          description: Discovery document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
  /api/v1/policy/manifest:
    get:
      summary: Signed policy manifest
      tags: [policy]
      operationId: getPolicyManifest
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      description: |
        Retrieves the currently active signed policy manifest governing capability usage and operational guardrails.
        Supports conditional retrieval via ETag. For validation guidance see docs/ADR_POLICY_MANIFEST.md (if present).
      responses:
        '200': { $ref: '#/components/responses/PolicyManifestOk' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/token/revocation/head:
    get:
      summary: Current revocation chain head
      tags: [revocation]
      operationId: getRevocationHead
      description: |
        Provides the latest revocation log size and head hash enabling clients to detect new revocations
        and request consistency or inclusion proofs. Poll and compare head_hash to track updates.
      responses:
        '200': { $ref: '#/components/responses/RevocationHeadOk' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/token/revocation/proof:
    get:
      summary: Merkle inclusion proof for a revocation event
      tags: [revocation]
      operationId: getRevocationProof
      parameters:
        - $ref: '#/components/parameters/RevocationId'
        - $ref: '#/components/parameters/RevocationIndex'
        - $ref: '#/components/parameters/RevocationHash'
      description: |
        Returns a Merkle inclusion proof for a specific revocation event. Provide one of id, index, or hash.
        Proof structure allows local validation against a previously fetched head hash ensuring tamper-evidence.
      responses:
        '200': { $ref: '#/components/responses/RevocationProofOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/token/revocation/consistency:
    get:
      summary: Consistency proof from start index 0 to current
      tags: [revocation]
      operationId: getRevocationConsistency
      parameters:
        - $ref: '#/components/parameters/RevocationStart'
      description: |
        Supplies a consistency proof between an earlier log size and the current state. Use after downtime
        or to validate append-only integrity when syncing missed revocation events.
      responses:
        '200': { $ref: '#/components/responses/ConsistencyProofOk' }
  /api/v1/token/revocation/consistency_sizes:
    get:
      summary: Sizes-based consistency stub
      tags: [revocation]
      operationId: getRevocationConsistencySizes
      parameters:
        - $ref: '#/components/parameters/RevocationOlder'
        - $ref: '#/components/parameters/RevocationNewer'
      description: |
        Lightweight consistency stub returning expected proof sizes for older/newer pairs prior to requesting
        full proofs. Useful for planning bandwidth in constrained environments.
      responses:
        '200': { $ref: '#/components/responses/ConsistencySizesOk' }
  /api/v1/capability/anchor:
    post:
      summary: Anchor current capability registry hash externally
      tags: [capability]
      operationId: postCapabilityAnchor
      description: |
        Attempts to anchor the current capability registry hash to an external trust system (e.g., blockchain or
        timestamp authority). Enhances non-repudiation and historical audit. See docs/ADR_CAPABILITY_ANCHOR.md for design rationale.
      responses:
        '200': { $ref: '#/components/responses/CapabilityAnchorOk' }
  /api/v1/capability/anchor/latest:
    get:
      summary: Latest capability registry anchor artifact
      tags: [capability]
      operationId: getCapabilityAnchorLatest
      description: |
        Returns the most recent successful external anchor artifact for the capability registry including provider
        metadata and anchoring timestamp for audit chain reconstruction.
      responses:
        '200': { $ref: '#/components/responses/CapabilityAnchorOk' }
  /api/v1/model/limits/attestation:
    get:
      summary: Stream model limits attestations (SSE)
      tags: [attestation]
      operationId: streamModelLimitsAttestation
      description: |
        Server-Sent Events stream emitting model limits attestation updates (e.g., token caps, concurrency, safety flags).
        Clients should validate domain signatures (see verify endpoint) and apply changes atomically.
      responses:
        '200':
          description: Server-sent events stream
  /api/v1/model/limits/verify:
    post:
      summary: Verify model limits attestation
      tags: [attestation]
      operationId: postVerifyModelLimitsAttestation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelLimitsVerifyRequest'
      description: |
        Verifies integrity and domain signature of a model limits attestation object. Returns success and diagnostic
        fields indicating signature and domain separation validity. Use this before enforcing received limits.
      responses:
        '200': { $ref: '#/components/responses/ModelLimitsVerifyOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/rotation/summary:
    get:
      summary: Current rotation summary (multi-sig)
      tags: [rotation]
      operationId: getRotationSummary
      description: |
        Legacy multi-signature rotation summary (unweighted). Provides active key identifier, threshold, and previous hash pointer.
        Prefer /api/v1/rotation/summary/v2 for weighted artifacts and enhanced continuity semantics.
      responses:
        '200': { $ref: '#/components/responses/RotationSummaryOk' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/rotation/summary/v2:
    get:
      summary: Weighted multi-sig rotation summary (version 2 artifact)
      operationId: getRotationSummaryV2
      description: |
        Returns the current weighted multi-signature rotation artifact (V2) including per-algorithm verified
        weights, threshold status, and continuity hashes. See docs/ROTATION_V2_DEMO.md for usage, metrics, and
        security considerations. Prometheus metrics: gauth_rotation_v2_verified_weight, gauth_rotation_v2_verified_weight_alg,
        gauth_rotation_v2_threshold_weight, gauth_rotation_v2_signature_failures_total, gauth_rotation_v2_continuity_updates_total.
      tags: [rotation]
      responses:
        '200': { $ref: '#/components/responses/RotationSummaryV2Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/authorization/composite:
    get:
      summary: Current composite authorization artifact
      tags: [authorization]
      operationId: getCompositeAuthorization
      description: |
        Returns the active composite authorization artifact capturing multi-level delegation (e.g., CEO → CFO → AI system),
        scope, powers, decision/escalation matrices, transaction limits, dual-control requirements, and accountability chain.
        See examples/composite_authorization_README.md for structural guidance.
      responses:
        '200': { $ref: '#/components/responses/CompositeAuthorizationOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      summary: Submit & activate new composite authorization artifact
      tags: [authorization]
      operationId: postCompositeAuthorization
      description: |
        Accepts a proposed composite authorization artifact. Performs structural validation (required sections),
        optional signature / provenance checks (if enabled), and activation rules (e.g., non-overlapping validity window).
        Returns the persisted artifact envelope and activation status.
      requestBody:
        required: true
        content:
            schema:
              $ref: '#/components/schemas/CompositeAuthorizationArtifact'
            examples:
              sample:
                summary: Minimal composite authorization example
                value:
                  ai_system_id: enterprise_financial_ai_v1
                  authorizing_party:
                    id: enterprise_corp_001
                    name: Enterprise Financial Corporation
                    type: corporation
                  authorization_grant:
                    type: general
                    scope: [financial_operations]
                    valid_from: '2025-01-01T00:00:00Z'
                    valid_until: '2025-12-31T23:59:59Z'
                  powers_granted:
                    basic_powers: [financial_operations]
                  decision_authority:
                    autonomous_decisions: [routine_invoice_approval]
                  transaction_rights:
                    allowed_transaction_types: [vendor_payments]
                  action_permissions:
                    system_actions: [generate_reports]
                  dual_control_principle:
                    enabled: true
                  authorization_cascade:
                    accountability_chain: [ceo_001, cfo_001, enterprise_financial_ai_v1]
                  expires_at: '2025-12-31T23:59:59Z'
      responses:
        '201': { $ref: '#/components/responses/CompositeAuthorizationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/beta/health:
    get:
      summary: Deep health check
      tags: [validation]
      operationId: getBetaHealth
      description: |
        Performs deep verification of subsystem connectivity including Database, Redis, and MCP managers.
        Returns detailed status map.
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  /api/v1/beta/capabilities/diff:
    get:
      summary: Capabilities Diff
      tags: [capability]
      operationId: getCapabilityDiff
      description: |
        Computes added, removed, and modified capabilities relative to an optional baseline hash.
      parameters:
        - in: query
          name: since
          schema: { type: string }
          description: Baseline hash to compare against. If omitted, returns current hash as baseline.
      responses:
        '200':
          description: Diff result
          content:
            application/json:
              schema:
                type: object
                properties:
                  base_hash: { type: string }
                  current_hash: { type: string }
                  added: { type: array, items: { type: object } }
                  removed: { type: array, items: { type: object } }
                  modified: { type: array, items: { type: object } }
        '404':
          description: Baseline version not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error: { type: string, example: "version_not_found" }

  /api/v1/beta/metrics/lifecycle:
    get:
      summary: Lifecycle Metrics
      tags: [learning]
      operationId: getLifecycleMetrics
      description: |
        Surfaces high-level lifecycle counters (token & delegation transitions and failures) plus multi-signature weight failures.
      responses:
        '200':
          description: Lifecycle metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  metrics:
                    type: object
                    properties:
                      delegation_status_transitions: { type: integer }
                      delegation_status_transition_failures: { type: integer }
                      token_status_transitions: { type: integer }
                      token_status_transition_failures: { type: integer }
                      multi_signature_weight_failures: { type: integer }
                      lifecycle_latency_p99_ns: { type: integer }

  /api/v1/beta/lifecycle/timeline:
    get:
      summary: Lifecycle Timeline
      tags: [learning]
      operationId: getLifecycleTimeline
      description: |
        Returns lifecycle events filtered by entity type, id, outcome, reason, or time.
      parameters:
        - in: query
          name: entity_type
          schema: { type: string }
        - in: query
          name: entity_id
          schema: { type: string }
        - in: query
          name: outcome
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Timeline events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  next_cursor: { type: string }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        entity_type: { type: string }
                        entity_id: { type: string }
                        old_status: { type: string }
                        new_status: { type: string }
                        outcome: { type: string }
                        reason: { type: string }
                        latency_ns: { type: integer }
                        at: { type: string, format: date-time }

  /api/v1/token/create:
    post:
      summary: Create access token
      tags: [validation]
      operationId: postTokenCreate
      description: |
        Issues a new access token with optional TTL and metadata.
        If GAUTH_USE_JWT_LIB=1, also returns a signed JWT in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  description: Token time-to-live in seconds.
                meta:
                  type: object
                  description: Arbitrary metadata to attach to the token.
                nonce:
                  type: string
                  description: Optional client-provided nonce for replay protection.
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token:
                    type: object
                    properties:
                      id: { type: string }
                      value: { type: string }
                      expires_at: { type: string, format: date-time }
                  jwt: { type: string, description: Signed JWT (if enabled) }
        '403':
          description: Capability denied
        '409':
          description: Nonce replay detected
        '500':
          description: Internal error

  /api/v1/token/validate:
    post:
      summary: Validate access token
      tags: [validation]
      operationId: postTokenValidate
      description: |
        Validates a token and returns its status and claims.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The token value or JWT to validate.
                token_id:
                  type: string
                  description: Alternative lookup by token ID.
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  valid: { type: boolean }
                  reason: { type: string }
                  claims: { type: object }
        '400':
          description: Invalid request

  /api/v1/token/revoke:
    post:
      summary: Revoke access token
      tags: [validation]
      operationId: postTokenRevoke
      description: |
        Revokes an active token, making it invalid for future use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_id]
              properties:
                token_id:
                  type: string
                  description: ID of the token to revoke.
                reason:
                  type: string
                  description: Optional revocation reason.
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked_at: { type: string, format: date-time }
        '404':
          description: Token not found

  /api/v1/token/introspect:
    post:
      summary: Introspect token
      tags: [validation]
      operationId: postTokenIntrospect
      description: |
        Returns detailed token metadata and status (RFC 7662 compatible).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The token value to introspect.
      responses:
        '200':
          description: Introspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  sub: { type: string }
                  scope: { type: string }
                  exp: { type: integer }
                  iat: { type: integer }
                  iss: { type: string }
                  jti: { type: string }

  /api/v1/gauth/auth/login/init:
    post:
      summary: Initiate login
      tags: [validation]
      operationId: postLoginInit
      description: |
        First step of 2-factor authentication. Validates username/password
        and returns MFA challenge if credentials are valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: User's username or email.
                password:
                  type: string
                  description: User's password.
      responses:
        '200':
          description: Login initiated - MFA required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  userId: { type: string }
                  requiresMFA: { type: boolean }
                  mfaMethods:
                    type: array
                    items: { type: string }
                  sessionChallenge: { type: string }
        '400':
          description: Invalid request format
        '401':
          description: Invalid credentials

  /api/v1/gauth/auth/login/mfa:
    post:
      summary: Verify MFA and get JWT
      tags: [validation]
      operationId: postLoginMFA
      description: |
        Second step of 2-factor authentication. Verifies MFA code
        and issues JWT access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code, method]
              properties:
                challengeId:
                  type: string
                  description: Session challenge from login/init.
                code:
                  type: string
                  description: MFA verification code.
                method:
                  type: string
                  description: MFA method (totp, sms, email).
      responses:
        '200':
          description: MFA verified - tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token: { type: string }
                  refreshToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  tokenType: { type: string }
        '400':
          description: Invalid request format
        '401':
          description: Invalid MFA code

  /.well-known/gauth-configuration:
    get:
      summary: AgentAuth configuration discovery
      tags: [discovery]
      operationId: getAgentAuthConfiguration
