          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rate limit exceeded (model_rate_limit_exceeded, model_user_rate_limit_exceeded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/capabilities/reload:
    post:
      summary: Reload capabilities file and refresh action mappings
      operationId: capabilitiesReload
      tags: [policy]
      responses:
        '200':
          description: Reload summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  capabilities_before: { type: integer }
                  capabilities_after: { type: integer }
                  action_mappings: { type: integer }
                  source: { type: string }
                  last_loaded: { type: string }
        '400':
          description: Missing path (capabilities_path_missing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Reload failure (reload_failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/capabilities/negotiate:
    post:
      summary: Negotiate capability versions between client and server registry
      operationId: capabilitiesNegotiate
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_versions:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
      responses:
        '200':
          description: Negotiation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  agreed: { type: object, additionalProperties: { type: string } }
                  unsupported: { type: object, additionalProperties: { type: array, items: { type: string } } }
                  lifecycle_strict: { type: boolean }
        '400':
          description: Invalid payload (capabilities_negotiate_invalid_payload)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/capabilities/audit/verify:
    post:
      summary: Verify capability model limits attestation (Ed25519 signature integrity)
      operationId: capabilitiesAuditVerify
      tags: [policy, audit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Verification outcome (valid false when signature missing or invalid)
        '400':
          description: Body read / JSON failure (attestation_body_read_failed, attestation_invalid_json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal processing errors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/capabilities/audit/anchor:
    post:
      summary: Anchor capability audit chain tip externally
      operationId: capabilitiesAuditAnchor
      tags: [anchor, audit]
      responses:
        '200': { description: Anchor record emitted }
        '400':
          description: Empty chain tip (capabilities_audit_chain_tip_empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Anchoring disabled (capabilities_audit_anchor_disabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Anchor failure (capabilities_audit_anchor_failure, capability_anchor_client_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/capabilities/anchor:
    post:
      summary: Anchor current capability registry hash externally
      operationId: capabilityAnchor
      tags: [anchor, policy]
      responses:
        '200': { description: Anchor record emitted }
        '400':
          description: Registry hash empty (capability_registry_hash_empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Anchoring disabled (capability_anchor_disabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Anchor failure (capability_anchor_failure, capability_anchor_client_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/token/revocation/root:
    get:
      summary: Retrieve current revocation chain Merkle root and length
      operationId: revocationRoot
      tags: [revocation]
      responses:
        '200': { description: Merkle root snapshot }

  /api/v1/token/revocation/proof:
    get:
      summary: Generate Merkle proof by id, index or hash
      operationId: revocationProof
      tags: [revocation]
      parameters:
        - in: query
          name: id
          schema: { type: string }
        - in: query
          name: index
          schema: { type: integer, minimum: 0 }
        - in: query
          name: hash
          schema: { type: string }
      responses:
        '200': { description: Proof generated }
        '400':
          description: Missing or invalid identifier / generation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Chain empty or event not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/token/revocation/consistency:
    get:
      summary: Generate RFC6962-style consistency proof
      operationId: revocationConsistency
      tags: [revocation]
      parameters:
        - in: query
          name: start
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: Consistency proof }
        '400':
          description: Missing/invalid start or generation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Chain empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/token/revocation/consistency_v2:
    get:
      summary: Generate logarithmic consistency proof (prefix block optimized)
      operationId: revocationConsistencyV2
      tags: [revocation]
      parameters:
        - in: query
          name: start
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: Consistency V2 proof }
        '400':
          description: Missing/invalid start or generation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Chain empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/token/revocation/audit_consistency:
    get:
      summary: Generate and internally verify consistency proof with performance metrics
      operationId: revocationAuditConsistency
      tags: [revocation, audit]
      parameters:
        - in: query
          name: start
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: Audit consistency result }
        '400':
          description: Missing/invalid start or generation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Chain empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/beta/tsa/anchor:
    post:
      summary: Timestamp/anchor arbitrary hash (prototype TSA)
      operationId: tsaAnchor
      tags: [anchor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hash: { type: string }
      responses:
        '200': { description: TSA receipt issued }
        '400':
          description: Invalid payload (tsa_anchor_invalid_payload)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/beta/tsa/verify:
    post:
      summary: Verify TSA receipt integrity and basic timestamp sanity
      operationId: tsaVerify
      tags: [anchor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hash: { type: string }
                timestamp: { type: string }
                provider: { type: string }
                version: { type: integer }
      responses:
        '200': { description: Verification result }
        '400':
          description: Invalid receipt (tsa_verify_invalid_receipt)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CombinedAnchorToken:
      type: apiKey
      in: header
      name: X-Combined-Anchor-Token
      description: Static or capability-derived token required for combined anchor emission.
  schemas:
    ErrorResponse:
      type: object
      description: Standardized error payload (all error responses share this structure).
      properties:
        success: { type: boolean, description: Always false for errors }
        code: { type: string, description: Stable machine-readable code (snake_case) }
        error: { type: string, description: Legacy short error string }
        message: { type: string, description: Optional human-readable expansion }
        rfc_ref: { type: string, description: Optional RFC clause or section reference }
        detail: { description: Arbitrary extra context (string, object, or array) }
      required: [error, code]
    TokenIssueRequest:
      type: object
      properties:
        subject: { type: string, description: Principal (user or system) requesting token }
        scopes:
          type: array
          maxItems: 50
          items: { type: string, description: Scope string granting permission (demo semantics) }
          description: List of scope strings granting permissions
        ttl_seconds: { type: integer, minimum: 1, description: Time-to-live (seconds) for issued token }
      required: [subject]
    TokenIssueResponse:
      type: object
      properties:
        token: { type: string, description: Raw issued token (demo JWT or internal format) }
        token_id: { type: string, description: Internal token identifier }
        issued_at: { type: string, format: date-time, description: RFC3339 issuance timestamp }
        expires_at: { type: string, format: date-time, description: RFC3339 expiration timestamp }
      required: [token, token_id, issued_at, expires_at]
    StatusUpdateRequest:
      type: object
      properties:
        id: { type: string, description: Target entity identifier (token or delegation id) }
        status: { type: string, description: Requested status value (active|suspended|revoked|terminated) }
        reason: { type: string, description: Optional human-readable reason for status change }
      required: [id, status]
    StatusUpdateResponse:
      type: object
      properties:
        success: { type: boolean, description: Indicates status was applied successfully }
        status: { type: string, description: Final status after update }
      required: [success, status]
    TimelineEntry:
      type: object
      properties:
        id: { type: string, description: Entity identifier whose lifecycle changed }
        kind: { type: string, enum: [token, delegation], description: Entity type }
        status: { type: string, description: Resulting status after transition }
        at_unix: { type: integer, description: Transition time (unix seconds) }
        reason: { type: string, description: Cause categorization (e.g. status_change, invalid_transition) }
      required: [id, kind, status, at_unix]
    StandardError:
      type: object
      description: Standard error envelope with optional machine-readable code.
      properties:
        error: { type: string, description: Short error category }
        message: { type: string, description: Human-readable detail message }
        code: { type: string, description: Machine-readable error code }
        details: { type: object, additionalProperties: true, description: Optional structured details map }
      required: [error]
    TokenRevokeRequest:
      type: object
      properties:
        token_id: { type: string, description: Identifier of token to revoke }
        reason: { type: string, description: Optional reason for revocation }
      required: [token_id]
    TokenRevokeResponse:
      type: object
      properties:
        success: { type: boolean, description: Indicates revocation succeeded }
        status: { type: string, description: Resulting token status (revoked) }
      required: [success, status]
    PolicyEvaluateRequest:
      type: object
      properties:
        subject: { type: string, description: Principal performing the action }
        action: { type: string, description: Verb being authorized (read|write...) }
        resource: { type: string, description: Resource identifier or ARN-like string }
        context: { type: object, additionalProperties: true, description: Supplemental key/value context for policy evaluation }
      required: [subject, action, resource]
    PolicyEvaluateResponse:
      type: object
      properties:
        decision: { type: string, enum: [allow, deny], description: Final authorization decision }
        reasons:
          type: array
          maxItems: 50
          items: { type: string, description: Explanation fragments contributing to decision }
          description: Ordered list of explanatory fragments supporting decision
        latency_ms: { type: number, description: Evaluation latency (milliseconds) }
      required: [decision]
    AuditRecordRequest:
      type: object
      properties:
        event: { type: string, description: Audit event type label }
        actor: { type: string, description: Initiating principal or system }
        target: { type: string, description: Target entity/resource of event }
        metadata: { type: object, additionalProperties: true, description: Additional structured metadata }
      required: [event]
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, description: Unique audit log entry identifier }
        at: { type: string, format: date-time, description: Event timestamp (RFC3339) }
        event: { type: string, description: Event type }
        actor: { type: string, description: Principal initiating the event }
        target: { type: string, description: Primary target of event }
        metadata: { type: object, additionalProperties: true, description: Structured event metadata }
      required: [id, at, event]
    AuditLogListResponse:
      type: object
      properties:
        entries:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AuditLogEntry', description: Audit log entries returned }
          description: Page of audit log entries matching query
        total: { type: integer, description: Total entries across all pages }
      required: [entries]
    RevocationHeadResponse:
      type: object
      properties:
        head: { type: string, description: Current head hash of revocation chain }
        aggregate: { type: string, description: Aggregate hash summarizing entire chain }
        length: { type: integer, description: Number of revocation entries in chain }
        verified: { type: boolean, description: Indicates chain integrity verification success }
      required: [head]
    PolicyProvenanceResponse:
      type: object
      properties:
        chain_head_hash: { type: string, description: Head hash of policy chain }
        policies_count: { type: integer, description: Total number of policies registered }
        verified: { type: boolean, description: Indicates chain verification success }
        last_updated: { type: string, format: date-time, description: Timestamp of last modification }
      required: [chain_head_hash]
    TokenIntrospectionResponse:
      type: object
      properties:
        active: { type: boolean, description: Whether token is currently active }
        token_id: { type: string, description: Internal token identifier }
        subject: { type: string, description: Subject claim or internal subject }
        scopes:
          type: array
          maxItems: 50
          items: { type: string, description: Granted scope string }
          description: Current granted scope set (may shrink if partially revoked)
        issued_at: { type: string, format: date-time, description: Issuance time }
        expires_at: { type: string, format: date-time, description: Expiration time }
        reasons:
          type: array
          maxItems: 50
          items: { type: string, description: Reason codes for inactive state }
          description: List of reason codes explaining inactive or partially limited state
      required: [active]
    JWKSResponse:
      type: object
      properties:
        keys:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/JWK', description: JSON Web Key }
          description: Public keys for signature verification
      required: [keys]
    JWK:
      type: object
      properties:
        kty: { type: string, description: Key type (e.g. RSA, EC, oct) }
        kid: { type: string, description: Key identifier }
        use: { type: string, description: Intended use (sig or enc) }
        alg: { type: string, description: Algorithm (e.g. RS256, EdDSA) }
        n: { type: string, description: RSA modulus (base64url) }
        e: { type: string, description: RSA exponent (base64url) }
      required: [kty, kid]
    DelegationCreateRequest:
      type: object
      description: Request to create a new delegation
      properties:
        subject: { type: string, description: Principal receiving delegated authority }
        resource: { type: string, description: Resource identifier being delegated }
        action: { type: string, description: Action permitted by delegation }
        scope:
          type: array
          maxItems: 50
          items: { type: string }
          description: Optional scope constraints for delegation
        context: { type: object, additionalProperties: true, description: Additional context metadata }
        delegation:
          type: object
          description: Delegation relationship details
          properties:
            delegated_by: { type: string, description: Original authority holder delegating power }
            delegated_to: { type: string, description: Recipient of delegated authority (same as subject) }
          required: [delegated_by, delegated_to]
      required: [subject, resource, action]
    DelegationCreateResponse:
      type: object
      description: Response after successful delegation creation
      properties:
        success: { type: boolean, description: Indicates successful creation }
        poa:
          type: object
          description: Created power-of-attorney object
          properties:
            id: { type: string, description: Unique PoA identifier }
            subject: { type: string, description: Delegated principal }
            resource: { type: string, description: Delegated resource }
            action: { type: string, description: Delegated action }
            created_at: { type: string, format: date-time, description: Creation timestamp }
            expires_at: { type: string, format: date-time, description: Expiration timestamp }
          required: [id, subject, resource, action, created_at]
      required: [success, poa]
    DelegationRevokeRequest:
      type: object
      description: Request to revoke an existing delegation
      properties:
        poa_id: { type: string, description: PoA identifier to revoke }
        revoker: { type: string, description: Principal performing revocation }
        reason: { type: string, description: Optional human-readable reason for revocation }
      required: [poa_id, revoker]
    DelegationRevokeResponse:
      type: object
      description: Response after successful delegation revocation
      properties:
        success: { type: boolean, description: Indicates successful revocation }
        message: { type: string, description: Human-readable confirmation message }
        poa_id: { type: string, description: Revoked PoA identifier }
      required: [success, message, poa_id]
    PoADocument:
      type: object
      description: Issued Power-of-Attorney document with canonical digest and signatures
      properties:
        id: { type: string, description: Unique PoA identifier }
        subject: { type: string, description: Delegated principal }
        resource: { type: string, description: Resource identifier }
        action: { type: string, description: Delegated action }
        created_at: { type: string, format: date-time, description: Creation timestamp }
        expires_at: { type: string, format: date-time, description: Expiration timestamp }
        digest: { type: string, description: Canonical digest (sha256:<hex>) over stable fields }
        sig_mode: { type: string, enum: [single, multisig], description: Signature mode used }
        signer_kids:
          type: array
          maxItems: 20
          items: { type: string }
          description: Ordered list of key IDs required (multisig only)
        threshold: { type: integer, description: Required signature count (multisig only) }
        signatures:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              kid: { type: string, description: Key identifier }
              sig_b64: { type: string, description: Base64 signature }
              at: { type: string, format: date-time, description: Signature timestamp }
            required: [kid, sig_b64]
          description: Collected signatures (single entry in single mode)
        threshold_met: { type: boolean, description: Whether required signatures collected }
      required: [id, subject, resource, action, created_at, digest, sig_mode]
    PoAVerifyRequest:
      type: object
      description: Request to verify a PoA document
      properties:
        poa: { $ref: '#/components/schemas/PoADocument' }
      required: [poa]
    PoAVerifyResponse:
      type: object
      description: Verification result for PoA document
      properties:
        valid: { type: boolean, description: Whether PoA is fully valid }
        digest_valid: { type: boolean, description: Canonical digest matches recomputed value }
        signatures_valid: { type: boolean, description: All required signatures verified }
        threshold_met: { type: boolean, description: Multi-sig threshold satisfied (if applicable) }
        failing_indices:
          type: array
          maxItems: 20
          items: { type: integer }
          description: Indices of invalid signatures (if any)
        reason: { type: string, description: High-level failure reason (if invalid) }
        signer_count: { type: integer, description: Total signatures provided }
        required: { type: integer, description: Threshold required (multisig) }
        latency_ms: { type: number, description: Verification latency }
      required: [valid, digest_valid, signatures_valid]
    MultiSignatureRequest:
      type: object
      description: Request to submit signature for multi-sig PoA collection
      properties:
        poa_id: { type: string, description: PoA identifier for signature collection }
        signer_id: { type: string, description: Identity of signer submitting signature }
        key_id: { type: string, description: Public key identifier used for signing }
        signature: { type: string, description: Base64-encoded Ed25519 signature over canonical PoA digest }
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata about signature submission (timestamps, approval reasons, etc.)
      required: [poa_id, signer_id, key_id, signature]
    MultiSignatureResponse:
      type: object
      description: Response after signature submission
      properties:
        success: { type: boolean, description: Indicates successful signature acceptance }
        message: { type: string, description: Human-readable status message }
        poa_id: { type: string, description: PoA identifier }
        signer_id: { type: string, description: Signer who submitted signature }
        threshold_met: { type: boolean, description: Whether signature threshold is now satisfied }
        collected_count: { type: integer, description: Number of signatures collected so far }
        required_count: { type: integer, description: Total signatures required to meet threshold }
      required: [success, message, poa_id, signer_id, threshold_met, collected_count, required_count]
    MultiSignatureStatusResponse:
      type: object
      description: Current status of multi-signature PoA collection
      properties:
        poa_id: { type: string, description: PoA identifier }
        status: { type: string, enum: [pending, completed, active, expired], description: Collection lifecycle status }
        created_at: { type: string, format: date-time, description: Collection creation timestamp }
        expires_at: { type: string, format: date-time, description: Collection expiration timestamp }
        threshold: { type: integer, description: Required number of signatures (M-of-N threshold) }
        collected_count: { type: integer, description: Current number of collected signatures }
        remaining_signers:
          type: array
          maxItems: 100
          items: { type: string }
          description: List of signer IDs who have not yet submitted signatures
        collected_signatures:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              signer_id: { type: string, description: Signer identity }
              key_id: { type: string, description: Public key identifier }
              submitted_at: { type: string, format: date-time, description: Signature submission timestamp }
              weight: { type: integer, description: Signature weight (if weighted mode enabled) }
            required: [signer_id, key_id, submitted_at]
          description: Array of collected signatures with metadata
        use_weighted: { type: boolean, description: Whether weighted signature mode is enabled }
        collected_weight: { type: integer, description: Total weight of collected signatures (weighted mode only) }
        total_weight: { type: integer, description: Sum of all signer weights (weighted mode only) }
      required: [poa_id, status, created_at, threshold, collected_count, remaining_signers, collected_signatures]
    MultiSignatureActivateResponse:
      type: object
      description: Response after PoA activation
      properties:
        success: { type: boolean, description: Indicates successful activation }
        message: { type: string, description: Human-readable confirmation message }
        poa_id: { type: string, description: Activated PoA identifier }
      required: [success, message, poa_id]
    MultiSignaturePendingResponse:
      type: object
      description: List of pending multi-signature collections
      properties:
        collections:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              poa_id: { type: string, description: PoA identifier }
              status: { type: string, enum: [pending], description: Collection status }
              created_at: { type: string, format: date-time, description: Creation timestamp }
              expires_at: { type: string, format: date-time, description: Expiration timestamp }
              threshold: { type: integer, description: Required signature threshold }
              collected_count: { type: integer, description: Current collected signature count }
            required: [poa_id, status, created_at, threshold, collected_count]
          description: Array of pending collections awaiting threshold completion
      required: [collections]
