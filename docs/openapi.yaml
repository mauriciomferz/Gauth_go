openapi: 3.1.0
info:
  title: GAuth Demo API
  version: 0.3.1-beta
  description: |
    Core GAuth demo endpoints including token issuance, validation, revocation,
    delegation status, lifecycle timeline, policy evaluation & metrics, examples,
    JWKS publication, discovery metadata and audit/event streaming. Arrays are
    bounded to prevent unbounded growth. This spec is normalized for lint rules.

servers:
  - url: /
    description: Root (relative paths)

security:
  - BearerAuth: []

paths:
  /api/v1/token/create:
    post:
      summary: Issue a new token
      operationId: issueToken
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenIssueRequest'
            examples:
              minimal:
                value:
                  subject: alice@example.com
                  ttl_seconds: 3600
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIssueResponse' }
              examples:
                success:
                  value:
                    token: eyJhbGciOi...demo
                    token_id: tok_123
                    issued_at: 2025-10-18T12:00:00Z
                    expires_at: 2025-10-18T13:00:00Z
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                missing_subject:
                  value:
                    error: invalid_request
                    message: subject field required
                    code: invalid_request
  /api/v1/token/metrics:
    get:
      summary: Token metrics snapshot
      operationId: getTokenMetrics
      tags: [tokens]
      responses:
        '200':
          description: Token metrics
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/poa/authorize:
    post:
      summary: Authorize Power-of-Attorney request
      operationId: authorizePOA
      tags: [poa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Authorization decision }
  /api/v1/poa/metrics:
    get:
      summary: PoA metrics
      operationId: getPOAMetrics
      tags: [poa]
      responses:
        '200': { description: PoA metrics snapshot }
  /api/v1/events/emit:
    post:
      summary: Emit an event
      operationId: emitEvent
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Event accepted }
  /api/v1/events/stream:
    get:
      summary: Stream events (SSE)
      operationId: streamEvents
      tags: [events]
      responses:
        '200': { description: Event stream }
  /api/v1/audit/stream:
    get:
      summary: Stream audit log (SSE)
      operationId: streamAudit
      tags: [audit]
      responses:
        '200': { description: Audit event stream }
  /api/v1/beta/metrics/lifecycle:
    get:
      summary: Lifecycle metrics snapshot
      operationId: getLifecycleMetrics
      tags: [metrics]
      responses:
        '200': { description: Lifecycle metrics }
  /api/v1/beta/authz/evaluate:
    post:
      summary: Evaluate authorization (memory authorizer)
      operationId: evaluateAuthz
      tags: [authz]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Authorization result }
  /api/v1/beta/authz/metrics:
    get:
      summary: Authz metrics snapshot
      operationId: getAuthzMetrics
      tags: [authz]
      responses:
        '200': { description: Metrics map }
  /api/v1/beta/authz/metrics/prometheus:
    get:
      summary: Authz Prometheus metrics
      operationId: getAuthzMetricsPrometheus
      tags: [authz]
      responses:
        '200': { description: Prometheus metrics text }
  /api/v1/beta/policy/chain:
    get:
      summary: Policy chain entries (paginated)
      operationId: getPolicyChain
      tags: [policy]
      parameters:
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
          description: Zero-based offset into chain hash list (default 0)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
          description: Maximum number of hashes to return (default 50)
      responses:
        '200':
          description: Policy chain list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                sample:
                  value:
                    hashes: ["fedbe3", "47ac91"]
                    next_offset: 2
  /api/v1/beta/policy/head/policies:
    get:
      summary: Policies at current head
      operationId: getPolicyHeadPolicies
      tags: [policy]
      responses:
        '200': { description: Policies array }
  /api/v1/beta/policy/bundles:
    post:
      summary: Add policy bundle
      operationId: addPolicyBundle
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Bundle added }
  /api/v1/beta/policy/bundles/{hash}:
    get:
      summary: Fetch policy bundle by hash
      operationId: getPolicyBundle
      tags: [policy]
      parameters:
        - in: path
          name: hash
          required: true
          description: Content hash (e.g. SHA256 hex) identifying the stored policy bundle
          schema: { type: string }
      responses:
        '200':
          description: Policy bundle
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                sample:
                  value:
                    hash: "fedbe39fbf53f5fd9868554fc342e6d36167d2f1521b56cd8a5754ed82f147ee"
                    policies:
                      - id: "allow-read"
                        effect: "allow"
                        action: "read"
                        resource: "doc:123"
                      - id: "deny-write"
                        effect: "deny"
                        action: "write"
                        resource: "doc:123"
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: policy bundle not found
                    code: not_found
  /api/v1/beta/policy/audit-consistency:
    get:
      summary: Policy/audit consistency check
      operationId: getPolicyAuditConsistency
      tags: [policy]
      responses:
        '200': { description: Consistency result }
  /api/v1/beta/ping:
    get:
      summary: Liveness ping
      operationId: getPing
      tags: [health]
      responses:
        '200': { description: Pong }
  /api/v1/beta/health:
    get:
      summary: Health status
      operationId: getHealth
      tags: [health]
      responses:
        '200': { description: Health ok }
  /api/v1/beta/info:
    get:
      summary: Build & version info
      operationId: getInfo
      tags: [health]
      responses:
        '200': { description: Info object }
  /api/v1/openapi:
    get:
      summary: OpenAPI spec (JSON)
      operationId: getOpenAPIJSON
      tags: [discovery]
      responses:
        '200': { description: OpenAPI JSON }
        '304': { description: Not Modified }
  /openapi.yaml:
    get:
      summary: OpenAPI spec (YAML)
      operationId: getOpenAPIYAML
      tags: [discovery]
      responses:
        '200': { description: OpenAPI YAML }
        '304': { description: Not Modified }
  /api/v1/beta/examples/catalog:
    get:
      summary: Examples catalog
      operationId: getExamplesCatalog
      tags: [examples]
      responses:
        '200': { description: Catalog list }
  /api/v1/beta/examples/run:
    post:
      summary: Run example
      operationId: runExample
      tags: [examples]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Run accepted }
  /api/v1/beta/examples/run/jobs:
    get:
      summary: List running example jobs
      operationId: listExampleJobs
      tags: [examples]
      responses:
        '200': { description: Jobs list }
  /api/v1/beta/examples/composite/export/json:
    post:
      summary: Export composite example (JSON)
      operationId: exportExampleCompositeJSON
      tags: [examples]
      requestBody:
        required: false
      responses:
        '200': { description: Export JSON started }
  /api/v1/beta/examples/composite/export/csv:
    post:
      summary: Export composite example (CSV)
      operationId: exportExampleCompositeCSV
      tags: [examples]
      requestBody:
        required: false
      responses:
        '200': { description: Export CSV started }
  /api/v1/beta/examples/run/jobs/{id}/cancel:
    post:
      summary: Cancel example job
      operationId: cancelExampleJob
      tags: [examples]
      parameters:
        - in: path
          name: id
          required: true
          description: Unique job identifier returned from runExample (catalog execution)
          schema: { type: string }
      responses:
        '200':
          description: Cancel result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                success:
                  value:
                    success: true
                    status: cancelled
  /api/v1/beta/examples/run/{id}/status:
    get:
      summary: Example job status
      operationId: getExampleJobStatus
      tags: [examples]
      parameters:
        - in: path
          name: id
          required: true
          description: Unique job identifier returned from runExample
          schema: { type: string }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                running:
                  value:
                    status: running
                    progress_pct: 42
                    started_at: 2025-10-18T12:00:00Z
  /api/v1/beta/examples/run/{id}/logs:
    get:
      summary: Example job logs
      operationId: getExampleJobLogs
      tags: [examples]
      parameters:
        - in: path
          name: id
          required: true
          description: Unique job identifier whose logs are streamed (SSE)
          schema: { type: string }
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                sample:
                  value:
                    lines:
                      - "starting execution"
                      - "fetching policies"
                      - "completed"
  /api/v1/token/validate:
    post:
      summary: Validate a token
      operationId: validateToken
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  expires_at: { type: string, format: date-time }
                  reasons:
                    type: array
                    maxItems: 50
                    items: { type: string }
                  status: { type: string }
              examples:
                valid:
                  value:
                    valid: true
                    expires_at: 2025-10-18T13:00:00Z
                    reasons: []
                    status: valid
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                malformed:
                  value:
                    error: invalid_request
                    message: token field missing or empty
                    code: invalid_request
  /api/v1/token/status/update:
    post:
      summary: Update token status (e.g., revoke)
      operationId: updateTokenStatus
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdateRequest' }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusUpdateResponse' }
              examples:
                success:
                  value:
                    success: true
                    status: revoked
        '400':
          description: Invalid transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                invalid_transition:
                  value:
                    error: invalid_transition
                    message: terminated tokens cannot transition
                    code: invalid_transition
        '404':
          description: Token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: token not found
                    code: not_found
  /api/v1/delegation/status/update:
    post:
      summary: Update delegation status
      operationId: updateDelegationStatus
      tags: [delegation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdateRequest' }
      responses:
        '200': { description: Delegation status updated }
        '400':
          description: Invalid transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                invalid_transition:
                  value:
                    error: invalid_transition
                    message: terminated delegations cannot transition
                    code: invalid_transition
        '404':
          description: Delegation not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: delegation not found
                    code: not_found
  /api/v1/delegation/create:
    post:
      summary: Create a new delegation
      operationId: createDelegation
      tags: [delegation]
      description: |
        Create a new delegation granting authority from one principal to another.
        Subject receives delegated permissions to perform actions on resources.
        Requires capability enforcement when GAUTH_CAPABILITY_ENFORCE=1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreateRequest' }
            examples:
              financial_delegation:
                value:
                  subject: bob@example.com
                  resource: account:12345
                  action: transfer
                  scope: ["amount_limit:1000"]
                  delegation:
                    delegated_by: alice@example.com
                    delegated_to: bob@example.com
      responses:
        '200':
          description: Delegation created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationCreateResponse' }
              examples:
                success:
                  value:
                    success: true
                    poa:
                      id: poa_abc123def456
                      subject: bob@example.com
                      resource: account:12345
                      action: transfer
                      created_at: "2025-10-21T12:00:00Z"
                      expires_at: "2025-10-21T13:00:00Z"
        '400':
          description: Invalid delegation request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                missing_subject:
                  value:
                    error: invalid_request
                    message: subject field required
                    code: validation_error
        '403':
          description: Capability enforcement denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                capability_denied:
                  value:
                    error: forbidden
                    message: capability enforcement denied delegation creation
                    code: capability_enforcement_denied
  /api/v1/delegation/revoke:
    post:
      summary: Revoke an existing delegation
      operationId: revokeDelegation
      tags: [delegation]
      description: |
        Revoke a power-of-attorney delegation identified by PoA ID.
        Revoker identity must match the original delegator or have admin privileges.
        Requires capability enforcement when GAUTH_CAPABILITY_ENFORCE=1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationRevokeRequest' }
            examples:
              revoke_example:
                value:
                  poa_id: poa_abc123def456
                  revoker: alice@example.com
                  reason: delegation_no_longer_needed
      responses:
        '200':
          description: Delegation revoked successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationRevokeResponse' }
              examples:
                success:
                  value:
                    success: true
                    message: delegation revoked
                    poa_id: poa_abc123def456
        '400':
          description: Invalid revocation request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                missing_poa_id:
                  value:
                    error: invalid_request
                    message: poa_id field required
                    code: validation_error
        '403':
          description: Unauthorized revoker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                unauthorized:
                  value:
                    error: forbidden
                    message: revoker not authorized
                    code: unauthorized_revoker
        '404':
          description: Delegation not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: delegation not found
                    code: not_found
  /api/v1/beta/poa/sign:
    post:
      summary: Submit signature for multi-signature PoA collection
      operationId: submitMultiSignature
      tags: [poa, multisig]
      description: |
        Submit a cryptographic signature for multi-signature PoA workflow.
        Signature must be base64-encoded Ed25519 signature over canonical PoA digest.
        Supports M-of-N threshold enforcement and optional weighted signatures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MultiSignatureRequest' }
            examples:
              board_approval:
                value:
                  poa_id: poa_multisig_789
                  signer_id: board_member_3
                  key_id: ed25519:abc123
                  signature: SGVsbG8gV29ybGQhIFRoaXMgaXMgYSBiYXNlNjQgZW5jb2RlZCBzaWduYXR1cmUu
                  metadata:
                    approval_timestamp: "2025-10-21T12:05:00Z"
                    approval_reason: high_value_transaction_approved
      responses:
        '200':
          description: Signature submitted successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MultiSignatureResponse' }
              examples:
                threshold_not_met:
                  value:
                    success: true
                    message: signature accepted
                    poa_id: poa_multisig_789
                    signer_id: board_member_3
                    threshold_met: false
                    collected_count: 2
                    required_count: 3
                threshold_met:
                  value:
                    success: true
                    message: signature accepted - threshold met
                    poa_id: poa_multisig_789
                    signer_id: board_member_5
                    threshold_met: true
                    collected_count: 3
                    required_count: 3
        '400':
          description: Invalid signature submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                invalid_signature:
                  value:
                    error: invalid_signature
                    message: signature verification failed
                    code: signature_verification_failed
                duplicate_signature:
                  value:
                    error: duplicate_signature
                    message: signer already submitted signature
                    code: duplicate_signer
        '404':
          description: PoA collection not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: no signature collection found for poa_id
                    code: collection_not_found
        '409':
          description: Collection already completed or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                already_completed:
                  value:
                    error: conflict
                    message: collection already completed
                    code: collection_completed
  /api/v1/beta/poa/{id}/multisig/status:
    get:
      summary: Get multi-signature collection status
      operationId: getMultiSignatureStatus
      tags: [poa, multisig]
      description: |
        Retrieve current status of multi-signature PoA collection.
        Returns threshold configuration, collected signatures, remaining signers,
        and weighted signature totals if applicable.
      parameters:
        - in: path
          name: id
          required: true
          description: PoA identifier for multi-signature collection
          schema: { type: string }
      responses:
        '200':
          description: Collection status retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MultiSignatureStatusResponse' }
              examples:
                pending:
                  value:
                    poa_id: poa_multisig_789
                    status: pending
                    created_at: "2025-10-21T12:00:00Z"
                    expires_at: "2025-10-21T13:00:00Z"
                    threshold: 3
                    collected_count: 2
                    remaining_signers: ["board_member_4", "board_member_5"]
                    collected_signatures:
                      - signer_id: board_member_1
                        key_id: ed25519:abc111
                        submitted_at: "2025-10-21T12:01:00Z"
                      - signer_id: board_member_3
                        key_id: ed25519:abc333
                        submitted_at: "2025-10-21T12:05:00Z"
                    use_weighted: false
                completed_weighted:
                  value:
                    poa_id: poa_weighted_456
                    status: completed
                    created_at: "2025-10-21T11:00:00Z"
                    expires_at: "2025-10-21T12:00:00Z"
                    threshold: 51
                    collected_count: 3
                    remaining_signers: []
                    collected_signatures:
                      - signer_id: ceo
                        key_id: ed25519:ceo123
                        submitted_at: "2025-10-21T11:10:00Z"
                        weight: 40
                      - signer_id: cfo
                        key_id: ed25519:cfo456
                        submitted_at: "2025-10-21T11:15:00Z"
                        weight: 30
                      - signer_id: board_chair
                        key_id: ed25519:chair789
                        submitted_at: "2025-10-21T11:20:00Z"
                        weight: 25
                    use_weighted: true
                    collected_weight: 95
                    total_weight: 100
        '404':
          description: Collection not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: no signature collection found
                    code: collection_not_found
  /api/v1/beta/poa/{id}/activate:
    post:
      summary: Activate PoA after threshold completion
      operationId: activateMultiSignaturePoA
      tags: [poa, multisig]
      description: |
        Activate a PoA once multi-signature threshold is met.
        Validates threshold completion and transitions collection to active state.
        Once activated, the PoA can be used for authorization decisions.
      parameters:
        - in: path
          name: id
          required: true
          description: PoA identifier to activate
          schema: { type: string }
      responses:
        '200':
          description: PoA activated successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MultiSignatureActivateResponse' }
              examples:
                success:
                  value:
                    success: true
                    message: PoA activated
                    poa_id: poa_multisig_789
        '400':
          description: Activation requirements not met
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                threshold_not_met:
                  value:
                    error: invalid_request
                    message: cannot activate - threshold not met (2/3 signatures)
                    code: threshold_not_met
        '404':
          description: Collection not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: no signature collection found
                    code: collection_not_found
        '409':
          description: PoA already activated or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                already_active:
                  value:
                    error: conflict
                    message: PoA already activated
                    code: already_activated
  /api/v1/beta/poa/multisig/pending:
    get:
      summary: List pending multi-signature collections
      operationId: listPendingMultiSignatures
      tags: [poa, multisig]
      description: |
        Retrieve all pending multi-signature PoA collections.
        Returns collections awaiting signature threshold completion.
        Excludes expired, completed, or activated collections.
      responses:
        '200':
          description: Pending collections list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MultiSignaturePendingResponse' }
              examples:
                multiple_pending:
                  value:
                    collections:
                      - poa_id: poa_multisig_789
                        status: pending
                        created_at: "2025-10-21T12:00:00Z"
                        expires_at: "2025-10-21T13:00:00Z"
                        threshold: 3
                        collected_count: 2
                      - poa_id: poa_multisig_456
                        status: pending
                        created_at: "2025-10-21T11:30:00Z"
                        expires_at: "2025-10-21T12:30:00Z"
                        threshold: 5
                        collected_count: 3
  /api/v1/beta/delegation/create:
    post:
      summary: Create delegation (beta alias)
      operationId: createDelegationBeta
      tags: [delegation]
      description: Beta-prefixed alias for /api/v1/delegation/create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreateRequest' }
      responses:
        '200':
          description: Delegation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationCreateResponse' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
  /api/v1/beta/delegation/revoke:
    post:
      summary: Revoke delegation (beta alias)
      operationId: revokeDelegationBeta
      tags: [delegation]
      description: Beta-prefixed alias for /api/v1/delegation/revoke
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationRevokeRequest' }
      responses:
        '200':
          description: Delegation revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationRevokeResponse' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
  /api/v1/beta/delegation/status/update:
    post:
      summary: Update delegation status (beta alias)
      operationId: updateDelegationStatusBeta
      tags: [delegation]
      description: Beta-prefixed alias for /api/v1/delegation/status/update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdateRequest' }
      responses:
        '200': { description: Status updated }
        '400':
          description: Invalid transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
  /api/v1/beta/lifecycle/timeline:
    get:
      summary: Fetch lifecycle timeline entries
      operationId: getLifecycleTimeline
      tags: [lifecycle]
      parameters:
        - in: query
          name: entity_type
          schema: { type: string, enum: [token, delegation] }
          description: Filter events by entity type (token or delegation)
        - in: query
          name: entity_id
          schema: { type: string }
          description: Restrict to a single entity identifier
        - in: query
          name: since
          schema: { type: integer, minimum: 0 }
          description: Unix timestamp (seconds); only include events at or after this time
        - in: query
          name: outcome
          schema: { type: string, enum: [success, failure, noop] }
          description: Filter by transition outcome classification
        - in: query
          name: reason
          schema: { type: string }
          description: Filter by lifecycle transition reason (e.g. status_change, invalid_transition)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 250 }
          description: Maximum number of events to return (default 100)
      responses:
        '200':
          description: Timeline entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    maxItems: 500
                    items: { $ref: '#/components/schemas/TimelineEntry' }
                  truncated: { type: boolean }
              examples:
                sample:
                  value:
                    entries:
                      - id: "tok_123"
                        kind: token
                        status: revoked
                        at_unix: 1697635200
                        reason: status_change
                    truncated: false
  /api/v1/beta/policy/metrics:
    get:
      summary: Policy decision & lifecycle metrics snapshot (JSON)
      operationId: getPolicyMetrics
      tags: [policy]
      responses:
        '200': { description: Metrics snapshot }
  /api/v1/beta/policy/metrics/prometheus:
    get:
      summary: Prometheus text exposition
      operationId: getPolicyMetricsPrometheus
      tags: [policy]
      responses:
        '200': { description: Prometheus metrics text }
  /api/v1/token/revoke:
    post:
      summary: Revoke a token
      operationId: revokeToken
      tags: [revocation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRevokeRequest' }
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenRevokeResponse' }
              examples:
                revoked:
                  value:
                    success: true
                    status: revoked
        '404':
          description: Token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: token not found
                    code: not_found
  /api/v1/token/revocation/head:
    get:
      summary: Get revocation chain head
      operationId: getRevocationHead
      tags: [revocation]
      responses:
        '200':
          description: Revocation head hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationHeadResponse' }
              examples:
                example:
                  value:
                    head: abc123
                    aggregate: aggdeadbeef
                    length: 10
                    verified: true
  /api/v1/token/introspect:
    post:
      summary: Introspect a token (if enabled)
      operationId: introspectToken
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        '200':
          description: Introspection result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIntrospectionResponse' }
              examples:
                inactive:
                  value:
                    active: false
                    reasons: [expired]
  /api/v1/beta/policy/evaluate:
    post:
      summary: Evaluate a policy decision
      operationId: evaluatePolicy
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyEvaluateRequest' }
      responses:
        '200': { description: Evaluation response }
  /api/v1/beta/policy/provenance:
    get:
      summary: Fetch policy provenance summary
      operationId: getPolicyProvenance
      tags: [policy]
      responses:
        '200': { description: Provenance information }
  /api/v1/audit/record:
    post:
      summary: Append an audit record
      operationId: recordAudit
      tags: [audit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditRecordRequest' }
      responses:
        '200': { description: Audit record stored }
  /api/v1/audit/logs:
    get:
      summary: List audit log entries
      operationId: listAuditLogs
      tags: [audit]
      responses:
        '200':
          description: Audit log list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogListResponse' }
  /.well-known/gauth-configuration:
    get:
      summary: Discovery metadata
      operationId: getDiscovery
      tags: [discovery]
      responses:
        '200': { description: Discovery document }
  /.well-known/jwks.json:
    get:
      summary: JWKS publication endpoint
      operationId: getJWKS
      tags: [jwks]
      responses:
        '200': { description: JSON Web Key Set }
        '304': { description: Not Modified }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenIssueRequest:
      type: object
      properties:
        subject: { type: string, description: Principal (user or system) requesting token }
        scopes:
          type: array
          maxItems: 50
          items: { type: string, description: Scope string granting permission (demo semantics) }
          description: List of scope strings granting permissions
        ttl_seconds: { type: integer, minimum: 1, description: Time-to-live (seconds) for issued token }
      required: [subject]
    TokenIssueResponse:
      type: object
      properties:
        token: { type: string, description: Raw issued token (demo JWT or internal format) }
        token_id: { type: string, description: Internal token identifier }
        issued_at: { type: string, format: date-time, description: RFC3339 issuance timestamp }
        expires_at: { type: string, format: date-time, description: RFC3339 expiration timestamp }
      required: [token, token_id, issued_at, expires_at]
    StatusUpdateRequest:
      type: object
      properties:
        id: { type: string, description: Target entity identifier (token or delegation id) }
        status: { type: string, description: Requested status value (active|suspended|revoked|terminated) }
        reason: { type: string, description: Optional human-readable reason for status change }
      required: [id, status]
    StatusUpdateResponse:
      type: object
      properties:
        success: { type: boolean, description: Indicates status was applied successfully }
        status: { type: string, description: Final status after update }
      required: [success, status]
    TimelineEntry:
      type: object
      properties:
        id: { type: string, description: Entity identifier whose lifecycle changed }
        kind: { type: string, enum: [token, delegation], description: Entity type }
        status: { type: string, description: Resulting status after transition }
        at_unix: { type: integer, description: Transition time (unix seconds) }
        reason: { type: string, description: Cause categorization (e.g. status_change, invalid_transition) }
      required: [id, kind, status, at_unix]
    StandardError:
      type: object
      description: Standard error envelope with optional machine-readable code.
      properties:
        error: { type: string, description: Short error category }
        message: { type: string, description: Human-readable detail message }
        code: { type: string, description: Machine-readable error code }
        details: { type: object, additionalProperties: true, description: Optional structured details map }
      required: [error]
    TokenRevokeRequest:
      type: object
      properties:
        token_id: { type: string, description: Identifier of token to revoke }
        reason: { type: string, description: Optional reason for revocation }
      required: [token_id]
    TokenRevokeResponse:
      type: object
      properties:
        success: { type: boolean, description: Indicates revocation succeeded }
        status: { type: string, description: Resulting token status (revoked) }
      required: [success, status]
    PolicyEvaluateRequest:
      type: object
      properties:
        subject: { type: string, description: Principal performing the action }
        action: { type: string, description: Verb being authorized (read|write...) }
        resource: { type: string, description: Resource identifier or ARN-like string }
        context: { type: object, additionalProperties: true, description: Supplemental key/value context for policy evaluation }
      required: [subject, action, resource]
    PolicyEvaluateResponse:
      type: object
      properties:
        decision: { type: string, enum: [allow, deny], description: Final authorization decision }
        reasons:
          type: array
          maxItems: 50
          items: { type: string, description: Explanation fragments contributing to decision }
          description: Ordered list of explanatory fragments supporting decision
        latency_ms: { type: number, description: Evaluation latency (milliseconds) }
      required: [decision]
    AuditRecordRequest:
      type: object
      properties:
        event: { type: string, description: Audit event type label }
        actor: { type: string, description: Initiating principal or system }
        target: { type: string, description: Target entity/resource of event }
        metadata: { type: object, additionalProperties: true, description: Additional structured metadata }
      required: [event]
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, description: Unique audit log entry identifier }
        at: { type: string, format: date-time, description: Event timestamp (RFC3339) }
        event: { type: string, description: Event type }
        actor: { type: string, description: Principal initiating the event }
        target: { type: string, description: Primary target of event }
        metadata: { type: object, additionalProperties: true, description: Structured event metadata }
      required: [id, at, event]
    AuditLogListResponse:
      type: object
      properties:
        entries:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AuditLogEntry', description: Audit log entries returned }
          description: Page of audit log entries matching query
        total: { type: integer, description: Total entries across all pages }
      required: [entries]
    RevocationHeadResponse:
      type: object
      properties:
        head: { type: string, description: Current head hash of revocation chain }
        aggregate: { type: string, description: Aggregate hash summarizing entire chain }
        length: { type: integer, description: Number of revocation entries in chain }
        verified: { type: boolean, description: Indicates chain integrity verification success }
      required: [head]
    PolicyProvenanceResponse:
      type: object
      properties:
        chain_head_hash: { type: string, description: Head hash of policy chain }
        policies_count: { type: integer, description: Total number of policies registered }
        verified: { type: boolean, description: Indicates chain verification success }
        last_updated: { type: string, format: date-time, description: Timestamp of last modification }
      required: [chain_head_hash]
    TokenIntrospectionResponse:
      type: object
      properties:
        active: { type: boolean, description: Whether token is currently active }
        token_id: { type: string, description: Internal token identifier }
        subject: { type: string, description: Subject claim or internal subject }
        scopes:
          type: array
          maxItems: 50
          items: { type: string, description: Granted scope string }
          description: Current granted scope set (may shrink if partially revoked)
        issued_at: { type: string, format: date-time, description: Issuance time }
        expires_at: { type: string, format: date-time, description: Expiration time }
        reasons:
          type: array
          maxItems: 50
          items: { type: string, description: Reason codes for inactive state }
          description: List of reason codes explaining inactive or partially limited state
      required: [active]
    JWKSResponse:
      type: object
      properties:
        keys:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/JWK', description: JSON Web Key }
          description: Public keys for signature verification
      required: [keys]
    JWK:
      type: object
      properties:
        kty: { type: string, description: Key type (e.g. RSA, EC, oct) }
        kid: { type: string, description: Key identifier }
        use: { type: string, description: Intended use (sig or enc) }
        alg: { type: string, description: Algorithm (e.g. RS256, EdDSA) }
        n: { type: string, description: RSA modulus (base64url) }
        e: { type: string, description: RSA exponent (base64url) }
      required: [kty, kid]
    DelegationCreateRequest:
      type: object
      description: Request to create a new delegation
      properties:
        subject: { type: string, description: Principal receiving delegated authority }
        resource: { type: string, description: Resource identifier being delegated }
        action: { type: string, description: Action permitted by delegation }
        scope:
          type: array
          maxItems: 50
          items: { type: string }
          description: Optional scope constraints for delegation
        context: { type: object, additionalProperties: true, description: Additional context metadata }
        delegation:
          type: object
          description: Delegation relationship details
          properties:
            delegated_by: { type: string, description: Original authority holder delegating power }
            delegated_to: { type: string, description: Recipient of delegated authority (same as subject) }
          required: [delegated_by, delegated_to]
      required: [subject, resource, action]
    DelegationCreateResponse:
      type: object
      description: Response after successful delegation creation
      properties:
        success: { type: boolean, description: Indicates successful creation }
        poa:
          type: object
          description: Created power-of-attorney object
          properties:
            id: { type: string, description: Unique PoA identifier }
            subject: { type: string, description: Delegated principal }
            resource: { type: string, description: Delegated resource }
            action: { type: string, description: Delegated action }
            created_at: { type: string, format: date-time, description: Creation timestamp }
            expires_at: { type: string, format: date-time, description: Expiration timestamp }
          required: [id, subject, resource, action, created_at]
      required: [success, poa]
    DelegationRevokeRequest:
      type: object
      description: Request to revoke an existing delegation
      properties:
        poa_id: { type: string, description: PoA identifier to revoke }
        revoker: { type: string, description: Principal performing revocation }
        reason: { type: string, description: Optional human-readable reason for revocation }
      required: [poa_id, revoker]
    DelegationRevokeResponse:
      type: object
      description: Response after successful delegation revocation
      properties:
        success: { type: boolean, description: Indicates successful revocation }
        message: { type: string, description: Human-readable confirmation message }
        poa_id: { type: string, description: Revoked PoA identifier }
      required: [success, message, poa_id]
    MultiSignatureRequest:
      type: object
      description: Request to submit signature for multi-sig PoA collection
      properties:
        poa_id: { type: string, description: PoA identifier for signature collection }
        signer_id: { type: string, description: Identity of signer submitting signature }
        key_id: { type: string, description: Public key identifier used for signing }
        signature: { type: string, description: Base64-encoded Ed25519 signature over canonical PoA digest }
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata about signature submission (timestamps, approval reasons, etc.)
      required: [poa_id, signer_id, key_id, signature]
    MultiSignatureResponse:
      type: object
      description: Response after signature submission
      properties:
        success: { type: boolean, description: Indicates successful signature acceptance }
        message: { type: string, description: Human-readable status message }
        poa_id: { type: string, description: PoA identifier }
        signer_id: { type: string, description: Signer who submitted signature }
        threshold_met: { type: boolean, description: Whether signature threshold is now satisfied }
        collected_count: { type: integer, description: Number of signatures collected so far }
        required_count: { type: integer, description: Total signatures required to meet threshold }
      required: [success, message, poa_id, signer_id, threshold_met, collected_count, required_count]
    MultiSignatureStatusResponse:
      type: object
      description: Current status of multi-signature PoA collection
      properties:
        poa_id: { type: string, description: PoA identifier }
        status: { type: string, enum: [pending, completed, active, expired], description: Collection lifecycle status }
        created_at: { type: string, format: date-time, description: Collection creation timestamp }
        expires_at: { type: string, format: date-time, description: Collection expiration timestamp }
        threshold: { type: integer, description: Required number of signatures (M-of-N threshold) }
        collected_count: { type: integer, description: Current number of collected signatures }
        remaining_signers:
          type: array
          maxItems: 100
          items: { type: string }
          description: List of signer IDs who have not yet submitted signatures
        collected_signatures:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              signer_id: { type: string, description: Signer identity }
              key_id: { type: string, description: Public key identifier }
              submitted_at: { type: string, format: date-time, description: Signature submission timestamp }
              weight: { type: integer, description: Signature weight (if weighted mode enabled) }
            required: [signer_id, key_id, submitted_at]
          description: Array of collected signatures with metadata
        use_weighted: { type: boolean, description: Whether weighted signature mode is enabled }
        collected_weight: { type: integer, description: Total weight of collected signatures (weighted mode only) }
        total_weight: { type: integer, description: Sum of all signer weights (weighted mode only) }
      required: [poa_id, status, created_at, threshold, collected_count, remaining_signers, collected_signatures]
    MultiSignatureActivateResponse:
      type: object
      description: Response after PoA activation
      properties:
        success: { type: boolean, description: Indicates successful activation }
        message: { type: string, description: Human-readable confirmation message }
        poa_id: { type: string, description: Activated PoA identifier }
      required: [success, message, poa_id]
    MultiSignaturePendingResponse:
      type: object
      description: List of pending multi-signature collections
      properties:
        collections:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              poa_id: { type: string, description: PoA identifier }
              status: { type: string, enum: [pending], description: Collection status }
              created_at: { type: string, format: date-time, description: Creation timestamp }
              expires_at: { type: string, format: date-time, description: Expiration timestamp }
              threshold: { type: integer, description: Required signature threshold }
              collected_count: { type: integer, description: Current collected signature count }
            required: [poa_id, status, created_at, threshold, collected_count]
          description: Array of pending collections awaiting threshold completion
      required: [collections]
