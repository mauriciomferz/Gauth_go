openapi: 3.1.0
info:
  title: GAuth Demo API
  version: 0.3.2-beta
  description: |
    Core GAuth demo endpoints including token issuance, validation, revocation,
    delegation status, lifecycle timeline, policy evaluation & metrics, examples,
    JWKS publication, discovery metadata and audit/event streaming. Arrays are
    bounded to prevent unbounded growth. This spec is normalized for lint rules.

servers:
  - url: /
    description: Root (relative paths)

tags:
  - name: tokens
    description: Token issuance, validation, status & revocation endpoints
  - name: delegation
    description: Delegation (power-of-attorney) lifecycle endpoints
  - name: poa
    description: Power-of-attorney authorization & metrics
  - name: crypto
    description: Cryptographic algorithm introspection & operations
  - name: bls
    description: BLS aggregated signature and proof-of-possession operations
  - name: anchor
    description: External capability & rotation anchoring endpoints
  - name: authz
    description: Authorization evaluation and metrics
  - name: policy
    description: Policy chain, bundles, evaluation & provenance
  - name: lifecycle
    description: Lifecycle timeline & metrics endpoints
  - name: revocation
    description: Token revocation chain management
  - name: events
    description: Generic event emission and streaming
  - name: audit
    description: Audit logging & streaming
  - name: discovery
    description: API discovery metadata & OpenAPI retrieval
  - name: jwks
    description: JSON Web Key Set publication
  - name: health
    description: Health & info endpoints
  - name: examples
    description: Example catalog and execution workflow
  - name: multisig
    description: Multi-signature collection and activation flows
  - name: diagnostics
    description: Semantic metrics & anomaly diagnostics endpoints

security:
  - BearerAuth: []

paths:
  /api/v1/token/create:
    post:
      summary: Issue a new token
      operationId: issueToken
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenIssueRequest'
            examples:
              minimal:
                value:
                  subject: alice@example.com
                  ttl_seconds: 3600
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIssueResponse' }
              examples:
                success:
                  value:
                    token: eyJhbGciOi...demo
                    token_id: tok_123
                    issued_at: 2025-10-18T12:00:00Z
                    expires_at: 2025-10-18T13:00:00Z
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                missing_subject:
                  value:
                    error: invalid_request
                    message: subject field required
                    code: invalid_request
  /api/v1/token/metrics:
    get:
      summary: Token metrics snapshot
      operationId: getTokenMetrics
      tags: [tokens]
      responses:
        '200':
          description: Token metrics
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/poa/authorize:
    post:
      summary: Authorize Power-of-Attorney request
      operationId: authorizePOA
      tags: [poa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Authorization decision }
  /api/v1/poa/issue:
    post:
      summary: Issue (generate) a Power-of-Attorney (PoA) document with canonical digest
      operationId: issuePOA
      tags: [poa, multisig]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string, description: Delegated principal }
                resource: { type: string, description: Resource identifier }
                action: { type: string, description: Action delegated }
                ttl_seconds: { type: integer, minimum: 1, description: Lifetime (seconds) for PoA }
                signer_kids:
                  type: array
                  maxItems: 20
                  items: { type: string }
                  description: Ordered list of key IDs requested to sign (multisig mode)
                threshold: { type: integer, minimum: 1, description: Required signature count (multisig) }
                sig_mode: { type: string, enum: [single, multisig], description: Signature mode selection }
              required: [subject, resource, action]
      responses:
        '200':
          description: PoA issued successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoADocument' }
        '400':
          description: Invalid issuance request (missing fields, bad threshold)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/poa/verify:
    post:
      summary: Verify PoA document canonical digest and signatures (single or multisig)
      operationId: verifyPOA
      tags: [poa, multisig]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoAVerifyRequest' }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoAVerifyResponse' }
        '400':
          description: Invalid PoA payload (malformed fields or signatures array)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/poa/metrics:
    get:
      summary: PoA metrics
      operationId: getPOAMetrics
      tags: [poa]
      responses:
        '200': { description: PoA metrics snapshot }
  /api/v1/crypto/algorithms:
    get:
      summary: List cryptographic algorithms registered
      operationId: listAlgorithms
      tags: [crypto]
      responses:
        '200':
          description: Algorithm list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  algorithms:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        aggregated_supported: { type: boolean }
                  count: { type: integer }
  /api/v1/crypto/bls/aggregate:
    post:
      summary: Issue aggregated BLS signatures or PoP challenges; verify aggregated signatures
      operationId: blsAggregate
      tags: [crypto, bls]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [issue, verify]
                message_b64: { type: string, description: Base64 message }
                participants: { type: integer, minimum: 1, maximum: 64 }
                private_keys_b64:
                  type: array
                  maxItems: 64
                  items: { type: string }
                aggregated_signature_b64: { type: string }
                public_keys_b64:
                  type: array
                  maxItems: 64
                  items: { type: string }
                require_pop: { type: boolean, description: Issue PoP challenges instead of aggregated signature }
      responses:
        '200':
          description: Success (variant by mode)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean }
                      mode: { type: string, enum: [issue] }
                      participant_count: { type: integer }
                      aggregated_signature_b64: { type: string }
                      public_keys_b64:
                        type: array
                        items: { type: string }
                      key_ids:
                        type: array
                        items: { type: string }
                      latency_ms: { type: number }
                  - type: object
                    properties:
                      success: { type: boolean }
                      mode: { type: string, enum: [issue_pop] }
                      participant_count: { type: integer }
                      public_keys_b64:
                        type: array
                        items: { type: string }
                      key_ids:
                        type: array
                        items: { type: string }
                      challenges_b64:
                        type: array
                        items: { type: string }
                      latency_ms: { type: number }
                  - type: object
                    properties:
                      success: { type: boolean }
                      mode: { type: string, enum: [verify] }
                      participant_count: { type: integer }
                      valid: { type: boolean }
                      latency_ms: { type: number }
        '400':
          description: Invalid request parameters (see code for categorical error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
          headers:
            X-Error-Code: { description: Machine-readable code (mirrors body.code), schema: { type: string } }
        '500':
          description: Internal failure (e.g. bls_init_failed, nonce_gen_failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/crypto/bls/pop/verify:
    post:
      summary: Verify BLS Proof-of-Possession signatures over issued challenges
      operationId: blsPoPVerify
      tags: [crypto, bls]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pairs:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required: [public_key_b64, signature_b64, challenge_b64]
                    properties:
                      public_key_b64: { type: string }
                      signature_b64: { type: string }
                      challenge_b64: { type: string }
      responses:
        '200':
          description: Verification result summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  valid: { type: boolean }
                  total: { type: integer }
                  failures: { type: integer }
                  failure_indices:
                    type: array
                    items: { type: integer }
                  latency_ms: { type: number }
        '400':
          description: Invalid request body (bad_request, no_pairs)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: BLS library initialization failure (bls_init_failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/anchor/chain:
    get:
      summary: Retrieve external capability anchor receipt chain
      operationId: anchorChain
      tags: [anchor]
      responses:
        '200':
          description: Chain receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  receipts:
                    type: array
                    items:
                      type: object
                      properties:
                        hash: { type: string }
                        timestamp: { type: string }
                        provider: { type: string }
                        version: { type: string }
                        latency_seconds: { type: number }
                        prev_hash: { type: string }
                        chain_hash: { type: string }
        '503':
          description: Chain not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/anchor/emitCombined:
    post:
      summary: Emit combined capability + rotation anchor receipt
      operationId: anchorEmitCombined
      tags: [anchor]
      security:
        - CombinedAnchorToken: []
      responses:
        '200':
          description: Combined anchor emitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  combined_hash: { type: string }
                  rotation_head: { type: string }
                  capability_hash: { type: string }
        '400':
          description: Invalid request (missing capability or rotation material)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication failed (token missing or mismatched)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Emission forbidden by configuration or policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Receipt store not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal append failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/anchor/verifyChain:
    get:
      summary: Verify anchor receipt chain integrity
      operationId: anchorVerifyChain
      tags: [anchor]
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  status: { type: string, enum: [ok, mismatch, empty] }
                  mismatch_index: { type: integer }
        '500':
          description: Verification processing error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/anchor/revocation/emit:
    post:
      summary: Emit external anchor receipt for current revocation Merkle root
      operationId: anchorRevocationEmit
      tags: [anchor, revocation]
      responses:
        '200':
          description: Revocation root anchored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  hash: { type: string }
                  anchored_at: { type: string, format: date-time }
                  total: { type: integer }
                  merkle_root: { type: string }
                  chain_length: { type: integer }
                  type: { type: string, enum: [revocation_root] }
                  latest_tree_head: { type: object, additionalProperties: true }
              examples:
                success:
                  value:
                    success: true
                    hash: "5f3e2b2c9a8d...demo"
                    anchored_at: "2025-10-26T02:50:33Z"
                    total: 7
                    merkle_root: "a4c9f7d1e3b2...root"
                    chain_length: 42
                    type: "revocation_root"
                    latest_tree_head:
                      chain_length: 42
                      merkle_root: "a4c9f7d1e3b2...root"
                      aggregate_hash: "93ff0b8d7c...agg"
                idempotent_repeat:
                  summary: Same hash returned when called again with unchanged root
                  value:
                    success: true
                    hash: "5f3e2b2c9a8d...demo"
                    anchored_at: "2025-10-26T02:50:33Z"
                    total: 7
                    merkle_root: "a4c9f7d1e3b2...root"
                    chain_length: 42
                    type: "revocation_root"
        '400':
          description: Empty or invalid Merkle root (revocation_root_empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                root_empty:
                  value:
                    success: false
                    code: revocation_root_empty
                    error: revocation_root_empty
                    message: revocation merkle root empty
                    rfc_ref: "rfc111:revocation_anchor"
        '404':
          description: Revocation chain empty (revocation_chain_empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                chain_empty:
                  value:
                    success: false
                    code: revocation_chain_empty
                    error: revocation_chain_empty
                    message: revocation chain empty
                    rfc_ref: "rfc111:revocation_anchor"
        '500':
          description: Anchor failure or client unavailable (revocation_anchor_failure | revocation_anchor_client_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                client_unavailable:
                  value:
                    success: false
                    code: revocation_anchor_client_unavailable
                    error: anchor_client_unavailable
                    message: anchor client unavailable
                    rfc_ref: "rfc111:revocation_anchor"
                anchor_failure:
                  value:
                    success: false
                    code: revocation_anchor_failure
                    error: anchor_failure
                    message: failed anchoring revocation root
                    rfc_ref: "rfc111:revocation_anchor"
  /api/v1/diagnostics/semantic:
    get:
      summary: Semantic counters, history & anomaly diagnostics
      operationId: getSemanticDiagnostics
      tags: [diagnostics]
      responses:
        '200':
          description: Diagnostics payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  wired: { type: boolean }
                  timestamp: { type: string }
                  counters:
                    type: object
                    additionalProperties: { type: integer }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        at: { type: string }
                        counters:
                          type: object
                          additionalProperties: { type: integer }
                  anomaly:
                    type: object
                    properties:
                      rate_per_minute_60s:
                        type: object
                        additionalProperties: { type: number }
                      rate_per_minute_300s:
                        type: object
                        additionalProperties: { type: number }
                      scores:
                        type: object
                        additionalProperties: { type: number }
                  integrity_status: { type: string }
                  history_window_cap: { type: integer }
                  prev_hash: { type: string }
                  current_hash: { type: string }
              examples:
                wired_false_minimal:
                  value:
                    success: true
                    wired: false
                    timestamp: "2025-10-26T02:52:16Z"
                    counters: {}
                    history: []
                    anomaly:
                      rate_per_minute_60s: {}
                      rate_per_minute_300s: {}
                      scores: {}
                    integrity_status: unconfigured
                    history_window_cap: 120
                    prev_hash: ""
                    current_hash: ""
                wired_true_populated:
                  summary: Example with populated counters, history and anomaly scores
                  value:
                    success: true
                    wired: true
                    timestamp: "2025-10-26T02:53:10Z"
                    counters:
                      scope_violation: 12
                      restriction_mismatch: 3
                    history:
                      - at: "2025-10-26T02:52:50Z"
                        counters:
                          scope_violation: 10
                          restriction_mismatch: 3
                      - at: "2025-10-26T02:53:00Z"
                        counters:
                          scope_violation: 12
                          restriction_mismatch: 3
                    anomaly:
                      rate_per_minute_60s:
                        scope_violation: 4.2
                        restriction_mismatch: 0
                      rate_per_minute_300s:
                        scope_violation: 1.1
                        restriction_mismatch: 0
                      scores:
                        scope_violation: 1.37
                        restriction_mismatch: 0
                    integrity_status: ok
                    history_window_cap: 120
                    prev_hash: "d34db33fprevhashdemo"
                    current_hash: "cafebabecurrenthashdemo"
        '500':
          description: Metrics unavailable (semantic_metrics_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                metrics_unavailable:
                  value:
                    success: false
                    code: semantic_metrics_unavailable
                    error: semantic_metrics_unavailable
                    message: semantic metrics unavailable
                    rfc_ref: "rfc115:semantic_diagnostics"
  /api/v1/events/emit:
    post:
      summary: Emit an event
      operationId: emitEvent
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Event accepted }
  /api/v1/events/stream:
    get:
      summary: Stream events (SSE)
      operationId: streamEvents
      tags: [events]
      responses:
        '200': { description: Event stream }
  /api/v1/audit/stream:
    get:
      summary: Stream audit log (SSE)
      operationId: streamAudit
      tags: [audit]
      responses:
        '200': { description: Audit event stream }
  /api/v1/beta/metrics/lifecycle:
    get:
      summary: Lifecycle metrics snapshot
      operationId: getLifecycleMetrics
      tags: [metrics]
      responses:
        '200': { description: Lifecycle metrics }
  /api/v1/beta/authz/evaluate:
    post:
      summary: Evaluate authorization (memory authorizer)
      operationId: evaluateAuthz
      tags: [authz]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Authorization result }
  /api/v1/beta/authz/metrics:
    get:
      summary: Authz metrics snapshot
      operationId: getAuthzMetrics
      tags: [authz]
      responses:
        '200': { description: Metrics map }
  /api/v1/beta/authz/metrics/prometheus:
    get:
      summary: Authz Prometheus metrics
      operationId: getAuthzMetricsPrometheus
      tags: [authz]
      responses:
        '200': { description: Prometheus metrics text }
  /api/v1/beta/policy/chain:
    get:
      summary: Policy chain entries (paginated)
      operationId: getPolicyChain
      tags: [policy]
      parameters:
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
          description: Zero-based offset into chain hash list (default 0)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
          description: Maximum number of hashes to return (default 50)
      responses:
        '200':
          description: Policy chain list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                sample:
                  value:
                    hashes: ["fedbe3", "47ac91"]
                    next_offset: 2
  /api/v1/beta/policy/head/policies:
    get:
      summary: Policies at current head
      operationId: getPolicyHeadPolicies
      tags: [policy]
      responses:
        '200': { description: Policies array }
  /api/v1/beta/policy/bundles:
    post:
      summary: Add policy bundle
      operationId: addPolicyBundle
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Bundle added }
  /api/v1/beta/policy/bundles/{hash}:
    get:
      summary: Fetch policy bundle by hash
      operationId: getPolicyBundle
      tags: [policy]
      parameters:
        - in: path
          name: hash
          required: true
          description: Content hash (e.g. SHA256 hex) identifying the stored policy bundle
          schema: { type: string }
      responses:
        '200':
          description: Policy bundle
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                sample:
                  value:
                    hash: "fedbe39fbf53f5fd9868554fc342e6d36167d2f1521b56cd8a5754ed82f147ee"
                    policies:
                      - id: "allow-read"
                        effect: "allow"
                        action: "read"
                        resource: "doc:123"
                      - id: "deny-write"
                        effect: "deny"
                        action: "write"
                        resource: "doc:123"
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardError' }
              examples:
                not_found:
                  value:
                    error: not_found
                    message: policy bundle not found
                    code: not_found
  /api/v1/beta/policy/audit-consistency:
    get:
      summary: Policy/audit consistency check
      operationId: getPolicyAuditConsistency
      tags: [policy]
      responses:
        '200': { description: Consistency result }
  /api/v1/beta/ping:
    get:
      summary: Liveness ping
      operationId: getPing
      tags: [health]
      responses:
        '200': { description: Pong }
  /api/v1/beta/health:
    get:
      summary: Health status
      operationId: getHealth
      tags: [health]
      responses:
        '200': { description: Health ok }
  /api/v1/beta/info:
    get:
      summary: Build & version info
      operationId: getInfo
      tags: [health]
      responses:
        '200': { description: Info object }
  /api/v1/openapi:
    get:
      summary: OpenAPI spec (JSON)
      operationId: getOpenAPIJSON
      tags: [discovery]
      responses:
        '200': { description: OpenAPI JSON }
        '304': { description: Not Modified }
  /openapi.yaml:
    get:
      summary: OpenAPI spec (YAML)
      operationId: getOpenAPIYAML
      tags: [discovery]
      responses:
        '200': { description: OpenAPI YAML }
        '304': { description: Not Modified }
  /api/v1/beta/examples/catalog:
    get:
      summary: Examples catalog
      operationId: getExamplesCatalog
      tags: [examples]
      responses:
        '200': { description: Catalog list }
  /api/v1/beta/examples/run:
    post:
      summary: Run example
      operationId: runExample
      tags: [examples]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Run accepted }
  /api/v1/beta/examples/run/jobs:
    get:
      summary: List running example jobs
      operationId: listExampleJobs
      tags: [examples]
      responses:
        '200': { description: Jobs list }
  /api/v1/beta/examples/composite/export/json:
    post:
      summary: Export composite example (JSON)
      operationId: exportExampleCompositeJSON
      tags: [examples]
      requestBody:
        required: false
      responses:
        '200': { description: Export JSON started }
  /api/v1/beta/examples/composite/export/csv:
    post:
      summary: Export composite example (CSV)
      operationId: exportExampleCompositeCSV
      tags: [examples]
      requestBody:
        required: false
      responses:
        '200': { description: Export CSV started }
  /api/v1/beta/examples/run/jobs/{id}/cancel:
    post:
      summary: Cancel example job
      operationId: cancelExampleJob
      tags: [examples]
      parameters:
        - in: path
          name: id
          required: true
