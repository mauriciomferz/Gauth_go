apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gauth-opa
  namespace: gauth-system
  labels:
    app: gauth
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: gauth
      component: web-server
  endpoints:
  # GAuth metrics
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
  # OPA metrics
  - port: opa-http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gauth-opa-alerts
  namespace: gauth-system
  labels:
    app: gauth
    prometheus: kube-prometheus
spec:
  groups:
  - name: gauth.opa.performance
    interval: 30s
    rules:
    # Alert: High OPA latency
    - alert: HighOPALatency
      expr: |
        histogram_quantile(0.95,
          rate(opa_http_request_duration_seconds_bucket[5m])
        ) > 0.1
      for: 5m
      labels:
        severity: warning
        component: opa
      annotations:
        summary: "High OPA request latency"
        description: "OPA 95th percentile latency is {{ $value }}s (threshold: 0.1s)"
        runbook: "Check OPA policy complexity, consider caching or optimization"

    # Alert: OPA errors
    - alert: HighOPAErrorRate
      expr: |
        rate(opa_http_request_duration_seconds_count{code=~"5.."}[5m]) > 0.01
      for: 2m
      labels:
        severity: critical
        component: opa
      annotations:
        summary: "High OPA error rate"
        description: "OPA error rate is {{ $value }} errors/sec"
        runbook: "Check OPA logs: kubectl logs -n gauth-system -l app=gauth -c opa"

    # Alert: OPA container restarting
    - alert: OPAContainerRestarting
      expr: |
        rate(kube_pod_container_status_restarts_total{
          namespace="gauth-system",
          container="opa"
        }[15m]) > 0
      for: 5m
      labels:
        severity: warning
        component: opa
      annotations:
        summary: "OPA container restarting"
        description: "OPA container has restarted {{ $value }} times in the last 15 minutes"
        runbook: "Check OPA logs and resource limits"

    # Alert: OPA decision cache miss rate
    - alert: HighOPACacheMissRate
      expr: |
        rate(opa_policy_evaluation_duration_seconds_count[5m]) /
        rate(opa_http_request_duration_seconds_count[5m]) > 0.8
      for: 10m
      labels:
        severity: info
        component: opa
      annotations:
        summary: "High OPA cache miss rate"
        description: "OPA cache miss rate is {{ $value | humanizePercentage }}"
        runbook: "Consider increasing cache size or TTL"

  - name: gauth.opa.availability
    interval: 30s
    rules:
    # Alert: OPA unavailable
    - alert: OPAUnavailable
      expr: |
        up{job="gauth-opa", container="opa"} == 0
      for: 2m
      labels:
        severity: critical
        component: opa
      annotations:
        summary: "OPA sidecar is down"
        description: "OPA sidecar has been unavailable for 2 minutes"
        runbook: "Check pod status: kubectl describe pod -n gauth-system -l app=gauth"

    # Alert: GAuth pods not ready
    - alert: GAuthPodsNotReady
      expr: |
        kube_deployment_status_replicas_ready{
          namespace="gauth-system",
          deployment="gauth-with-opa"
        } < kube_deployment_spec_replicas{
          namespace="gauth-system",
          deployment="gauth-with-opa"
        }
      for: 5m
      labels:
        severity: warning
        component: gauth
      annotations:
        summary: "GAuth pods not ready"
        description: "{{ $value }} GAuth pods are not ready"
        runbook: "Check pod status and logs"

  - name: gauth.opa.capacity
    interval: 30s
    rules:
    # Alert: High CPU usage
    - alert: HighOPACPUUsage
      expr: |
        rate(container_cpu_usage_seconds_total{
          namespace="gauth-system",
          pod=~"gauth-with-opa-.*",
          container="opa"
        }[5m]) > 0.8
      for: 10m
      labels:
        severity: warning
        component: opa
      annotations:
        summary: "High OPA CPU usage"
        description: "OPA container CPU usage is {{ $value | humanizePercentage }}"
        runbook: "Consider increasing CPU limits or optimizing policies"

    # Alert: High memory usage
    - alert: HighOPAMemoryUsage
      expr: |
        container_memory_usage_bytes{
          namespace="gauth-system",
          pod=~"gauth-with-opa-.*",
          container="opa"
        } / container_spec_memory_limit_bytes{
          namespace="gauth-system",
          pod=~"gauth-with-opa-.*",
          container="opa"
        } > 0.85
      for: 5m
      labels:
        severity: warning
        component: opa
      annotations:
        summary: "High OPA memory usage"
        description: "OPA container memory usage is {{ $value | humanizePercentage }}"
        runbook: "Consider increasing memory limits or investigating memory leaks"

    # Alert: Approaching max replicas
    - alert: ApproachingMaxReplicas
      expr: |
        kube_deployment_status_replicas{
          namespace="gauth-system",
          deployment="gauth-with-opa"
        } > 8
      for: 10m
      labels:
        severity: info
        component: gauth
      annotations:
        summary: "GAuth approaching max replicas"
        description: "GAuth has {{ $value }} replicas (max: 10)"
        runbook: "Consider increasing HPA max replicas or investigating high load"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gauth-opa
  namespace: gauth-system
  labels:
    grafana_dashboard: "1"
data:
  gauth-opa-dashboard.json: |
    {
      "dashboard": {
        "title": "GAuth + OPA Performance",
        "panels": [
          {
            "title": "OPA Request Rate",
            "targets": [
              {
                "expr": "rate(opa_http_request_duration_seconds_count[5m])"
              }
            ]
          },
          {
            "title": "OPA Latency (p95, p99)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(opa_http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "p95"
              },
              {
                "expr": "histogram_quantile(0.99, rate(opa_http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "p99"
              }
            ]
          },
          {
            "title": "OPA Error Rate",
            "targets": [
              {
                "expr": "rate(opa_http_request_duration_seconds_count{code=~\"5..\"}[5m])"
              }
            ]
          },
          {
            "title": "OPA CPU Usage",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"gauth-system\",container=\"opa\"}[5m])"
              }
            ]
          },
          {
            "title": "OPA Memory Usage",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{namespace=\"gauth-system\",container=\"opa\"}"
              }
            ]
          },
          {
            "title": "Active Replicas",
            "targets": [
              {
                "expr": "kube_deployment_status_replicas_ready{namespace=\"gauth-system\",deployment=\"gauth-with-opa\"}"
              }
            ]
          }
        ]
      }
    }
