name: GAuth CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true

      - name: Verify Dependencies
        run: go mod tidy && go mod verify
      
      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  load-verification:
    name: Load Test (Degraded Mode)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      
      - name: Start Background Server (Degraded Mode)
        run: |
          # Export necessary secrets for dev mode
          export GAUTH_JWT_SIGNING_KEY=ci-secret-key-123
          export GAUTH_REVOCATION_ENABLED=0
          
          # Start server in background
          go run cmd/web-server/main.go &
          
          # Wait for health check
          echo "Waiting for server startup..."
          timeout 30s bash -c 'until curl -s http://localhost:8080/healthz; do sleep 1; done'
          echo "Server is up!"

      - name: Run Soak Test (Smoke Check)
        run: |
          k6 run -e DURATION=10s -e DEGRADED_MODE=true tests/load/soak-test.js

      - name: Run Load Test (Health/MCP Check)
        run: |
           # Use localhost since GitHub Actions runs on Linux (host networking is simpler here)
           k6 run -e DURATION=10s -e BASE_URL=http://localhost:8080 tests/load/k6-load-test.js
