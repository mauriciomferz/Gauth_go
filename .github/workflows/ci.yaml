name: AgentAuth CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false

      - name: Debug File Content
        run: |
          echo "Debugging web/server_factory.go content:"
          grep -nC 5 "Policy Templates" web/server_factory.go || echo "Pattern not found"
          go clean -cache

      - name: Verify Dependencies
        run: go mod tidy && go mod verify
      
      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  load-verification:
    name: Load Test (Persistence Check)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agentauth
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentauth
        ports:
          - 5432:5432
        # Set health check to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      
      - name: Start Background Server (Full Persistence)
        run: |
          # Export necessary secrets for dev mode
          export AGENTAUTH_JWT_SIGNING_KEY=ci-secret-key-123
          export AGENTAUTH_REVOCATION_ENABLED=1
          export DB_HOST=localhost
          export DB_PORT=5432
          export DB_USER=agentauth
          export DB_PASSWORD=password
          export DB_NAME=agentauth
          export REDIS_HOST=localhost
          export REDIS_PORT=6379
          
          # Start server in background
          go run cmd/web-server/main.go > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          # Wait for health check
          echo "Waiting for server startup..."
          RETRIES=0
          until curl -s http://localhost:8080/healthz || [ $RETRIES -eq 30 ]; do
             sleep 1
             RETRIES=$((RETRIES+1))
          done
          
          if [ $RETRIES -eq 30 ]; then
             echo "❌ Server failed to start"
             cat server.log
             exit 1
          fi
          echo "Server is up!"

      - name: Run Soak Test (Smoke Check)
        if: false # TODO: Re-enable once k6 infrastructure is stable
        run: |
          # k6 run -e DURATION=10s -e DEGRADED_MODE=false tests/load/soak-test.js
          echo "Skipping Soak Test in CI for stability"

      - name: Run Load Test (Persistence Verification)
        if: false # TODO: Re-enable once k6 infrastructure is stable
        run: |
           # Use localhost since GitHub Actions runs on Linux (host networking is simpler here)
           # k6 run -e DURATION=10s -e BASE_URL=http://localhost:8080 tests/load/k6-load-test.js
           echo "Skipping Load Test in CI for stability"
