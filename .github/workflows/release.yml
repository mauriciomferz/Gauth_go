name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        run: go test ./... -v
      - name: Build
        run: |
          echo "🚀 Building release binaries..."
          if make build 2>/dev/null; then
            echo "✅ Standard build succeeded"
          elif make build-fallback 2>/dev/null; then
            echo "✅ Fallback build succeeded"
          else
            echo "⚠️ Using standalone build script..."
            ./scripts/build/ci-build.sh
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            agentauth-server
            agentauth-http-server
            agentauth-web
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentauth-binaries
          path: ./bin/
