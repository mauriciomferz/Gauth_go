name: GAuth CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read
  checks: write
  statuses: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Start Redis for testing
      uses: supercharge/redis-github-action@1.7.0
      with:
        redis-version: 7
        redis-port: 6379

    - name: Start PostgreSQL for testing
      uses: harmon758/postgresql-action@v1
      with:
        postgresql version: '15'
        postgresql db: 'gauth'
        postgresql user: 'gauth'
        postgresql password: 'gauth_test_pass'

    - name: Install dependencies
      run: go mod download

    - name: Verify Go installation
      run: |
        go version
        go env GOOS GOARCH

    - name: Run unit tests
      run: |
        set -e
        echo "🧪 Running comprehensive test suite with enhanced CI robustness..."
        go clean -testcache
        go clean -cache
        export GOMAXPROCS=2
        export GOMEMLIMIT=1GiB
        export CGO_ENABLED=1
        
        echo "Starting Go test execution..."
        echo "Go version: $(go version)"
        
        # Run tests in groups to better isolate any issues
        echo "Testing core packages..."
        go test -v -timeout=10m ./pkg/... || { echo "❌ pkg tests failed"; exit 1; }
        
        echo "Testing internal packages..."
        go test -v -timeout=10m ./internal/... || { echo "❌ internal tests failed"; exit 1; }
        
        echo "Testing web packages..."
        go test -v -timeout=10m ./web/... || { echo "❌ web tests failed"; exit 1; }
        
        echo "Testing test packages..."
        go test -v -timeout=10m ./test/... || { echo "❌ test packages failed"; exit 1; }
        
        echo "✅ All tests completed successfully"

    - name: Install golangci-lint from source
      run: |
        # Ensure clean installation - remove any cached version
        rm -f $(go env GOPATH)/bin/golangci-lint
        # Install golangci-lint from source to ensure it's built with Go 1.25
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
        # Verify the version and Go compatibility
        $(go env GOPATH)/bin/golangci-lint version
        
    - name: Run linter
      continue-on-error: true
      run: |
        GOROOT=$(go env GOROOT) GOVERSION=1.25.1 $(go env GOPATH)/bin/golangci-lint run --timeout=10m || echo "⚠️  Linter found issues (non-blocking)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      run: |
        echo "🚀 Starting CI-adaptive build process..."
        if make ci-build 2>/dev/null; then
          echo "✅ CI build succeeded with enhanced method"
        elif make build-fallback 2>/dev/null; then
          echo "✅ Fallback build method succeeded"
        elif ./scripts/ci-build.sh; then
          echo "✅ Standalone script build succeeded"
        else
          echo "❌ All build methods failed, trying diagnostics..."
          echo "📊 Environment Debug Information:"
          pwd
          ls -la . | head -10
          ls -la cmd/ 2>/dev/null || echo "No cmd directory found"
          find . -name "gauth-server" -type d 2>/dev/null | head -5 || echo "No gauth-server directories found"
          find . -name "main.go" -path "*/gauth-server/*" 2>/dev/null | head -5 || echo "No gauth-server main.go found"
          echo "🔧 Attempting manual build..."
          mkdir -p build/bin
          if [ -f "./cmd/gauth-server/main.go" ]; then
            go build -ldflags="-s -w" -o build/bin/gauth-server ./cmd/gauth-server
          elif [ -f "cmd/gauth-server/main.go" ]; then
            go build -ldflags="-s -w" -o build/bin/gauth-server cmd/gauth-server
          else
            SOURCE_PATH=$(find . -name "main.go" -path "*/gauth-server/*" 2>/dev/null | head -1 | xargs dirname)
            if [ -n "$SOURCE_PATH" ]; then
              go build -ldflags="-s -w" -o build/bin/gauth-server "$SOURCE_PATH"
            else
              echo "❌ Cannot find gauth-server source code"
              exit 1
            fi
          fi
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install dependencies
      run: go mod download

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Display security scan results
      if: always()
      run: |
        echo "Security scan completed. Checking results..."
        if [ -f "results.sarif" ]; then
          echo "SARIF file generated successfully"
          echo "File size: $(wc -c < results.sarif) bytes"
          # Show summary of findings
          if command -v jq >/dev/null 2>&1; then
            echo "Security findings summary:"
            jq -r '.runs[0].results | length' results.sarif 2>/dev/null || echo "No security issues found"
          fi
        else
          echo "Warning: SARIF file not generated"
        fi

    - name: Debug GitHub context
      if: always()
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Repository: ${{ github.repository }}"
        echo "Actor: ${{ github.actor }}"

    - name: Upload SARIF file to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('results.sarif') != ''
      with:
        sarif_file: results.sarif
        category: gosec
      continue-on-error: true

    - name: Upload SARIF for Pull Requests (Alternative)
      uses: actions/upload-artifact@v4
      if: always() && github.event_name == 'pull_request' && hashFiles('results.sarif') != ''
      with:
        name: security-scan-results-pr-${{ github.event.number }}
        path: results.sarif
        retention-days: 30

    - name: Upload security results as artifact (fallback)
      uses: actions/upload-artifact@v4
      if: always() && hashFiles('results.sarif') != ''
      with:
        name: security-scan-results
        path: results.sarif
        retention-days: 30

    - name: Security scan summary
      if: always()
      run: |
        echo "🔒 Security Scan Summary:"
        if [ -f "results.sarif" ]; then
          echo "✅ SARIF file generated successfully"
          echo "📊 File size: $(wc -c < results.sarif) bytes"
          if command -v jq >/dev/null 2>&1; then
            FINDINGS=$(jq -r '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
            echo "🔍 Security findings: $FINDINGS"
            if [ "$FINDINGS" = "0" ]; then
              echo "🎉 No security issues found!"
            else
              echo "⚠️  Found $FINDINGS security issue(s)"
            fi
          fi
        else
          echo "❌ SARIF file not found"
        fi
