name: GAuth CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read
  checks: write
  statuses: write
  packages: write  # Required for GHCR push

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Start Redis for testing
      uses: supercharge/redis-github-action@1.7.0
      with:
        redis-version: 7
        redis-port: 6379

    - name: Start PostgreSQL for testing
      uses: harmon758/postgresql-action@v1
      with:
        postgresql version: '15'
        postgresql db: 'gauth'
        postgresql user: 'gauth'
        postgresql password: 'gauth_test_pass'

    - name: Install dependencies
      run: go mod download

    - name: Verify Go installation
      run: |
        go version
        go env GOOS GOARCH

    - name: Run unit tests
      run: |
        set -e
        echo "🧪 Running comprehensive test suite with enhanced CI robustness..."
        go clean -testcache
        go clean -cache
        export GOMAXPROCS=2
        export GOMEMLIMIT=1GiB
        export CGO_ENABLED=1
        
        echo "Starting Go test execution..."
        echo "Go version: $(go version)"
        
        # Clean test cache to avoid any stale state issues
        echo "🧹 Cleaning test cache..."  
        go clean -testcache
        
        # Run tests in groups to better isolate any issues
        # Using -short flag to skip long-running load/stress tests in CI
        echo "Testing core packages..."
        go test -v -short -count=1 -timeout=10m ./pkg/... || { echo "❌ pkg tests failed"; exit 1; }
        
        echo "Testing internal packages..."
        go test -v -short -count=1 -timeout=10m ./internal/... || { echo "❌ internal tests failed"; exit 1; }
        
        echo "Testing web packages..."
        go test -v -short -count=1 -timeout=10m ./web/... || { echo "❌ web tests failed"; exit 1; }
        
        echo "Testing test packages (skipping long-running load tests)..."
        go test -v -short -count=1 -timeout=10m ./test/... || { echo "❌ test packages failed"; exit 1; }
        
        echo "✅ All tests completed successfully"

    - name: Install golangci-lint from source
      run: |
        # Ensure clean installation - remove any cached version
        rm -f $(go env GOPATH)/bin/golangci-lint
        # Install golangci-lint from source to ensure it's built with Go 1.25
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
        # Verify the version and Go compatibility
        $(go env GOPATH)/bin/golangci-lint version
        
    - name: Run linter
      continue-on-error: true
      run: |
        GOROOT=$(go env GOROOT) GOVERSION=1.25.1 $(go env GOPATH)/bin/golangci-lint run --timeout=10m || echo "⚠️  Linter found issues (non-blocking)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Ensure complete repository checkout

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Verify Repository Checkout
      run: |
        echo "� Comprehensive Repository Checkout Verification"
        echo "================================================="
        echo "📍 Working Directory: $(pwd)"
        echo "� Git Status: $(git status --porcelain | wc -l) uncommitted files"
        echo "📊 Git Branch: $(git branch --show-current 2>/dev/null || echo 'detached HEAD')"
        echo "📊 Git Commit: $(git rev-parse --short HEAD 2>/dev/null || echo 'no commit')"
        echo ""
        echo "📂 Complete Workspace Structure:"
        find . -maxdepth 3 -type d | head -20
        echo ""
        echo "📂 cmd Directory Detailed Check:"
        if [ -d "cmd" ]; then
          echo "✅ cmd directory exists"
          echo "📊 cmd contents:"
          ls -la cmd/
          echo ""
          echo "📊 gauth-server directory check:"
          if [ -d "cmd/gauth-server" ]; then
            echo "✅ gauth-server directory exists"
            echo "📄 gauth-server contents:"
            ls -la cmd/gauth-server/
            echo ""
            echo "📄 main.go check:"
            if [ -f "cmd/gauth-server/main.go" ]; then
              echo "✅ main.go exists"
              echo "� File size: $(wc -c < cmd/gauth-server/main.go) bytes"
              echo "📊 File permissions: $(ls -la cmd/gauth-server/main.go)"
              echo "🔍 First 3 lines of main.go:"
              head -3 cmd/gauth-server/main.go
            else
              echo "❌ main.go missing in cmd/gauth-server/"
            fi
          else
            echo "❌ gauth-server directory missing in cmd/"
          fi
        else
          echo "❌ cmd directory missing"
        fi

    - name: Enhanced Build with Bulletproof Source Detection
      run: |
        echo "🚀 Enhanced CI Build with Comprehensive Source Detection"
        echo "========================================================"
        
        # Use our proven ci-build.sh script if available, but with error capture
        if [ -f "scripts/ci-build.sh" ]; then
          echo "🎯 Using proven ci-build.sh script"
          chmod +x scripts/ci-build.sh
          
          # Run the script and capture both success and failure
          if ./scripts/ci-build.sh; then
            echo "✅ ci-build.sh completed successfully"
            exit 0
          else
            echo "❌ ci-build.sh failed, trying inline fallback..."
            echo ""
          fi
        else
          echo "⚠️ ci-build.sh not found, using inline implementation"
        fi
        
        # Fallback to inline implementation with enhanced detection
        echo "🔧 Using inline enhanced build implementation"
        
        # Immediate checkout verification
        echo "🔍 Immediate Checkout Verification:"
        echo "Working directory: $(pwd)"
        echo "Directory listing:"
        ls -la . | head -15
        echo ""
        echo "Looking for cmd directory:"
        if [ -d "cmd" ]; then
          echo "✅ cmd directory found"
          echo "cmd contents:"
          ls -la cmd/ | head -10
          echo ""
          echo "Looking for gauth-server in cmd:"
          if [ -d "cmd/gauth-server" ]; then
            echo "✅ cmd/gauth-server directory found"
            echo "gauth-server contents:"
            ls -la cmd/gauth-server/
            echo ""
            if [ -f "cmd/gauth-server/main.go" ]; then
              echo "✅ main.go found!"
              echo "File info: $(ls -la cmd/gauth-server/main.go)"
              echo "File size: $(wc -c < cmd/gauth-server/main.go) bytes"
            else
              echo "❌ main.go NOT found in cmd/gauth-server/"
            fi
          else
            echo "❌ cmd/gauth-server directory NOT found"
            echo "Available directories in cmd:"
            ls -la cmd/ 2>/dev/null || echo "Cannot list cmd contents"
          fi
        else
          echo "❌ cmd directory NOT found"
          echo "Available directories in root:"
          find . -maxdepth 1 -type d | head -10
        fi
        echo ""
        
        # Function to find gauth-server source (from proven script)
        find_gauth_server() {
          # Method 1: Standard relative path
          if [ -f "./cmd/gauth-server/main.go" ]; then
            echo "✅ Method 1: Found ./cmd/gauth-server/main.go" >&2
            echo "./cmd/gauth-server"
            return 0
          fi
          
          # Method 2: Without leading dot
          if [ -f "cmd/gauth-server/main.go" ]; then
            echo "✅ Method 2: Found cmd/gauth-server/main.go" >&2
            echo "cmd/gauth-server"
            return 0
          fi
          
          # Method 3: Filesystem search
          local main_go_path=$(find . -name "main.go" -path "*/cmd/gauth-server/*" 2>/dev/null | head -1)
          if [ -n "$main_go_path" ]; then
            local source_path=$(dirname "$main_go_path")
            echo "✅ Method 3: Found $main_go_path" >&2
            echo "$source_path"
            return 0
          fi
          
          # Method 4: Directory search
          local gauth_dir=$(find . -name "gauth-server" -type d -path "*/cmd/*" 2>/dev/null | head -1)
          if [ -n "$gauth_dir" ] && [ -f "$gauth_dir/main.go" ]; then
            echo "✅ Method 4: Found directory $gauth_dir with main.go" >&2
            echo "$gauth_dir"
            return 0
          fi
          
          return 1
        }
        
        # Find source path
        echo "🔍 Searching for gauth-server source..."
        SOURCE_PATH=$(find_gauth_server)
        
        if [ $? -ne 0 ] || [ -z "$SOURCE_PATH" ]; then
          echo "❌ ERROR: Could not find cmd/gauth-server/main.go"
          echo ""
          echo "🐛 Enhanced Diagnostic Information"
          echo "================================="
          echo "📍 Working Directory: $(pwd)"
          echo "� User: $(whoami)"
          echo "💻 System: $(uname -a)"
          echo ""
          echo "📁 Complete Directory Contents:"
          find . -type f -name "*.go" | grep -E "(main\.go|gauth)" | sort
          echo ""
          echo "📂 cmd Directory Analysis:"
          find . -name "cmd" -type d -exec ls -la {} \;
          echo ""
          echo "🔍 All main.go files:"
          find . -name "main.go" 2>/dev/null
          echo ""
          echo "� All gauth-server directories:"
          find . -name "*gauth-server*" -type d 2>/dev/null
          echo ""
          echo "🔍 Git Checkout Verification:"
          echo "Repository URL: $(git config --get remote.origin.url 2>/dev/null || echo 'N/A')"
          echo "Current commit: $(git log --oneline -1 2>/dev/null || echo 'N/A')"
          echo "Tracked files count: $(git ls-files | wc -l 2>/dev/null || echo 'N/A')"
          echo ""
          exit 1
        fi
        
        echo "✅ Using source path: $SOURCE_PATH"
        
        # Create output directory
        echo "📁 Creating build directory..."
        mkdir -p build/bin
        
        # Build the server
        echo "🔧 Building gauth-server from: $SOURCE_PATH"
        if go build -ldflags="-s -w" -o build/bin/gauth-server "$SOURCE_PATH"; then
          echo "✅ Build successful!"
          echo "📊 Binary info:"
          ls -la build/bin/gauth-server
          
          # Test the binary
          echo "🧪 Testing binary..."
          if ./build/bin/gauth-server --help >/dev/null 2>&1; then
            echo "✅ Binary test successful!"
          else
            echo "⚠️ Binary test failed (may be normal for some flags)"
          fi
        else
          echo "❌ Build failed!"
          echo "🔍 Additional debugging info:"
          echo "Source path exists: $([ -d "$SOURCE_PATH" ] && echo 'YES' || echo 'NO')"
          echo "main.go exists: $([ -f "$SOURCE_PATH/main.go" ] && echo 'YES' || echo 'NO')"
          echo "Go version: $(go version)"
          echo "GOPATH: $(go env GOPATH)"
          echo "GOROOT: $(go env GOROOT)"
          exit 1
        fi
        
        echo ""
        echo "🎉 Enhanced CI Build completed successfully!"

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/gauth
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-,format=short
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=blue,enable={{is_default_branch}}
          type=raw,value=green,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          GIT_COMMIT=${{ github.sha }}
          GIT_BRANCH=${{ github.ref_name }}

    - name: Image digest
      run: echo "Image pushed with tags ${{ steps.meta.outputs.tags }}"

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/gauth:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'  # Don't fail on vulnerabilities for SARIF upload

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('trivy-results.sarif') != ''
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'container-security'

    - name: Run Trivy vulnerability scanner (table output)
      uses: aquasecurity/trivy-action@master
      if: always()
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/gauth:latest
        format: 'table'
        severity: 'CRITICAL,HIGH,MEDIUM'
        exit-code: '0'  # Don't fail the build, just report vulnerabilities
        ignore-unfixed: true  # Ignore vulnerabilities without fixes

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install dependencies
      run: go mod download

    - name: Run Gosec Security Scanner
      continue-on-error: true
      run: |
        set +e  # Disable exit on error for this step
        go mod verify  # Ensure dependencies are resolved
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        # Use .gosec.json config and exclude problematic directories
        $(go env GOPATH)/bin/gosec -no-fail -fmt sarif -out results.sarif \
          -exclude-dir=examples -exclude-dir=test -exclude-dir=tests -exclude-dir=cmd/examples \
          ./... 2>&1 || true
        EXIT_CODE=$?
        echo "Gosec scan completed with exit code: $EXIT_CODE"
        exit 0  # Always succeed

    - name: Display security scan results
      if: always()
      run: |
        echo "Security scan completed. Checking results..."
        if [ -f "results.sarif" ]; then
          echo "SARIF file generated successfully"
          echo "File size: $(wc -c < results.sarif) bytes"
          # Show summary of findings
          if command -v jq >/dev/null 2>&1; then
            echo "Security findings summary:"
            jq -r '.runs[0].results | length' results.sarif 2>/dev/null || echo "No security issues found"
          fi
        else
          echo "Warning: SARIF file not generated"
        fi

    - name: Debug GitHub context
      if: always()
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Repository: ${{ github.repository }}"
        echo "Actor: ${{ github.actor }}"

    - name: Upload SARIF file to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('results.sarif') != ''
      with:
        sarif_file: results.sarif
        category: gosec
      continue-on-error: true

    - name: Upload SARIF for Pull Requests (Alternative)
      uses: actions/upload-artifact@v4
      if: always() && github.event_name == 'pull_request' && hashFiles('results.sarif') != ''
      with:
        name: security-scan-results-pr-${{ github.event.number }}
        path: results.sarif
        retention-days: 30

    - name: Upload security results as artifact (fallback)
      uses: actions/upload-artifact@v4
      if: always() && hashFiles('results.sarif') != ''
      with:
        name: security-scan-results
        path: results.sarif
        retention-days: 30

    - name: Security scan summary
      if: always()
      run: |
        echo "🔒 Security Scan Summary:"
        if [ -f "results.sarif" ]; then
          echo "✅ SARIF file generated successfully"
          echo "📊 File size: $(wc -c < results.sarif) bytes"
          if command -v jq >/dev/null 2>&1; then
            FINDINGS=$(jq -r '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
            echo "🔍 Security findings: $FINDINGS"
            if [ "$FINDINGS" = "0" ]; then
              echo "🎉 No security issues found!"
            else
              echo "⚠️  Found $FINDINGS security issue(s)"
            fi
          fi
        else
          echo "❌ SARIF file not found"
        fi
