name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  GO_VERSION: '1.22'  # Stable version without covdata issues

jobs:
  # Backend tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gauth_admin
          POSTGRES_PASSWORD: gauth_dev_password
          POSTGRES_DB: gauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Cache Go modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-v2
          restore-keys: |
            ${{ runner.os }}-go-v2-
      
      - name: Wait for services
        run: |
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'
          echo "Waiting for PostgreSQL..."
          timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          echo "Services are ready"
      
      - name: Run backend tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: gauth_admin
          DB_PASSWORD: gauth_dev_password
          DB_NAME: gauth
          DB_SSLMODE: disable
        run: |
          # Skip flaky tests, integration tests, and packages without tests
          # Focus on pkg/ and internal/ which contain the actual testable code
          # Disable coverage mode to avoid covdata issues
          # Skip loadtest and crypto integration tests that require services/have timeouts
          
          # Build the package list
          # Exclude: loadtest (hangs), crypto (timeouts)
          PACKAGES=$(go list ./pkg/... ./internal/... | grep -v '/pkg/loadtest$' | grep -v '/internal/crypto$' || true)
          
          set -e  # Exit immediately if any command fails (after safe commands)
          PKG_COUNT=$(echo "$PACKAGES" | wc -l)
          echo "Testing $PKG_COUNT packages"
          
          # Run tests on each package separately to avoid argument length issues
          # Use for loop to properly propagate exit codes
          # Remove -v flag to prevent output buffering issues
          FAILED_COUNT=0
          PASSED=0
          SKIPPED=0
          for pkg in $PACKAGES; do
            echo "::group::Testing $pkg"
            # Check if package has test files
            if ! go list -f '{{if .TestGoFiles}}1{{end}}{{if .XTestGoFiles}}1{{end}}' "$pkg" | grep -q 1; then
              echo "No test files in $pkg - skipping"
              SKIPPED=$((SKIPPED + 1))
              echo "::endgroup::"
              continue
            fi
            
            if go test -short "$pkg" -p 1 -skip "TestPAP_ConcurrentAccess|TestPAP_GetPolicyStatistics|TestSSETransportConnect" -timeout 10m -vet=off; then
              PASSED=$((PASSED + 1))
              echo "::endgroup::"
            else
              echo "::error::FAILED: $pkg"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              echo "::endgroup::"
              break
            fi
          done
          
          echo "::notice::Test summary - Passed: $PASSED, Skipped: $SKIPPED, Failed: $FAILED_COUNT"
          
          if [ $FAILED_COUNT -gt 0 ]; then
            echo "::error::Tests failed - exiting with error"
            exit 1
          fi
          
          echo "::notice::All tests passed successfully"
      
      - name: Generate coverage report
        if: success()
        continue-on-error: true
        run: |
          # Generate coverage by testing each package separately to avoid conflicts
          # When using -coverprofile with multiple packages, only one file can be written
          PACKAGES=$(go list ./pkg/... ./internal/... | grep -v '/pkg/loadtest$' | grep -v '/internal/crypto$' || true)
          
          # Test packages individually and merge coverage
          echo "mode: set" > coverage.out
          for pkg in $PACKAGES; do
            go test "$pkg" -coverprofile=pkg.cover -covermode=set -skip "TestPAP_ConcurrentAccess|TestPAP_GetPolicyStatistics|TestSSETransportConnect" -vet=off 2>/dev/null || true
            if [ -f pkg.cover ]; then
              tail -n +2 pkg.cover >> coverage.out
              rm pkg.cover
            fi
          done
          
          if [ -f coverage.out ] && [ $(wc -l < coverage.out) -gt 1 ]; then
            go tool cover -html=coverage.out -o coverage.html
          fi
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.html
          retention-days: 30

  # E2E Tests with Playwright
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-e2e-${{ hashFiles('web/ui-react/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-e2e-
            ${{ runner.os }}-node-
        continue-on-error: true
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Install dependencies
        working-directory: web/ui-react
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: web/ui-react
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Start backend server
        run: |
          go run ./cmd/web-server &
          echo $! > backend.pid
          # Wait for backend to be ready (increased timeout for CI)
          timeout 120 bash -c 'until curl -f http://localhost:8080/api/v1/beta/health 2>/dev/null; do sleep 3; done' || echo "Backend health check timeout"
      
      - name: Run E2E tests
        working-directory: web/ui-react
        run: npx playwright test --project=${{ matrix.browser }}
        continue-on-error: true
        env:
          CI: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            web/ui-react/playwright-report/
            web/ui-react/test-results/
          retention-days: 30
      
      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ matrix.browser }}
          path: web/ui-react/test-results/**/*.webm
          retention-days: 7
      
      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

  # API Integration Tests
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-api-${{ hashFiles('web/ui-react/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-api-
            ${{ runner.os }}-node-
        continue-on-error: true
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Install dependencies
        working-directory: web/ui-react
        run: npm ci
      
      - name: Install Playwright
        working-directory: web/ui-react
        run: npx playwright install --with-deps
      
      - name: Start backend server
        run: |
          go run ./cmd/web-server &
          echo $! > backend.pid
          timeout 120 bash -c 'until curl -f http://localhost:8080/api/v1/beta/health 2>/dev/null; do sleep 3; done' || echo "Backend health check timeout"
      
      - name: Run API tests
        working-directory: web/ui-react
        run: npx playwright test --project=api e2e/api.api.spec.ts
        continue-on-error: true
        env:
          CI: true
      
      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            web/ui-react/playwright-report/
            web/ui-react/test-results/
          retention-days: 30
      
      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

  # Performance Tests with k6
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Start backend server
        run: |
          go run ./cmd/web-server &
          echo $! > backend.pid
          timeout 120 bash -c 'until curl -f http://localhost:8080/api/v1/beta/health 2>/dev/null; do sleep 3; done' || echo "Backend health check timeout"
      
      - name: Create results directory
        run: mkdir -p performance-tests/results
      
      - name: Run health check test
        run: |
          k6 run --out json=performance-tests/results/health-check.json performance-tests/health-check.js || echo "Health check test failed (non-blocking)"
        env:
          API_URL: http://localhost:8080
      
      - name: Run token creation test
        run: |
          k6 run --out json=performance-tests/results/token-creation.json performance-tests/token-creation.js || echo "Token creation test failed (non-blocking)"
        env:
          API_URL: http://localhost:8080
      
      - name: Run metrics endpoint test
        run: |
          k6 run --out json=performance-tests/results/metrics-endpoint.json performance-tests/metrics-endpoint.js || echo "Metrics endpoint test failed (non-blocking)"
        env:
          API_URL: http://localhost:8080
      
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: performance-tests/results/
          retention-days: 30
      
      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi
      
      - name: Report performance test status
        if: always()
        run: |
          echo "::notice::Performance tests completed (informational only, failures do not block CI)"
          echo "Check uploaded artifacts for detailed performance metrics"

  # Test Results Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests, api-tests, performance-tests]
    if: always()  # Run even if performance tests fail
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results
      
      - name: Generate summary
        run: |
          echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Tests: ${{ needs.api-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d test-results ]; then
            echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
            find test-results -type f | head -20 | while read file; do
              echo "- \`${file}\`" >> $GITHUB_STEP_SUMMARY
            done
          fi
      
      - name: Check if critical tests passed
        if: needs.backend-tests.result != 'success'
        run: |
          echo "::error::Backend tests failed"
          exit 1
      
      - name: Report non-critical test failures
        if: needs.e2e-tests.result != 'success' || needs.api-tests.result != 'success' || needs.performance-tests.result != 'success'
        run: |
          echo "::warning::Some non-critical tests failed (E2E, API, or Performance)"
          echo "These failures do not block the CI pipeline"
