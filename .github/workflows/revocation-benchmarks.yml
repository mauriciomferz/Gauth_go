name: Revocation System Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - 'pkg/revocation/**'
      - '.github/workflows/revocation-benchmarks.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pkg/revocation/**'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for comparison

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false

    - name: Start Redis for benchmarks
      uses: supercharge/redis-github-action@1.7.0
      with:
        redis-version: 7
        redis-port: 6379

    - name: Install dependencies
      run: go mod download

    - name: Run benchmarks
      run: |
        echo "⚡ Running revocation system benchmarks..."
        set -o pipefail
        go test -bench=. -benchmem -benchtime=5s -timeout=15m \
          ./pkg/revocation/... 2>&1 | tee benchmark-results.txt
        
        # Check if any benchmarks actually ran
        if grep -q "^Benchmark" benchmark-results.txt; then
          echo "✅ Benchmarks complete - results found"
          echo "BENCHMARKS_FOUND=true" >> $GITHUB_ENV
        else
          echo "⚠️ No benchmark results found in output"
          echo "BENCHMARKS_FOUND=false" >> $GITHUB_ENV
          echo "Raw output:"
          cat benchmark-results.txt
        fi

    - name: Store benchmark results
      if: env.BENCHMARKS_FOUND == 'true'
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'go'
        output-file-path: benchmark-results.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # Alert if performance degrades
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: false
        alert-comment-cc-users: '@mauriciomferz'

    - name: Store benchmark results (fallback)
      if: env.BENCHMARKS_FOUND == 'false'
      run: |
        echo "📊 No benchmark results to store"
        echo "This may be normal if:"
        echo "- No benchmark functions exist yet in pkg/revocation"
        echo "- Tests failed before benchmarks could run"
        echo "- Redis connection issues prevented benchmark execution"
        echo ""
        echo "To add benchmarks, create functions starting with 'func Benchmark' in *_test.go files"

    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results.txt
        retention-days: 30

  compare:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false

    - name: Start Redis
      uses: supercharge/redis-github-action@1.7.0
      with:
        redis-version: 7
        redis-port: 6379

    - name: Install dependencies
      run: go mod download

    - name: Run current benchmarks
      run: |
        echo "Running benchmarks on current branch..."
        go test -bench=. -benchmem -benchtime=5s \
          ./pkg/revocation/... > current-bench.txt
        cat current-bench.txt

    - name: Checkout base branch
      run: |
        git fetch origin ${{ github.base_ref }}
        git checkout origin/${{ github.base_ref }}

    - name: Run base benchmarks
      run: |
        echo "Running benchmarks on base branch..."
        go test -bench=. -benchmem -benchtime=5s \
          ./pkg/revocation/... > base-bench.txt 2>&1 || echo "Base benchmarks failed (may not exist yet)"
        if [ -f base-bench.txt ]; then
          cat base-bench.txt
        fi

    - name: Install benchstat
      run: go install golang.org/x/perf/cmd/benchstat@latest

    - name: Compare benchmarks
      run: |
        echo "📊 Benchmark Comparison"
        echo "======================"
        if [ -f base-bench.txt ]; then
          benchstat base-bench.txt current-bench.txt | tee comparison.txt || echo "Comparison failed"
        else
          echo "⚠️ No base benchmarks found for comparison"
          echo "Current benchmark results:"
          cat current-bench.txt
        fi

    - name: Comment PR with results
      uses: actions/github-script@v7
      if: always()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          let body = '## 🚀 Revocation System Benchmark Results\n\n';
          
          try {
            const comparison = fs.readFileSync('comparison.txt', 'utf8');
            body += '### Performance Comparison\n```\n' + comparison + '\n```\n\n';
            body += '**Baseline**: 67,000 ops/sec, P99 <30ms\n';
            body += '**Note**: Regressions >50% require investigation\n';
          } catch (e) {
            try {
              const current = fs.readFileSync('current-bench.txt', 'utf8');
              body += '### Current Benchmark Results\n```\n' + current + '\n```\n\n';
              body += '⚠️ No baseline found for comparison\n';
            } catch (e2) {
              body += '❌ Failed to read benchmark results\n';
            }
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  validate-performance:
    name: Validate Performance Targets
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false

    - name: Start Redis
      uses: supercharge/redis-github-action@1.7.0
      with:
        redis-version: 7
        redis-port: 6379

    - name: Install dependencies
      run: go mod download

    - name: Run benchmarks
      run: |
        echo "Running performance validation..."
        go test -bench=. -benchmem -benchtime=10s \
          ./pkg/revocation/... | tee perf-validation.txt

    - name: Validate performance targets
      run: |
        echo "📊 Validating Performance Targets"
        echo "================================="
        echo ""
        echo "Target Metrics:"
        echo "- Throughput: ≥50,000 ops/sec (target: 67,000)"
        echo "- P99 Latency: <50ms (target: <30ms)"
        echo "- Memory: <100MB per 10k operations"
        echo ""
        
        # Extract ops/sec from benchmark results
        OPS_SEC=$(grep -E "Benchmark.*ops" perf-validation.txt | \
          awk '{print $3}' | \
          sed 's/ns\/op//' | \
          head -1)
        
        if [ -n "$OPS_SEC" ]; then
          echo "✅ Benchmark executed successfully"
          echo "Results captured for manual validation"
        else
          echo "⚠️ Unable to extract performance metrics"
        fi
        
        echo ""
        echo "See full results in perf-validation.txt artifact"

    - name: Upload performance validation
      uses: actions/upload-artifact@v4
      with:
        name: performance-validation
        path: perf-validation.txt
        retention-days: 90
