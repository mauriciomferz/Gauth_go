apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentauth-blue
  namespace: agentauth-staging
  labels:
    app: agentauth
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentauth
      version: blue
  template:
    metadata:
      labels:
        app: agentauth
        version: blue
    spec:
      containers:
      - name: agentauth
        image: agentauth-mock:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 6060
          name: pprof
        env:
        - name: AGENTAUTH_WEB_PORT
          value: "8080"
        - name: AGENTAUTH_ENV
          value: "staging"
        - name: AGENTAUTH_LOG_LEVEL
          value: "info"
        - name: VERSION
          value: "blue"
        - name: AGENTAUTH_ENABLE_PPROF
          value: "1"
        - name: AGENTAUTH_PPROF_PORT
          value: "6060"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agentauth-service
  namespace: agentauth-staging
spec:
  selector:
    app: agentauth
    version: blue
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
