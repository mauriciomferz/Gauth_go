global:
  resolve_timeout: 5m
  slack_api_url: 'YOUR_SLACK_WEBHOOK_URL'

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  group_by: ['alertname', 'cluster', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Critical alerts go to PagerDuty and Slack
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    
    # Warning alerts go to Slack only
    - match:
        severity: warning
      receiver: 'warning'
    
    # Info alerts go to email
    - match:
        severity: info
      receiver: 'info'

# Alert receivers
receivers:
  # Default receiver (catches all)
  - name: 'default'
    slack_configs:
      - channel: '#gauth-alerts'
        title: 'AgentAuth Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  # Critical alerts
  - name: 'critical'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    slack_configs:
      - channel: '#gauth-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'

  # Warning alerts
  - name: 'warning'
    slack_configs:
      - channel: '#gauth-warnings'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'

  # Info alerts
  - name: 'info'
    email_configs:
      - to: 'ops-team@example.com'
        from: 'alertmanager@gauth.example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager@gauth.example.com'
        auth_password: 'YOUR_EMAIL_PASSWORD'
        headers:
          Subject: 'AgentAuth Info Alert: {{ .GroupLabels.alertname }}'

# Inhibition rules (suppress alerts when others are firing)
inhibit_rules:
  # Suppress non-critical alerts when service is down
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['instance']

  # Suppress high latency alerts when error rate is high
  - source_match:
      alertname: 'HighErrorRate'
    target_match:
      alertname: 'HighLatency'
    equal: ['instance']

  # Suppress cache alerts when service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      component: 'cache'
    equal: ['instance']
