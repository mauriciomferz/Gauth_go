groups:
  - name: agentauth_alerts
    interval: 30s
    rules:
      # High Error Rate Alert
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          
      # High P95 Latency Alert
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is {{ $value }}s (threshold: 200ms)"
          
      # Low Cache Hit Rate Alert
      - alert: LowCacheHitRate
        expr: (rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.7
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 70%)"
          
      # Service Down Alert
      - alert: ServiceDown
        expr: up{job="agentauth"} == 0
        for: 1m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "AgentAuth service is down"
          description: "AgentAuth service has been down for more than 1 minute"
          
      # High Memory Usage Alert
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 1024
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}MB (threshold: 1GB)"
          
      # Database Connection Issues
      - alert: DatabaseConnectionIssues
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Cannot connect to database"
          description: "Database has been unreachable for more than 2 minutes"
          
      # High Goroutine Count
      - alert: HighGoroutineCount
        expr: go_goroutines > 1000
        for: 10m
        labels:
          severity: warning
          component: runtime
        annotations:
          summary: "High goroutine count"
          description: "Goroutine count is {{ $value }} (threshold: 1000)"
          
      # Failed Health Checks
      - alert: FailedHealthCheck
        expr: health_check_status{status="unhealthy"} == 1
        for: 5m
        labels:
          severity: critical
          component: health
        annotations:
          summary: "Health check failed for {{ $labels.component }}"
          description: "Component {{ $labels.component }} has been unhealthy for 5 minutes"
          
      # High Authorization Failure Rate
      - alert: HighAuthorizationFailureRate
        expr: rate(authorization_decisions_total{result="denied"}[5m]) / rate(authorization_decisions_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
          component: authorization
        annotations:
          summary: "High authorization failure rate"
          description: "Authorization denial rate is {{ $value | humanizePercentage }} (threshold: 20%)"
          
      # Audit Log Export Failures
      - alert: AuditExportFailures
        expr: rate(audit_export_jobs_total{status="failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: audit
        annotations:
          summary: "High audit export failure rate"
          description: "Audit export failure rate is {{ $value }} per second"
          
      # Webhook Delivery Failures
      - alert: WebhookDeliveryFailures
        expr: rate(webhook_deliveries_total{status="failed"}[5m]) / rate(webhook_deliveries_total[5m]) > 0.15
        for: 10m
        labels:
          severity: warning
          component: webhooks
        annotations:
          summary: "High webhook delivery failure rate"
          description: "Webhook failure rate is {{ $value | humanizePercentage }} (threshold: 15%)"
          
      # Rate Limit Exhaustion
      - alert: RateLimitExhaustion
        expr: rate(rate_limit_exceeded_total[5m]) > 10
        for: 5m
        labels:
          severity: info
          component: rate_limiting
        annotations:
          summary: "High rate of rate limit violations"
          description: "Rate limit exceeded {{ $value }} times per second"
          
      # Disk Space Low
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Available disk space is {{ $value | humanizePercentage }} (threshold: 10%)"
          
      # CPU Usage High
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"
          
      # Database Connection Pool Exhaustion
      - alert: DatabasePoolExhaustion
        expr: pgpool_max_connections_reached == 1
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool exhausted"
          description: "All database connections are in use"
