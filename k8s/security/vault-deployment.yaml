# HashiCorp Vault Deployment for AgentAuth
# High-availability Vault cluster with Consul backend and CloudHSM auto-unseal

---
# Consul StatefulSet (Vault backend)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  namespace: vault
  labels:
    app: consul
spec:
  serviceName: consul
  replicas: 3
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - consul
            topologyKey: kubernetes.io/hostname
      
      containers:
      - name: consul
        image: hashicorp/consul:1.17
        args:
        - "agent"
        - "-server"
        - "-bootstrap-expect=3"
        - "-ui"
        - "-data-dir=/consul/data"
        - "-bind=0.0.0.0"
        - "-client=0.0.0.0"
        - "-retry-join=consul-0.consul.vault.svc.cluster.local"
        - "-retry-join=consul-1.consul.vault.svc.cluster.local"
        - "-retry-join=consul-2.consul.vault.svc.cluster.local"
        - "-encrypt=$(CONSUL_GOSSIP_KEY)"
        - "-domain=cluster.local"
        
        env:
        - name: CONSUL_GOSSIP_KEY
          valueFrom:
            secretKeyRef:
              name: consul-gossip-key
              key: key
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        
        ports:
        - containerPort: 8500
          name: http
        - containerPort: 8600
          name: dns
        - containerPort: 8301
          name: serflan
        - containerPort: 8302
          name: serfwan
        - containerPort: 8300
          name: server
        
        volumeMounts:
        - name: data
          mountPath: /consul/data
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        
        livenessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 10
          periodSeconds: 5
  
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi

---
# Consul Service
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: vault
  labels:
    app: consul
spec:
  clusterIP: None
  ports:
  - name: http
    port: 8500
  - name: dns
    port: 8600
  - name: serflan-tcp
    protocol: TCP
    port: 8301
  - name: serflan-udp
    protocol: UDP
    port: 8301
  - name: serfwan-tcp
    protocol: TCP
    port: 8302
  - name: serfwan-udp
    protocol: UDP
    port: 8302
  - name: server
    port: 8300
  selector:
    app: consul

---
# Vault ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    ui = true
    
    listener "tcp" {
      address       = "[::]:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
      tls_min_version = "tls13"
      
      # Enable Prometheus metrics
      telemetry {
        unauthenticated_metrics_access = true
      }
    }
    
    storage "consul" {
      address = "consul.vault.svc.cluster.local:8500"
      path    = "vault/"
      token   = "CONSUL_TOKEN_PLACEHOLDER"
      
      tls_ca_file   = "/vault/consul-tls/ca.crt"
      tls_cert_file = "/vault/consul-tls/tls.crt"
      tls_key_file  = "/vault/consul-tls/tls.key"
    }
    
    # Auto-unseal with AWS KMS (backed by CloudHSM)
    seal "awskms" {
      region     = "us-east-1"
      kms_key_id = "arn:aws:kms:us-east-1:123456789:key/vault-unseal-key"
    }
    
    api_addr = "https://vault.vault.svc.cluster.local:8200"
    cluster_addr = "https://vault-active.vault.svc.cluster.local:8201"
    
    # Enable Prometheus telemetry
    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname          = true
    }
    
    # Log level
    log_level = "info"
    log_format = "json"
    
    # Performance tuning
    max_lease_ttl = "768h"  # 32 days
    default_lease_ttl = "168h"  # 7 days

---
# Vault StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  serviceName: vault
  replicas: 3
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics"
    spec:
      serviceAccountName: vault
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - vault
            topologyKey: kubernetes.io/hostname
      
      containers:
      - name: vault
        image: hashicorp/vault:1.15
        command: ["vault", "server", "-config=/vault/config/vault.hcl"]
        
        env:
        - name: VAULT_ADDR
          value: "https://127.0.0.1:8200"
        - name: VAULT_API_ADDR
          value: "https://vault.vault.svc.cluster.local:8200"
        - name: VAULT_CLUSTER_ADDR
          value: "https://$(POD_NAME).vault.vault.svc.cluster.local:8201"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_SKIP_VERIFY
          value: "false"
        - name: VAULT_CACERT
          value: "/vault/tls/ca.crt"
        
        ports:
        - containerPort: 8200
          name: https
        - containerPort: 8201
          name: cluster
        - containerPort: 8202
          name: replication
        
        volumeMounts:
        - name: config
          mountPath: /vault/config
          readOnly: true
        - name: tls
          mountPath: /vault/tls
          readOnly: true
        - name: consul-tls
          mountPath: /vault/consul-tls
          readOnly: true
        - name: data
          mountPath: /vault/data
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      
      volumes:
      - name: config
        configMap:
          name: vault-config
      - name: tls
        secret:
          secretName: vault-server-tls
      - name: consul-tls
        secret:
          secretName: vault-consul-client-tls
  
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi

---
# Vault Service (headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: https
    port: 8200
  - name: cluster
    port: 8201
  - name: replication
    port: 8202
  selector:
    app: vault

---
# Vault Active Service (for clients)
apiVersion: v1
kind: Service
metadata:
  name: vault-active
  namespace: vault
  labels:
    app: vault
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  ports:
  - name: https
    port: 8200
    targetPort: 8200
  - name: cluster
    port: 8201
    targetPort: 8201
  selector:
    app: vault
    vault-active: "true"

---
# Vault ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault

---
# Vault ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault
subjects:
- kind: ServiceAccount
  name: vault
  namespace: vault

---
# Vault Agent Injector (for sidecar injection)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent-injector
  namespace: vault
  labels:
    app: vault-agent-injector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vault-agent-injector
  template:
    metadata:
      labels:
        app: vault-agent-injector
    spec:
      serviceAccountName: vault-agent-injector
      
      containers:
      - name: sidecar-injector
        image: hashicorp/vault-k8s:1.3.1
        args:
        - agent-inject
        - 2>&1
        
        env:
        - name: AGENT_INJECT_LISTEN
          value: ":8080"
        - name: AGENT_INJECT_LOG_LEVEL
          value: "info"
        - name: AGENT_INJECT_VAULT_ADDR
          value: "https://vault.vault.svc.cluster.local:8200"
        - name: AGENT_INJECT_VAULT_AUTH_PATH
          value: "auth/kubernetes"
        - name: AGENT_INJECT_VAULT_IMAGE
          value: "hashicorp/vault:1.15"
        - name: AGENT_INJECT_TLS_AUTO
          value: "vault-agent-injector-cfg"
        - name: AGENT_INJECT_TLS_AUTO_HOSTS
          value: "vault-agent-injector,vault-agent-injector.vault,vault-agent-injector.vault.svc"
        
        livenessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 2
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 2
        
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

---
# Vault Agent Injector ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-agent-injector
  namespace: vault

---
# Vault Agent Injector ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-agent-injector
rules:
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-agent-injector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-agent-injector
subjects:
- kind: ServiceAccount
  name: vault-agent-injector
  namespace: vault

---
# Vault Agent Injector Service
apiVersion: v1
kind: Service
metadata:
  name: vault-agent-injector
  namespace: vault
spec:
  ports:
  - name: https
    port: 443
    targetPort: 8080
  selector:
    app: vault-agent-injector

---
# MutatingWebhookConfiguration for Vault Agent Injector
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: vault-agent-injector-cfg
webhooks:
- name: vault.hashicorp.com
  clientConfig:
    service:
      name: vault-agent-injector
      namespace: vault
      path: "/mutate"
    caBundle: ""  # Auto-populated by injector
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  failurePolicy: Ignore
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  timeoutSeconds: 30

---
# PodDisruptionBudget for Vault
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vault-pdb
  namespace: vault
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vault

---
# Secret for Consul Gossip Encryption (generate with: consul keygen)
apiVersion: v1
kind: Secret
metadata:
  name: consul-gossip-key
  namespace: vault
type: Opaque
data:
  key: cGxhY2Vob2xkZXItZ29zc2lwLWtleS1jaGFuZ2UtbWU=  # Base64 encoded, CHANGE THIS

---
# Example: AgentAuth App with Vault Agent Sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentauth-api-with-vault
  namespace: agentauth
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentauth-api
  template:
    metadata:
      labels:
        app: agentauth-api
      annotations:
        # Vault Agent Injector annotations
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "agentauth-app"
        vault.hashicorp.com/agent-inject-secret-db-creds: "database/creds/agentauth-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "database/creds/agentauth-app" -}}
          {
            "username": "{{ .Data.username }}",
            "password": "{{ .Data.password }}",
            "lease_id": "{{ .LeaseID }}",
            "lease_duration": {{ .LeaseDuration }}
          }
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/agentauth/config"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/agentauth/config" -}}
          {
            "jwt_signing_key": "{{ .Data.data.jwt_signing_key }}",
            "webhook_secret": "{{ .Data.data.webhook_secret }}",
            "api_encryption_key": "{{ .Data.data.api_encryption_key }}"
          }
          {{- end }}
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-revoke-on-shutdown: "true"
    spec:
      serviceAccountName: agentauth-api
      
      containers:
      - name: agentauth-api
        image: agentauth/api:latest
        
        env:
        - name: DB_CREDS_FILE
          value: /vault/secrets/db-creds
        - name: CONFIG_FILE
          value: /vault/secrets/config
        
        ports:
        - containerPort: 8080
          name: http
        
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      
      volumes:
      - name: vault-secrets
        emptyDir:
          medium: Memory

---
# AgentAuth ServiceAccount for Vault access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentauth-api
  namespace: agentauth
