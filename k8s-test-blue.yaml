apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauth-blue
  namespace: gauth-staging
  labels:
    app: gauth
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gauth
      version: blue
  template:
    metadata:
      labels:
        app: gauth
        version: blue
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: gauth
              topologyKey: kubernetes.io/hostname
      containers:
      - name: gauth
        image: gauth-local-arm64:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 6060
          name: pprof
        env:
        - name: GAUTH_WEB_PORT
          value: "8080"
        - name: GAUTH_ENV
          value: "staging"
        - name: GAUTH_LOG_LEVEL
          value: "info"
        - name: VERSION
          value: "blue"
        - name: GAUTH_ENABLE_PPROF
          value: "1"
        - name: GAUTH_PPROF_PORT
          value: "6060"
        - name: GAUTH_PPROF_PORT
          value: "6060"
        - name: GAUTH_REVOCATION_ENABLED
          value: "1"
        - name: GAUTH_JWT_SIGNING_KEY
          value: "staging-secret-key-change-in-prod"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATABASE_URL
        - name: REDIS_URL
          value: redis://:gauth_redis_password_changeme@redis-service.gauth-data.svc.cluster.local:6379/0
        - name: DB_MAX_CONNECTIONS
          value: "10"
        - name: DB_MAX_IDLE_CONNECTIONS
          value: "5"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gauth-service
  namespace: gauth-staging
spec:
  selector:
    app: gauth
    version: blue
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
