apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauth-blue
  namespace: gauth-staging
  labels:
    app: gauth
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gauth
      version: blue
  template:
    metadata:
      labels:
        app: gauth
        version: blue
    spec:
      containers:
      - name: gauth
        image: ghcr.io/mauriciomferz/gauth:blue
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 6060
          name: pprof
        env:
        - name: GAUTH_WEB_PORT
          value: "8080"
        - name: GAUTH_ENV
          value: "staging"
        - name: GAUTH_LOG_LEVEL
          value: "info"
        - name: VERSION
          value: "blue"
        - name: GAUTH_ENABLE_PPROF
          value: "1"
        - name: GAUTH_PPROF_PORT
          value: "6060"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gauth-service
  namespace: gauth-staging
spec:
  selector:
    app: gauth
    version: blue
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
