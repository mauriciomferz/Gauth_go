apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauth-blue
  namespace: gauth-staging
  labels:
    app: gauth
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gauth
      version: blue
  template:
    metadata:
      labels:
        app: gauth
        version: blue
    spec:
      containers:
      - name: gauth
        image: gauth-mock:blue
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VERSION
          value: "blue"
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gauth-service
  namespace: gauth-staging
spec:
  selector:
    app: gauth
    version: blue
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
