###############################################
# AgentAuth Production Docker Compose
# Full-stack deployment with backend + frontend
###############################################

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: runtime
    container_name: agentauth-backend-prod
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - AGENTAUTH_ENV=production
      - AGENTAUTH_PORT=8080
      - AGENTAUTH_HOST=0.0.0.0
      - AGENTAUTH_CORS_ALLOW=${AGENTAUTH_CORS_ALLOW:-https://agentauth.example.com}
      - AGENTAUTH_LOG_LEVEL=${AGENTAUTH_LOG_LEVEL:-warn}
      - AGENTAUTH_LOG_FORMAT=json
      - AGENTAUTH_METRICS_ENABLED=true
      - AGENTAUTH_ENABLE_PROMETHEUS=true
      - AGENTAUTH_JWT_SIGNING_KEY=${AGENTAUTH_JWT_SIGNING_KEY}
      - AGENTAUTH_AAP-001_ENABLED=1
      - AGENTAUTH_REVOCATION_ENABLED=1
      - AGENTAUTH_ANCHOR_PERSIST_PATH=/app/data/anchor.json
      - AGENTAUTH_EDDSA_PERSIST_PATH=/app/data/keys.json
      - AGENTAUTH_ISSUER=http://localhost:8090
      - AGENTAUTH_DB_HOST=${AGENTAUTH_DB_HOST:-postgres}
      - AGENTAUTH_DB_PORT=5432
      - AGENTAUTH_DB_USER=${AGENTAUTH_DB_USER}
      - AGENTAUTH_DB_PASSWORD=${AGENTAUTH_DB_PASSWORD}
      - AGENTAUTH_DB_NAME=${AGENTAUTH_DB_NAME:-agentauth_production}
      - AGENTAUTH_DB_SSL_MODE=disable
      - DB_HOST=${AGENTAUTH_DB_HOST:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - agentauth-data:/app/data
      - agentauth-logs:/app/logs
    networks:
      - agentauth-network
    healthcheck:
      test: [ "CMD", "/app/web-server", "-healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Service (Nginx serving static build)
  frontend:
    build:
      context: ./frontend/ui-react
      dockerfile: Dockerfile.production
    container_name: agentauth-frontend-prod
    restart: unless-stopped
    ports:
      - "3002:8080"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
      - VITE_ENV=production
    networks:
      - agentauth-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - backend

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agentauth-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${AGENTAUTH_DB_USER}
      - POSTGRES_PASSWORD=${AGENTAUTH_DB_PASSWORD}
      - POSTGRES_DB=${AGENTAUTH_DB_NAME:-agentauth_production}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - agentauth-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AGENTAUTH_DB_USER} -d ${AGENTAUTH_DB_NAME:-agentauth_production}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agentauth-redis-prod
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - agentauth-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: agentauth-prometheus-prod
    restart: unless-stopped
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - agentauth-network
    depends_on:
      - backend

  # Grafana Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: agentauth-grafana-prod
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.agentauth.example.com
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - agentauth-network
    depends_on:
      - prometheus

volumes:
  agentauth-data:
    driver: local
  agentauth-logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  agentauth-network:
    driver: bridge
