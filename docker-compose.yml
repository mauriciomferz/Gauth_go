services:
  # PostgreSQL database for RFC-0111 implementation
  postgres:
    image: postgres:16-alpine
    container_name: gauth-postgres
    environment:
      POSTGRES_DB: gauth
      POSTGRES_USER: gauth
      POSTGRES_PASSWORD: gauth_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gauth" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gauth-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: gauth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gauth-network

  # AgentAuth backend API server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: gauth-backend
    environment:
      # RFC-0111 Configuration
      GAUTH_AAP-001_ENABLED: "1"
      GAUTH_AAP-001_USE_MOCKS: "1"

      # Database Configuration
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: gauth
      DB_USER: gauth
      DB_PASSWORD: gauth_dev_password
      DB_SSLMODE: disable

      # Redis Configuration (optional)
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Authentication
      GAUTH_JWT_SIGNING_KEY: ${GAUTH_JWT_SIGNING_KEY}

      # Database Connection (Environment overrides)
      GAUTH_DB_HOST: postgres
      GAUTH_DB_USER: ${GAUTH_DB_USER}
      GAUTH_DB_PASSWORD: ${GAUTH_DB_PASSWORD}
      GAUTH_DB_NAME: ${GAUTH_DB_NAME}
      GAUTH_DB_PORT: "5432"
      GAUTH_DB_SSL_MODE: disable

      # Server Configuration
      PORT: "8080"
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gauth-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/beta/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React UI frontend
  frontend:
    build:
      context: .
      dockerfile: docker/legacy/Dockerfile.ui
    container_name: gauth-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gauth-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: gauth-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - gauth-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.0.0
    container_name: gauth-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - gauth-network
    depends_on:
      - prometheus
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  gauth-network:
    driver: bridge
