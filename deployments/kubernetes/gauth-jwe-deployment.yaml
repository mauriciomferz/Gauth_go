# Kubernetes Deployment for GAuth with JWE Encryption
# Includes: Deployment, Service, ConfigMap, Secrets, HPA

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: gauth
  labels:
    app: gauth
    environment: production

---
# ConfigMap for JWE Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: gauth-jwe-config
  namespace: gauth
data:
  GAUTH_JWE_ENABLED: "true"
  GAUTH_JWE_ALGORITHM: "RSA-OAEP-256"
  GAUTH_JWE_ENCRYPTION: "A256GCM"
  GAUTH_JWE_KEY_ID: "gauth-prod-2025-11"
  GAUTH_JWE_ROTATION_DAYS: "365"
  GAUTH_PORT: "8080"
  GAUTH_LOG_LEVEL: "info"

---
# Secret for JWE Keys (base64 encoded PEM files)
apiVersion: v1
kind: Secret
metadata:
  name: gauth-jwe-keys
  namespace: gauth
type: Opaque
data:
  # Base64 encoded RSA public key PEM
  # Generate: cat public.pem | base64 -w 0
  public.pem: LS0tLS1CRUdJTi... # Replace with actual base64 encoded public key
  
  # Base64 encoded RSA private key PEM
  # Generate: cat private.pem | base64 -w 0
  private.pem: LS0tLS1CRUdJTi... # Replace with actual base64 encoded private key

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauth-server
  namespace: gauth
  labels:
    app: gauth
    component: authorization-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gauth
      component: authorization-server
  template:
    metadata:
      labels:
        app: gauth
        component: authorization-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Init container to validate keys
      initContainers:
      - name: validate-keys
        image: alpine:latest
        command: ['sh', '-c', 'test -f /etc/gauth/keys/public.pem && test -f /etc/gauth/keys/private.pem']
        volumeMounts:
        - name: jwe-keys
          mountPath: /etc/gauth/keys
          readOnly: true
      
      containers:
      - name: gauth
        image: gauth:jwe-latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Environment from ConfigMap
        envFrom:
        - configMapRef:
            name: gauth-jwe-config
        
        # Environment from Secrets
        env:
        - name: GAUTH_JWE_PUBLIC_KEY
          value: "/etc/gauth/keys/public.pem"
        - name: GAUTH_JWE_PRIVATE_KEY
          value: "/etc/gauth/keys/private.pem"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gauth-db-credentials
              key: connection-string
        
        # Volume mounts
        volumeMounts:
        - name: jwe-keys
          mountPath: /etc/gauth/keys
          readOnly: true
        
        # Resource limits
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: jwe-keys
        secret:
          secretName: gauth-jwe-keys
          defaultMode: 0400
      
      # Node affinity (optional - spread across zones)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - gauth
              topologyKey: kubernetes.io/hostname

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: gauth-service
  namespace: gauth
  labels:
    app: gauth
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: gauth
    component: authorization-server

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gauth-hpa
  namespace: gauth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gauth-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Ingress (example - adjust for your ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gauth-ingress
  namespace: gauth
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - auth.example.com
    secretName: gauth-tls
  rules:
  - host: auth.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gauth-service
            port:
              number: 8080
