apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentauth-ingress
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # TLS certificate management with cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-staging  # Use letsencrypt-prod for production
    cert-manager.io/acme-challenge-type: http01
    
    # Rate limiting (production-ready)
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: 1m
    nginx.ingress.kubernetes.io/limit-rps: "100"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Content-Security-Policy: default-src 'self'";
    
    # Connection and timeout settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    
    # Enable CORS (if needed for frontend)
    nginx.ingress.kubernetes.io/enable-cors: "false"  # Set to true if needed
    
    # Load balancing
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: agentauth-session
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
spec:
  tls:
  - hosts:
    - agentauth-staging.yourdomain.com  # REPLACE with actual domain
    secretName: agentauth-tls
  
  rules:
  - host: agentauth-staging.yourdomain.com  # REPLACE with actual domain
    http:
      paths:
      # API endpoints
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: agentauth-service
            port:
              number: 80
      
      # Health check endpoint
      - path: /healthz
        pathType: Exact
        backend:
          service:
            name: agentauth-service
            port:
              number: 80
      
      # Metrics endpoint (should be restricted in production)
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: agentauth-service
            port:
              number: 9090
      
      # Web UI (if applicable)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentauth-service
            port:
              number: 80
---
# Separate ingress for Grafana (monitoring dashboard)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: agentauth-staging
  labels:
    app: grafana
    environment: staging
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # Basic auth for Grafana (optional, Grafana has its own auth)
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: grafana-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  tls:
  - hosts:
    - grafana-staging.yourdomain.com  # REPLACE with actual domain
    secretName: grafana-tls
  
  rules:
  - host: grafana-staging.yourdomain.com  # REPLACE with actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
---
# Separate ingress for Prometheus (metrics database)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: agentauth-staging
  labels:
    app: prometheus
    environment: staging
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # Basic auth for Prometheus
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  tls:
  - hosts:
    - prometheus-staging.yourdomain.com  # REPLACE with actual domain
    secretName: prometheus-tls
  
  rules:
  - host: prometheus-staging.yourdomain.com  # REPLACE with actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
