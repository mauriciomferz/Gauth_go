apiVersion: v1
kind: Namespace
metadata:
  name: agentauth-staging
  labels:
    name: agentauth-staging
    environment: staging
    app: agentauth
    managed-by: kubectl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentauth-staging-quota
  namespace: agentauth-staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "5"
    services.loadbalancers: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agentauth-staging-limits
  namespace: agentauth-staging
spec:
  limits:
  - max:
      cpu: "2"
      memory: 4Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 200m
      memory: 256Mi
    type: Container
