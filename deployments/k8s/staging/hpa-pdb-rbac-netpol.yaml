apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentauth-hpa
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentauth-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metric: HTTP requests per second (requires metrics-server)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes cooldown before scale down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min  # Choose the policy that scales down the least
    
    scaleUp:
      stabilizationWindowSeconds: 0  # Immediate scale up
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max  # Choose the policy that scales up the most
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentauth-pdb
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
spec:
  minAvailable: 2  # Always keep at least 2 pods running during disruptions
  selector:
    matchLabels:
      app: agentauth
      environment: staging
  unhealthyPodEvictionPolicy: IfHealthyBudget
---
# Service Account for AgentAuth pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentauth-service-account
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
automountServiceAccountToken: true
---
# Role for AgentAuth service account (minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentauth-role
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
rules:
# Allow reading ConfigMaps and Secrets
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

# Allow reading Services (for service discovery)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]

# Allow reading Pods (for health checks and metrics)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
# RoleBinding for AgentAuth service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentauth-role-binding
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
subjects:
- kind: ServiceAccount
  name: agentauth-service-account
  namespace: agentauth-staging
roleRef:
  kind: Role
  name: agentauth-role
  apiGroup: rbac.authorization.k8s.io
---
# NetworkPolicy: Restrict traffic to AgentAuth pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentauth-network-policy
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
spec:
  podSelector:
    matchLabels:
      app: agentauth
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow traffic from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow metrics scraping from Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow traffic from other AgentAuth pods (for distributed caching)
  - from:
    - podSelector:
        matchLabels:
          app: agentauth
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  
  # Allow connection to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow connection to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow HTTPS to external services (notary, TSA, external APIs)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8443
  
  # Allow HTTP for health checks and metrics
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
