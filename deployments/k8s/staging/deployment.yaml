apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentauth-deployment
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime rolling update
  selector:
    matchLabels:
      app: agentauth
      environment: staging
  template:
    metadata:
      labels:
        app: agentauth
        environment: staging
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/admin/metrics/prometheus"
    spec:
      serviceAccountName: agentauth-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Init container: Wait for PostgreSQL and Redis
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z postgres-service 5432; do
              echo "Waiting for PostgreSQL..."
              sleep 2
            done
            echo "PostgreSQL is ready!"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      
      - name: wait-for-redis
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z redis-service 6379; do
              echo "Waiting for Redis..."
              sleep 2
            done
            echo "Redis is ready!"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      
      containers:
      - name: agentauth
        image: agentauth:staging  # Build with: docker build -t agentauth:staging -f Dockerfile .
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        # Import all ConfigMap values
        - name: AGENTAUTH_WEB_PORT
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: AGENTAUTH_WEB_PORT
        - name: AGENTAUTH_HEALTH_URL
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: AGENTAUTH_HEALTH_URL
        
        # Feature flags
        - name: AGENTAUTH_CAPABILITY_ANCHOR_ENABLE
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: AGENTAUTH_CAPABILITY_ANCHOR_ENABLE
        - name: AGENTAUTH_CAP_ANCHOR_NOTARIZE
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: AGENTAUTH_CAP_ANCHOR_NOTARIZE
        - name: AGENTAUTH_ROTATIONS_V2_SIGN
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: AGENTAUTH_ROTATIONS_V2_SIGN
        - name: AGENTAUTH_MODEL_LIMIT_ATTEST_SIGN
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: AGENTAUTH_MODEL_LIMIT_ATTEST_SIGN
        - name: AGENTAUTH_OTEL_METRICS_ENABLE
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: AGENTAUTH_OTEL_METRICS_ENABLE
        
        # Database configuration with secret
        - name: POSTGRES_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSL_MODE)
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: postgres-password
        - name: POSTGRES_SSL_MODE
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_SSL_MODE
        
        # AgentAuth Server DB Config (Matches server_factory.go)
        - name: AGENTAUTH_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_HOST
        - name: AGENTAUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_PORT
        - name: AGENTAUTH_DB_USER
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_USER
        - name: AGENTAUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: postgres-password
        - name: AGENTAUTH_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_DB
        - name: AGENTAUTH_DB_SSL_MODE
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: POSTGRES_SSL_MODE
        
        # Redis configuration
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: redis-password
        
        # JWT configuration with secrets
        - name: JWT_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: JWT_ALGORITHM
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: jwt-private-key
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: jwt-public-key
        - name: AGENTAUTH_JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: jwt-private-key
        
        # Ed25519 signing keys
        - name: AGENTAUTH_ROTATIONS_V2_ED25519_KEYS
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: ed25519-keys
        
        # Logging configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: agentauth-config
              key: LOG_FORMAT
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: app-tmp
          mountPath: /app/tmp
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 30  # 60 seconds max startup time
          successThreshold: 1
        
        # Resource limits (production-ready)
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 1000m
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: app-tmp
        emptyDir: {}
      
      # Pod scheduling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agentauth
              topologyKey: kubernetes.io/hostname
      
      # Tolerate node taints
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
