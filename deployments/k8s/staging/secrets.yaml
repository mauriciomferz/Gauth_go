apiVersion: v1
kind: Secret
metadata:
  name: agentauth-secrets
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
type: Opaque
stringData:
  # PostgreSQL credentials (replace with actual secrets)
  # Use: kubectl create secret generic agentauth-secrets --from-literal=postgres-password=<actual-password>
  postgres-password: REPLACE_WITH_ACTUAL_PASSWORD
  
  # JWT RSA private key (PEM format)
  # Generate with: openssl genrsa -out jwt-private-key.pem 2048
  # Then: kubectl create secret generic agentauth-secrets --from-file=jwt-private-key=jwt-private-key.pem
  jwt-private-key: |
    REPLACE_WITH_RSA_PRIVATE_KEY_PEM
  
  # JWT RSA public key (PEM format)
  # Generate with: openssl rsa -in jwt-private-key.pem -pubout -out jwt-public-key.pem
  jwt-public-key: |
    REPLACE_WITH_RSA_PUBLIC_KEY_PEM
  
  # Ed25519 signing keys for rotation descriptors and attestations
  # Format: kid1:hex_private_key1,kid2:hex_private_key2
  # Generate with: openssl genpkey -algorithm ED25519 -out ed25519-key.pem
  # Convert to hex: openssl pkey -in ed25519-key.pem -text -noout
  ed25519-keys: REPLACE_WITH_ED25519_KEYS
  
  # Redis password (if authentication enabled)
  redis-password: REPLACE_WITH_REDIS_PASSWORD
  
  # Vault token (if using HashiCorp Vault for secrets management)
  vault-token: REPLACE_WITH_VAULT_TOKEN
  
  # API keys for external services
  notary-api-key: REPLACE_WITH_NOTARY_API_KEY
  tsa-api-key: REPLACE_WITH_TSA_API_KEY
  
  # Slack webhook URL for alerting
  slack-webhook-url: REPLACE_WITH_SLACK_WEBHOOK_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: agentauth-staging
  labels:
    app: postgres
    environment: staging
type: Opaque
stringData:
  # PostgreSQL superuser password
  postgres-password: REPLACE_WITH_POSTGRES_SUPERUSER_PASSWORD
  
  # Application user password (matches agentauth-secrets postgres-password)
  app-password: REPLACE_WITH_ACTUAL_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: agentauth-staging
  labels:
    app: redis
    environment: staging
type: Opaque
stringData:
  # Redis authentication password
  redis-password: REPLACE_WITH_REDIS_PASSWORD
---
# TLS certificate secret (managed by cert-manager)
# This will be auto-generated by cert-manager with Let's Encrypt
apiVersion: v1
kind: Secret
metadata:
  name: agentauth-tls
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
type: kubernetes.io/tls
stringData:
  # These will be populated by cert-manager
  tls.crt: ""
  tls.key: ""
