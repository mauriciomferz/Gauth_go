apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentauth-deployment-blue
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
    version: blue
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime
  selector:
    matchLabels:
      app: agentauth
      environment: staging
      version: blue
  template:
    metadata:
      labels:
        app: agentauth
        environment: staging
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agentauth-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Init containers to wait for dependencies
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until nc -z postgres-service.agentauth-staging.svc.cluster.local 5432; do
            echo "PostgreSQL not ready, waiting..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for Redis..."
          until nc -z redis-service.agentauth-staging.svc.cluster.local 6379; do
            echo "Redis not ready, waiting..."
            sleep 2
          done
          echo "Redis is ready!"
      
      containers:
      - name: agentauth
        image: your-registry/agentauth:blue  # Replace with actual registry
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: agentauth-config
        
        # Sensitive environment variables from Secrets
        env:
        - name: AGENTAUTH_JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: jwt-private-key
        - name: AGENTAUTH_JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: jwt-public-key
        - name: AGENTAUTH_ED25519_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: ed25519-private-key
        - name: AGENTAUTH_ED25519_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: agentauth-secrets
              key: ed25519-public-key
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis-password
        
        # Resource limits
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 1000m
        
        # Health probes
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/v1/beta/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6  # 60 seconds max startup time
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      # Pod affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agentauth
                - key: version
                  operator: In
                  values:
                  - blue
              topologyKey: kubernetes.io/hostname
