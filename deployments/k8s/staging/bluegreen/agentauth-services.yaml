apiVersion: v1
kind: Service
metadata:
  name: agentauth-service-blue
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
    version: blue
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: agentauth
    environment: staging
    version: blue
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: agentauth-service-green
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
    version: green
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: agentauth
    environment: staging
    version: green
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
