apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentauth-deployment-green
  namespace: agentauth-staging
  labels:
    app: agentauth
    environment: staging
    version: green
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime
  selector:
    matchLabels:
      app: agentauth
      environment: staging
      version: green
  template:
    metadata:
      labels:
        app: agentauth
        environment: staging
        version: green
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: agentauth
        image: agentauth:green
        imagePullPolicy: Never  # Use local image from Docker
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Simplified environment for local testing
        env:
        - name: AGENTAUTH_ENV
          value: "staging"
        - name: AGENTAUTH_LOG_LEVEL
          value: "debug"
        - name: AGENTAUTH_PORT
          value: "8080"
        - name: AGENTAUTH_DEV_MODE
          value: "true"
        
        # Resource limits (reduced for local testing)
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        
        # Health probes
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12  # 60 seconds max startup time
