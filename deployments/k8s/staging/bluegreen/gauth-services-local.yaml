---
# Service for Blue deployment
apiVersion: v1
kind: Service
metadata:
  name: gauth-service-blue
  namespace: gauth-staging
  labels:
    app: gauth
    version: blue
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080  # Accessible at localhost:9080 (mapped via kind)
    protocol: TCP
    name: http
  selector:
    app: gauth
    environment: staging
    version: blue

---
# Service for Green deployment
apiVersion: v1
kind: Service
metadata:
  name: gauth-service-green
  namespace: gauth-staging
  labels:
    app: gauth
    version: green
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081  # Accessible at localhost:30081
    protocol: TCP
    name: http
  selector:
    app: gauth
    environment: staging
    version: green

---
# Active service (used for traffic switching)
apiVersion: v1
kind: Service
metadata:
  name: gauth-service-active
  namespace: gauth-staging
  labels:
    app: gauth
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30082  # Accessible at localhost:30082
    protocol: TCP
    name: http
  selector:
    app: gauth
    environment: staging
    version: blue  # Initially points to blue
