apiVersion: v1
kind: Service
metadata:
  name: gauth-service
  namespace: gauth-staging
  labels:
    app: gauth
    environment: staging
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: gauth
    environment: staging
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gauth-service-headless
  namespace: gauth-staging
  labels:
    app: gauth
    environment: staging
spec:
  selector:
    app: gauth
    environment: staging
  clusterIP: None  # Headless service for pod-to-pod communication
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
