version: '3.8'

services:
  # GAuth Authorization Server with JWE Encryption
  gauth-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.jwe
    image: gauth:jwe-latest
    container_name: gauth-server
    ports:
      - "8080:8080"
    environment:
      # JWE Configuration
      GAUTH_JWE_ENABLED: "true"
      GAUTH_JWE_ALGORITHM: "RSA-OAEP-256"
      GAUTH_JWE_ENCRYPTION: "A256GCM"
      GAUTH_JWE_PUBLIC_KEY: "/etc/gauth/keys/public.pem"
      GAUTH_JWE_PRIVATE_KEY: "/etc/gauth/keys/private.pem"
      GAUTH_JWE_KEY_ID: "gauth-prod-2025-11"
      GAUTH_JWE_ROTATION_DAYS: "365"
      
      # Application Configuration
      GAUTH_PORT: "8080"
      GAUTH_LOG_LEVEL: "info"
      
      # Database (example)
      DATABASE_URL: "postgresql://gauth:secret@postgres:5432/gauth?sslmode=disable"
    
    volumes:
      # Mount JWE keys from host (SECURE: use secrets in production)
      - ./keys:/etc/gauth/keys:ro
      
      # Alternative: Mount keys from Docker volume
      # - gauth-keys:/etc/gauth/keys:ro
    
    secrets:
      # Production: Use Docker secrets for sensitive keys
      - source: gauth_private_key
        target: /run/secrets/private.pem
        mode: 0400
    
    networks:
      - gauth-network
    
    depends_on:
      - postgres
      - redis
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gauth-postgres
    environment:
      POSTGRES_USER: gauth
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gauth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gauth-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gauth-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - gauth-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: gauth-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gauth-network
    restart: unless-stopped

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: gauth-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - gauth-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  # Uncomment if using Docker volumes for keys
  # gauth-keys:

networks:
  gauth-network:
    driver: bridge

secrets:
  gauth_private_key:
    file: ./keys/private.pem
