groups:
  - name: gauthplus_alerts
    interval: 30s
    rules:
      # High validation failure rate
      - alert: AgentAuthPlusHighValidationFailureRate
        expr: |
          (rate(gauthplus_validations_total{result="failed"}[5m]) 
          / rate(gauthplus_validations_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: gauthplus
        annotations:
          summary: "High AgentAuth+ validation failure rate"
          description: "AgentAuth+ validation failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"

      # Cache hit rate too low
      - alert: AgentAuthPlusCacheHitRateLow
        expr: |
          (rate(gauthplus_cache_hits_total[5m]) 
          / (rate(gauthplus_cache_hits_total[5m]) + rate(gauthplus_cache_misses_total[5m]))) < 0.7
        for: 10m
        labels:
          severity: warning
          component: gauthplus
        annotations:
          summary: "Low AgentAuth+ cache hit rate for {{ $labels.cache_type }}"
          description: "Cache hit rate is {{ $value | humanizePercentage }} for {{ $labels.cache_type }} (threshold: 70%)"

      # High policy violation rate
      - alert: AgentAuthPlusHighPolicyViolationRate
        expr: rate(gauthplus_policy_violations_total[5m]) > 1
        for: 5m
        labels:
          severity: critical
          component: gauthplus
        annotations:
          summary: "High policy violation rate"
          description: "Policy violations of type {{ $labels.policy_type }} ({{ $labels.severity }}) occurring at {{ $value | humanize }} per second"

      # Validation latency too high
      - alert: AgentAuthPlusHighValidationLatency
        expr: |
          histogram_quantile(0.95, 
            rate(gauthplus_validation_duration_seconds_bucket[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          component: gauthplus
        annotations:
          summary: "High AgentAuth+ validation latency"
          description: "P95 validation duration for {{ $labels.feature }} is {{ $value }}s (threshold: 0.1s)"

      # Excessive delegation depth
      - alert: AgentAuthPlusExcessiveDelegationDepth
        expr: |
          histogram_quantile(0.95, 
            rate(gauthplus_delegation_depth_bucket[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          component: gauthplus
        annotations:
          summary: "Excessive delegation chain depth"
          description: "P95 delegation depth is {{ $value }} (threshold: 5)"

      # Frequent successor activations
      - alert: AgentAuthPlusFrequentSuccessorActivations
        expr: rate(gauthplus_successor_activations_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: gauthplus
        annotations:
          summary: "Frequent successor activations"
          description: "Successor activations occurring at {{ $value | humanize }} per second"

      # Critical fiduciary violations
      - alert: AgentAuthPlusCriticalFiduciaryViolations
        expr: rate(gauthplus_fiduciary_violations_total{severity="critical"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: gauthplus
        annotations:
          summary: "Critical fiduciary duty violations detected"
          description: "Critical {{ $labels.duty_type }} violations occurring at {{ $value | humanize }} per second"

      # Dual control approval failures
      - alert: AgentAuthPlusDualControlFailures
        expr: |
          (rate(gauthplus_dual_control_approvals_total{status="rejected"}[5m])
          / rate(gauthplus_dual_control_approvals_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          component: gauthplus
        annotations:
          summary: "High dual control rejection rate"
          description: "Dual control rejections for {{ $labels.action_type }} at {{ $value | humanizePercentage }} (threshold: 20%)"

      # AgentAuth+ service unavailable
      - alert: AgentAuthPlusServiceDown
        expr: up{job="gauth-service"} == 0
        for: 2m
        labels:
          severity: critical
          component: gauthplus
        annotations:
          summary: "AgentAuth+ service is down"
          description: "AgentAuth+ service has been unavailable for more than 2 minutes"

      # Cache size growing unexpectedly
      - alert: AgentAuthPlusCacheSizeExcessive
        expr: gauthplus_cache_size > 50000
        for: 10m
        labels:
          severity: warning
          component: gauthplus
        annotations:
          summary: "Excessive cache size for {{ $labels.cache_type }}"
          description: "Cache size is {{ $value }} entries (threshold: 50,000)"
