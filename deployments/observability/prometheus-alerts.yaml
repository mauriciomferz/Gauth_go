---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: agentauth-staging
  labels:
    app: prometheus
    component: monitoring
data:
  alerts.yml: |
    groups:
    # ========================================
    # Critical Alerts - Immediate Response
    # ========================================
    - name: agentauth_critical
      interval: 30s
      rules:
      # Pod down for more than 2 minutes
      - alert: AgentAuthPodDown
        expr: up{job="agentauth-service"} == 0
        for: 2m
        labels:
          severity: critical
          component: pod
          category: availability
        annotations:
          summary: "AgentAuth pod is down"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been down for more than 2 minutes"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthPodDown.md"
          
      # No healthy pods available
      - alert: AgentAuthServiceUnavailable
        expr: sum(up{job="agentauth-service"}) == 0
        for: 1m
        labels:
          severity: critical
          component: service
          category: availability
        annotations:
          summary: "AgentAuth service completely unavailable"
          description: "All AgentAuth pods are down - service is unavailable"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthServiceUnavailable.md"
      
      # Very high p99 latency (>2 seconds for 5 minutes)
      - alert: AgentAuthVeryHighLatency
        expr: |
          histogram_quantile(0.99, 
            rate(agentauth_rotation_signature_verify_latency_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: critical
          component: performance
          category: performance
        annotations:
          summary: "Very high p99 latency detected"
          description: "p99 signature verification latency is {{ $value | humanizeDuration }} (threshold: 2s)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthVeryHighLatency.md"
      
      # Memory usage approaching limit (>95% for 5 minutes)
      - alert: AgentAuthCriticalMemory
        expr: |
          (
            container_memory_usage_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"} 
            / 
            container_spec_memory_limit_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"}
          ) > 0.95
        for: 5m
        labels:
          severity: critical
          component: resources
          category: resources
        annotations:
          summary: "Critical memory usage"
          description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} of limit - may be OOMKilled soon"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthCriticalMemory.md"
      
      # Pod restart loop (>5 restarts in 15 minutes)
      - alert: AgentAuthPodRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="agentauth-staging",pod=~"agentauth-.*"}[15m]) > 5
        for: 5m
        labels:
          severity: critical
          component: kubernetes
          category: availability
        annotations:
          summary: "Pod in restart loop"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthPodRestartLoop.md"
    
    # ========================================
    # Performance Alerts
    # ========================================
    - name: agentauth_performance
      interval: 30s
      rules:
      # High error rate (>5% for 5 minutes)
      - alert: AgentAuthHighErrorRate
        expr: |
          (
            sum(rate(agentauth_errors_total[5m]) 
            / 
            sum(rate(agentauth_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: performance
          category: performance
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthHighErrorRate.md"
      
      # High p95 latency (>1 second for 5 minutes)
      - alert: AgentAuthHighLatency
        expr: |
          histogram_quantile(0.95, 
            rate(agentauth_rotation_signature_verify_latency_seconds_bucket[5m])
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          component: performance
          category: performance
        annotations:
          summary: "High p95 latency detected"
          description: "p95 signature verification latency is {{ $value | humanizeDuration }} (threshold: 1s)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthHighLatency.md"
    
    # ========================================
    # Resource Alerts
    # ========================================
    - name: agentauth_resources
      interval: 30s
      rules:
      # High CPU usage (>80% for 10 minutes)
      - alert: AgentAuthHighCPU
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="agentauth-staging",pod=~"agentauth-.*"}[5m]) 
          by (pod) > 0.8
        for: 10m
        labels:
          severity: warning
          component: resources
          category: resources
        annotations:
          summary: "High CPU usage"
          description: "Pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthHighCPU.md"
      
      # High memory usage (>85% of limit for 10 minutes)
      - alert: AgentAuthHighMemory
        expr: |
          (
            container_memory_usage_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"} 
            / 
            container_spec_memory_limit_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          component: resources
          category: resources
        annotations:
          summary: "High memory usage"
          description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} of limit (threshold: 85%)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthHighMemory.md"
    
    # ========================================
    # Business Logic Alerts
    # ========================================
    - name: agentauth_business
      interval: 60s
      rules:
      # Rotation chain not growing (no new continuity updates in 30 minutes)
      - alert: AgentAuthRotationChainStale
        expr: |
          increase(agentauth_rotation_v2_continuity_updates_total[30m]) == 0
          and
          agentauth_rotation_summary_chain_length > 0
        for: 30m
        labels:
          severity: warning
          component: business
          category: business
        annotations:
          summary: "Rotation chain appears stale"
          description: "No continuity updates in the last 30 minutes - chain may be stale"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthRotationChainStale.md"
      
      # Summary head age is very old (>24 hours)
      - alert: AgentAuthSummaryHeadOld
        expr: agentauth_rotation_summary_head_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
          component: business
          category: business
        annotations:
          summary: "Summary head is very old"
          description: "Summary head age is {{ $value | humanizeDuration }} (threshold: 24 hours)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthSummaryHeadOld.md"
      
      # Last anchor age is very old (>48 hours)
      - alert: AgentAuthLastAnchorOld
        expr: agentauth_rotation_summary_last_anchor_age_seconds > 172800
        for: 15m
        labels:
          severity: warning
          component: business
          category: business
        annotations:
          summary: "Last anchor is very old"
          description: "Last anchor age is {{ $value | humanizeDuration }} (threshold: 48 hours)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthLastAnchorOld.md"
    
    # ========================================
    # Kubernetes Alerts
    # ========================================
    - name: agentauth_kubernetes
      interval: 30s
      rules:
      # Pod not ready for extended period
      - alert: AgentAuthPodNotReady
        expr: |
          kube_pod_status_ready{namespace="agentauth-staging",pod=~"agentauth-.*",condition="false"} == 1
        for: 10m
        labels:
          severity: warning
          component: kubernetes
          category: availability
        annotations:
          summary: "Pod not ready"
          description: "Pod {{ $labels.pod }} has been in not-ready state for more than 10 minutes"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/AgentAuthPodNotReady.md"
    
    # ========================================
    # Database (PostgreSQL) Alerts - NEW
    # ========================================
    - name: agentauth_database
      interval: 30s
      rules:
      # PostgreSQL down
      - alert: PostgreSQLDown
        expr: pg_up{namespace="agentauth-staging"} == 0
        for: 2m
        labels:
          severity: critical
          component: database
          category: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL instance {{ $labels.instance }} has been down for more than 2 minutes"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/PostgreSQLDown.md"
      
      # High connection pool utilization (>80%)
      - alert: PostgreSQLHighConnectionPoolUsage
        expr: |
          (
            sum(pg_stat_database_numbackends{namespace="agentauth-staging"}) 
            / 
            sum(pg_settings_max_connections{namespace="agentauth-staging"})
          ) > 0.8
        for: 10m
        labels:
          severity: warning
          component: database
          category: database
        annotations:
          summary: "PostgreSQL connection pool utilization high"
          description: "Connection pool is {{ $value | humanizePercentage }} full (threshold: 80%)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/PostgreSQLHighConnectionPoolUsage.md"
      
      # Critical connection pool utilization (>95%)
      - alert: PostgreSQLCriticalConnectionPoolUsage
        expr: |
          (
            sum(pg_stat_database_numbackends{namespace="agentauth-staging"}) 
            / 
            sum(pg_settings_max_connections{namespace="agentauth-staging"})
          ) > 0.95
        for: 5m
        labels:
          severity: critical
          component: database
          category: database
        annotations:
          summary: "PostgreSQL connection pool nearly exhausted"
          description: "Connection pool is {{ $value | humanizePercentage }} full - may reject connections soon"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/PostgreSQLCriticalConnectionPoolUsage.md"
      
      # Slow query performance (p95 > 500ms)
      - alert: PostgreSQLSlowQueries
        expr: |
          histogram_quantile(0.95, 
            rate(pg_stat_statements_mean_time_seconds_bucket{namespace="agentauth-staging"}[5m])
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          component: database
          category: database
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "p95 query time is {{ $value | humanizeDuration }} (threshold: 500ms)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/PostgreSQLSlowQueries.md"
      
      # High database disk usage (>85%)
      - alert: PostgreSQLHighDiskUsage
        expr: |
          (
            pg_database_size_bytes{namespace="agentauth-staging"} 
            / 
            (10 * 1024 * 1024 * 1024)
          ) > 0.85
        for: 15m
        labels:
          severity: warning
          component: database
          category: database
        annotations:
          summary: "PostgreSQL disk usage high"
          description: "Database disk usage is {{ $value | humanizePercentage }} of 10GB allocation"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/PostgreSQLHighDiskUsage.md"
      
      # Too many idle connections (>50)
      - alert: PostgreSQLTooManyIdleConnections
        expr: |
          sum(pg_stat_activity_count{namespace="agentauth-staging",state="idle"}) > 50
        for: 15m
        labels:
          severity: warning
          component: database
          category: database
        annotations:
          summary: "PostgreSQL has too many idle connections"
          description: "{{ $value }} idle connections detected (threshold: 50)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/PostgreSQLTooManyIdleConnections.md"
    
    # ========================================
    # Redis Alerts - NEW
    # ========================================
    - name: agentauth_redis
      interval: 30s
      rules:
      # Redis down
      - alert: RedisDown
        expr: redis_up{namespace="agentauth-staging"} == 0
        for: 2m
        labels:
          severity: critical
          component: redis
          category: redis
        annotations:
          summary: "Redis instance is down"
          description: "Redis instance {{ $labels.instance }} has been down for more than 2 minutes"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/RedisDown.md"
      
      # High memory usage (>85%)
      - alert: RedisHighMemoryUsage
        expr: |
          (
            redis_memory_used_bytes{namespace="agentauth-staging"} 
            / 
            redis_memory_max_bytes{namespace="agentauth-staging"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          component: redis
          category: redis
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }} of max (threshold: 85%)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/RedisHighMemoryUsage.md"
      
      # Critical memory usage (>95%)
      - alert: RedisCriticalMemoryUsage
        expr: |
          (
            redis_memory_used_bytes{namespace="agentauth-staging"} 
            / 
            redis_memory_max_bytes{namespace="agentauth-staging"}
          ) > 0.95
        for: 5m
        labels:
          severity: critical
          component: redis
          category: redis
        annotations:
          summary: "Redis memory critically high"
          description: "Redis memory usage is {{ $value | humanizePercentage }} of max - evictions may occur"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/RedisCriticalMemoryUsage.md"
      
      # High eviction rate (>100/sec)
      - alert: RedisHighEvictionRate
        expr: |
          rate(redis_evicted_keys_total{namespace="agentauth-staging"}[5m]) > 100
        for: 10m
        labels:
          severity: warning
          component: redis
          category: redis
        annotations:
          summary: "Redis high eviction rate"
          description: "Redis is evicting {{ $value }} keys per second (threshold: 100/sec)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/RedisHighEvictionRate.md"
      
      # Low cache hit rate (<80%)
      - alert: RedisLowCacheHitRate
        expr: |
          (
            rate(redis_keyspace_hits_total{namespace="agentauth-staging"}[5m]) 
            / 
            (
              rate(redis_keyspace_hits_total{namespace="agentauth-staging"}[5m]) 
              + 
              rate(redis_keyspace_misses_total{namespace="agentauth-staging"}[5m])
            )
          ) < 0.8
        for: 15m
        labels:
          severity: warning
          component: redis
          category: redis
        annotations:
          summary: "Redis cache hit rate low"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 80%)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/RedisLowCacheHitRate.md"
      
      # Too many connected clients (>1000)
      - alert: RedisTooManyConnections
        expr: redis_connected_clients{namespace="agentauth-staging"} > 1000
        for: 10m
        labels:
          severity: warning
          component: redis
          category: redis
        annotations:
          summary: "Redis has too many client connections"
          description: "Redis has {{ $value }} connected clients (threshold: 1000)"
          runbook_url: "https://github.com/mauriciomferz/AgentAuth/blob/main/docs/runbooks/RedisTooManyConnections.md"
