
services:
  postgres:
    image: postgres:15-alpine
    container_name: gauth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gauth_dev_password
      POSTGRES_DB: gauth
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gauth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gauth-network

  # Optional: PostgreSQL Admin UI (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gauth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gauth.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - gauth-network
    profiles:
      - with-ui  # Only start with: docker-compose --profile with-ui up

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  gauth-network:
    driver: bridge
