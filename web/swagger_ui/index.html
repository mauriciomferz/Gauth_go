<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AgentAuth OpenAPI</title>
  <link rel="stylesheet" href="/ui/swagger/swagger-ui.css" />
  <style>
    body { margin:0; background:#121212; }
    .topbar { display:none; }
  </style>
</head>
<body>
  <div id="swagger"></div>
  <script src="/ui/swagger/swagger-ui-bundle.js"></script>
  <script src="/ui/swagger/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: '/api/openapi/agentauth.yaml',
        dom_id: '#swagger',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        deepLinking: true,
        showExtensions: true,
        showCommonExtensions: true,
        syntaxHighlight: { theme: 'nord' }
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
