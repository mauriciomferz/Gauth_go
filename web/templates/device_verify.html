<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Verification | GAuth</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin-bottom: 1.5rem;
            color: #1d1d1f;
        }
        p {
            margin-bottom: 1.5rem;
            color: #86868b;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0077ed;
        }
        .result {
            margin-top: 1rem;
            font-weight: 500;
        }
        .success { color: #28cd41; }
        .error { color: #ff3b30; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Connect Device</h1>
        <p>Enter the code displayed on your device</p>
        <form id="verifyForm">
            <input type="text" id="user_code" name="user_code" placeholder="XXXX-XXXX" value="{{ .code }}" required maxlength="9" autocomplete="off">
            <button type="submit">Verify Code</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('user_code').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('/device/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'user_code': code,
                        'action': 'authorize',
                        'user_id': 'test-user-123' // Simulating authenticated user
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = 'Success! You can return to your device.';
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.textContent = data.error_description || 'Verification failed';
                    resultDiv.className = 'result error';
                }
            } catch (err) {
                resultDiv.textContent = 'Network error occurred';
                resultDiv.className = 'result error';
            }
        });

        // Auto-format code input
        document.getElementById('user_code').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            if (value.length > 4) {
                value = value.slice(0, 4) + '-' + value.slice(4, 8);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
