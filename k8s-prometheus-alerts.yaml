---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
    - name: agentauth_critical
      interval: 30s
      rules:
      # Pod down for more than 2 minutes
      - alert: AgentAuthPodDown
        expr: up{job="agentauth-service"} == 0
        for: 2m
        labels:
          severity: critical
          component: pod
        annotations:
          summary: "AgentAuth pod is down"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been down for more than 2 minutes"
          
      # No healthy pods available
      - alert: AgentAuthServiceUnavailable
        expr: sum(up{job="agentauth-service"}) == 0
        for: 1m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "AgentAuth service completely unavailable"
          description: "All AgentAuth pods are down - service is unavailable"
    
    - name: agentauth_performance
      interval: 30s
      rules:
      # High error rate (>5% for 5 minutes)
      - alert: AgentAuthHighErrorRate
        expr: |
          (
            sum(rate(agentauth_errors_total[5m]) 
            / 
            sum(rate(agentauth_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"
      
      # High p95 latency (>1 second for 5 minutes)
      - alert: AgentAuthHighLatency
        expr: |
          histogram_quantile(0.95, 
            rate(agentauth_rotation_signature_verify_latency_seconds_bucket[5m])
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "High p95 latency detected"
          description: "p95 signature verification latency is {{ $value | humanizeDuration }} (threshold: 1s)"
      
      # High p99 latency (>2 seconds for 5 minutes)
      - alert: AgentAuthVeryHighLatency
        expr: |
          histogram_quantile(0.99, 
            rate(agentauth_rotation_signature_verify_latency_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: critical
          component: performance
        annotations:
          summary: "Very high p99 latency detected"
          description: "p99 signature verification latency is {{ $value | humanizeDuration }} (threshold: 2s)"
    
    - name: agentauth_resources
      interval: 30s
      rules:
      # High CPU usage (>80% for 10 minutes)
      - alert: AgentAuthHighCPU
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="agentauth-staging",pod=~"agentauth-.*"}[5m]) 
          by (pod) > 0.8
        for: 10m
        labels:
          severity: warning
          component: resources
        annotations:
          summary: "High CPU usage"
          description: "Pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"
      
      # High memory usage (>85% of limit for 10 minutes)
      - alert: AgentAuthHighMemory
        expr: |
          (
            container_memory_usage_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"} 
            / 
            container_spec_memory_limit_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          component: resources
        annotations:
          summary: "High memory usage"
          description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} of limit (threshold: 85%)"
      
      # Memory usage approaching limit (>95% for 5 minutes)
      - alert: AgentAuthCriticalMemory
        expr: |
          (
            container_memory_usage_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"} 
            / 
            container_spec_memory_limit_bytes{namespace="agentauth-staging",pod=~"agentauth-.*"}
          ) > 0.95
        for: 5m
        labels:
          severity: critical
          component: resources
        annotations:
          summary: "Critical memory usage"
          description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} of limit - may be OOMKilled soon"
    
    - name: agentauth_business
      interval: 60s
      rules:
      # Rotation chain not growing (no new continuity updates in 30 minutes)
      - alert: AgentAuthRotationChainStale
        expr: |
          increase(agentauth_rotation_v2_continuity_updates_total[30m]) == 0
          and
          agentauth_rotation_summary_chain_length > 0
        for: 30m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "Rotation chain appears stale"
          description: "No continuity updates in the last 30 minutes - chain may be stale"
      
      # Summary head age is very old (>24 hours)
      - alert: AgentAuthSummaryHeadOld
        expr: agentauth_rotation_summary_head_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "Summary head is very old"
          description: "Summary head age is {{ $value | humanizeDuration }} (threshold: 24 hours)"
      
      # Last anchor age is very old (>48 hours)
      - alert: AgentAuthLastAnchorOld
        expr: agentauth_rotation_summary_last_anchor_age_seconds > 172800
        for: 15m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "Last anchor is very old"
          description: "Last anchor age is {{ $value | humanizeDuration }} (threshold: 48 hours)"
    
    - name: agentauth_kubernetes
      interval: 30s
      rules:
      # Pod restart loop (>5 restarts in 15 minutes)
      - alert: AgentAuthPodRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="agentauth-staging",pod=~"agentauth-.*"}[15m]) > 5
        for: 5m
        labels:
          severity: critical
          component: kubernetes
        annotations:
          summary: "Pod in restart loop"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
      
      # Pod not ready for extended period
      - alert: AgentAuthPodNotReady
        expr: |
          kube_pod_status_ready{namespace="agentauth-staging",pod=~"agentauth-.*",condition="false"} == 1
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod not ready"
          description: "Pod {{ $labels.pod }} has been in not-ready state for more than 10 minutes"
